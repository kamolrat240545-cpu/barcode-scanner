<script>

/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzdIRuze-6cCmtKanisxekt6a7yl0pALUQIh6Wttt7hXwlPSanocPxlVhpRaC6qnWpBvw/exec";


/* =====================================================
   GLOBAL
===================================================== */

let barcodeReader = null;
let skuReader = null;

let barcodeScanning = false;
let skuScanning = false;

let barcodeLocked = false;
let skuLocked = false;

let barcodeVerified = false;

let skuList = [];


/* =====================================================
   ELEMENTS
===================================================== */

const barcodeVideo =
document.getElementById("barcodeVideo");

const skuVideo =
document.getElementById("skuVideo");


/* =====================================================
   STATUS
===================================================== */

function showStatus(id, message, type) {

  const el = document.getElementById(id);

  el.className =
    "status " + type;

  el.textContent = message;

  el.classList.remove("hidden");
}


function hideStatus(id) {

  document
    .getElementById(id)
    .classList.add("hidden");
}


/* =====================================================
   EMPLOYEE
===================================================== */

function getEmployee() {

  const value =
    document
      .getElementById("employee")
      .value
      .trim();

  if (!value) {
    return "";
  }

  // เก็บเฉพาะชื่อด้านหน้า |
  return value.split("|")[0].trim();
}


/* =====================================================
   BARCODE CAMERA
===================================================== */

async function startBarcodeScanner() {

  if (barcodeLocked) {
    return;
  }

  if (barcodeScanning) {
    return;
  }

  hideStatus("barcodeStatus");

  try {

    barcodeReader =
      new ZXingBrowser.BrowserMultiFormatReader();

    barcodeScanning = true;

    document
      .getElementById("barcodeStartBtn")
      .classList.add("hidden");

    document
      .getElementById("barcodeStopBtn")
      .classList.remove("hidden");

    document
      .getElementById("barcodePlaceholder")
      .classList.add("hidden");

    const devices =
      await ZXingBrowser.BrowserCodeReader
        .listVideoInputDevices();

    if (!devices.length) {
      throw new Error(
        "ไม่พบกล้อง"
      );
    }

    // พยายามใช้กล้องหลัง
    let deviceId =
      devices[devices.length - 1].deviceId;

    for (const device of devices) {

      const label =
        (device.label || "").toLowerCase();

      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ) {
        deviceId = device.deviceId;
        break;
      }
    }

    await barcodeReader.decodeFromVideoDevice(
      deviceId,
      barcodeVideo,
      (result, error) => {

        if (!barcodeScanning) {
          return;
        }

        if (!result) {
          return;
        }

        const text =
          String(
            result.getText() || ""
          ).trim();

        if (!text) {
          return;
        }

        /*
         * สำคัญมาก
         *
         * ล็อกทันที
         * ป้องกันกล้องอ่าน Barcode ตัวอื่น
         */
        if (barcodeLocked) {
          return;
        }

        barcodeLocked = true;

        // หยุดกล้องทันที
        stopBarcodeScanner();

        // ใส่ Barcode
        document
          .getElementById("barcodeInput")
          .value = text;

        // ตรวจซ้ำทันที
        checkBarcode(text);

      }
    );

  } catch (error) {

    barcodeScanning = false;

    showStatus(
      "barcodeStatus",
      "❌ เปิดกล้องไม่ได้: " +
      error.message,
      "error"
    );

    resetBarcodeCameraUI();
  }
}


/* =====================================================
   STOP BARCODE
===================================================== */

function stopBarcodeScanner() {

  barcodeScanning = false;

  try {

    if (barcodeReader) {
      barcodeReader.reset();
    }

  } catch (e) {}

  try {

    if (barcodeVideo.srcObject) {

      barcodeVideo
        .srcObject
        .getTracks()
        .forEach(track => track.stop());

      barcodeVideo.srcObject = null;
    }

  } catch (e) {}

  resetBarcodeCameraUI();
}


function resetBarcodeCameraUI() {

  document
    .getElementById("barcodeStartBtn")
    .classList.remove("hidden");

  document
    .getElementById("barcodeStopBtn")
    .classList.add("hidden");

  document
    .getElementById("barcodePlaceholder")
    .classList.remove("hidden");
}


/* =====================================================
   CHECK BARCODE
===================================================== */

function checkBarcodeManual() {

  const barcode =
    document
      .getElementById("barcodeInput")
      .value
      .trim();

  if (!barcode) {

    showStatus(
      "barcodeStatus",
      "❌ กรุณากรอกหรือสแกน Barcode",
      "error"
    );

    return;
  }

  barcodeLocked = true;

  stopBarcodeScanner();

  checkBarcode(barcode);
}


function checkBarcode(barcode) {

  showStatus(
    "barcodeStatus",
    "⏳ กำลังตรวจสอบ Barcode...",
    "info"
  );

  barcodeVerified = false;

  const callbackName =
    "barcodeCheck_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 10000);

  window[callbackName] =
    function(data) {

      try {

        if (!data || data.success !== true) {

          showStatus(
            "barcodeStatus",
            "❌ ตรวจสอบ Barcode ไม่สำเร็จ",
            "error"
          );

          barcodeLocked = false;

          return;
        }

        if (data.duplicate === true) {

          /*
           * Barcode ซ้ำ
           * ไม่เปิด SKU
           */
          barcodeVerified = false;

          document
            .getElementById("skuSection")
            .classList.add("hidden");

          showStatus(
            "barcodeStatus",
            "⚠️ Barcode ซ้ำ! " +
            barcode,
            "warning"
          );

          return;
        }

        /*
         * Barcode ไม่ซ้ำ
         */
        barcodeVerified = true;

        document
          .getElementById("skuSection")
          .classList.remove("hidden");

        showStatus(
          "barcodeStatus",
          "✅ Barcode สามารถใช้ได้",
          "success"
        );

      } finally {

        delete window[callbackName];

        const script =
          document.getElementById(
            callbackName
          );

        if (script) {
          script.remove();
        }
      }

    };

  const script =
    document.createElement("script");

  script.id = callbackName;

  script.src =
    API_URL +
    "?action=checkBarcode" +
    "&barcode=" +
    encodeURIComponent(barcode) +
    "&callback=" +
    callbackName +
    "&_=" +
    Date.now();

  script.onerror =
    function() {

      showStatus(
        "barcodeStatus",
        "❌ ไม่สามารถเชื่อมต่อระบบตรวจสอบ Barcode ได้",
        "error"
      );

      delete window[callbackName];

      barcodeLocked = false;

      script.remove();
    };

  document.body.appendChild(script);
}


/* =====================================================
   SKU CAMERA
===================================================== */

async function startSkuScanner() {

  if (!barcodeVerified) {

    showStatus(
      "skuStatus",
      "❌ กรุณาตรวจสอบ Barcode ก่อน",
      "error"
    );

    return;
  }

  if (skuLocked) {
    return;
  }

  if (skuScanning) {
    return;
  }

  hideStatus("skuStatus");

  try {

    skuReader =
      new ZXingBrowser.BrowserMultiFormatReader();

    skuScanning = true;

    document
      .getElementById("skuStartBtn")
      .classList.add("hidden");

    document
      .getElementById("skuStopBtn")
      .classList.remove("hidden");

    document
      .getElementById("skuPlaceholder")
      .classList.add("hidden");

    const devices =
      await ZXingBrowser.BrowserCodeReader
        .listVideoInputDevices();

    if (!devices.length) {
      throw new Error("ไม่พบกล้อง");
    }

    let deviceId =
      devices[devices.length - 1].deviceId;

    for (const device of devices) {

      const label =
        (device.label || "").toLowerCase();

      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ) {
        deviceId = device.deviceId;
        break;
      }
    }

    await skuReader.decodeFromVideoDevice(
      deviceId,
      skuVideo,
      (result, error) => {

        if (!skuScanning) {
          return;
        }

        if (!result) {
          return;
        }

        const text =
          String(
            result.getText() || ""
          ).trim();

        if (!text) {
          return;
        }

        /*
         * ล็อก SKU ทันที
         */
        if (skuLocked) {
          return;
        }

        skuLocked = true;

        /*
         * หยุดกล้องทันที
         * ไม่อ่าน SKU ตัวถัดไป
         */
        stopSkuScanner();

        addSku(text);

      }
    );

  } catch (error) {

    skuScanning = false;

    showStatus(
      "skuStatus",
      "❌ เปิดกล้อง SKU ไม่ได้: " +
      error.message,
      "error"
    );

    resetSkuCameraUI();
  }
}


/* =====================================================
   STOP SKU CAMERA
===================================================== */

function stopSkuScanner() {

  skuScanning = false;

  try {

    if (skuReader) {
      skuReader.reset();
    }

  } catch (e) {}

  try {

    if (skuVideo.srcObject) {

      skuVideo
        .srcObject
        .getTracks()
        .forEach(track => track.stop());

      skuVideo.srcObject = null;
    }

  } catch (e) {}

  resetSkuCameraUI();
}


function resetSkuCameraUI() {

  document
    .getElementById("skuStartBtn")
    .classList.remove("hidden");

  document
    .getElementById("skuStopBtn")
    .classList.add("hidden");

  document
    .getElementById("skuPlaceholder")
    .classList.remove("hidden");
}


/* =====================================================
   ADD SKU
===================================================== */

function addSkuManual() {

  const input =
    document.getElementById("skuInput");

  const value =
    input.value.trim();

  if (!value) {

    showStatus(
      "skuStatus",
      "❌ กรุณากรอกหรือสแกน SKU",
      "error"
    );

    return;
  }

  addSku(value);
}


function addSku(value) {

  value =
    String(value)
      .trim();

  if (!value) {
    return;
  }

  skuList.push(value);

  document
    .getElementById("skuInput")
    .value = "";

  renderSkuTable();

  showStatus(
    "skuStatus",
    "✅ เพิ่ม SKU เรียบร้อย: " + value,
    "success"
  );

  /*
   * ปลดล็อกเพื่อให้เปิดกล้องสแกน SKU ตัวต่อไปได้
   *
   * แต่จะไม่สแกนตัวต่อไปเอง
   */
  skuLocked = false;
}


/* =====================================================
   SKU TABLE
===================================================== */

function renderSkuTable() {

  const tbody =
    document.getElementById(
      "skuTableBody"
    );

  if (skuList.length === 0) {

    tbody.innerHTML = `
      <tr>
        <td colspan="3" class="empty">
          ยังไม่มีรายการ SKU
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML = "";

  skuList.forEach(
    function(sku, index) {

      const tr =
        document.createElement("tr");

      tr.innerHTML = `
        <td>${index + 1}</td>

        <td>
          ${escapeHtml(sku)}
        </td>

        <td>
          <button
            class="delete-btn"
            onclick="deleteSku(${index})">
            🗑️ ลบ
          </button>
        </td>
      `;

      tbody.appendChild(tr);
    }
  );
}


function deleteSku(index) {

  skuList.splice(index, 1);

  renderSkuTable();
}


/* =====================================================
   SAVE DATA
===================================================== */

async function saveData() {

  const employee =
    getEmployee();

  const barcode =
    document
      .getElementById("barcodeInput")
      .value
      .trim();

  if (!employee) {

    showStatus(
      "saveStatus",
      "❌ กรุณาเลือกชื่อพนักงาน",
      "error"
    );

    return;
  }

  if (!barcode) {

    showStatus(
      "saveStatus",
      "❌ ไม่มี Barcode",
      "error"
    );

    return;
  }

  if (!barcodeVerified) {

    showStatus(
      "saveStatus",
      "❌ กรุณาตรวจสอบ Barcode ก่อน",
      "error"
    );

    return;
  }

  if (skuList.length === 0) {

    showStatus(
      "saveStatus",
      "❌ กรุณาเพิ่ม SKU อย่างน้อย 1 รายการ",
      "error"
    );

    return;
  }

  const saveBtn =
    document.getElementById(
      "saveBtn"
    );

  saveBtn.disabled = true;

  showStatus(
    "saveStatus",
    "⏳ กำลังบันทึกข้อมูล...",
    "info"
  );

  const data = {

    employee: employee,

    barcode: barcode,

    skus: skuList

  };

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(data)
        }
      );

    const result =
      await response.json();

    if (result.success === true) {

      showStatus(
        "saveStatus",
        "✅ บันทึกข้อมูลเรียบร้อยแล้ว",
        "success"
      );

      loadHistory();

      /*
       * หลังบันทึกสำเร็จ
       * เคลียร์ Barcode + SKU
       * เพื่อเริ่มออเดอร์ใหม่
       */
      setTimeout(
        function() {

          document
            .getElementById(
              "barcodeInput"
            )
            .value = "";

          skuList = [];

          renderSkuTable();

          document
            .getElementById(
              "skuSection"
            )
            .classList.add("hidden");

          barcodeVerified = false;

          barcodeLocked = false;

          skuLocked = false;

          hideStatus("barcodeStatus");

        },
        800
      );

    } else {

      if (result.duplicate === true) {

        barcodeVerified = false;

        showStatus(
          "saveStatus",
          "⚠️ Barcode ซ้ำ! ไม่สามารถบันทึกได้",
          "warning"
        );

      } else {

        showStatus(
          "saveStatus",
          "❌ " +
          (result.message ||
           "บันทึกไม่สำเร็จ"),
          "error"
        );
      }
    }

  } catch (error) {

    showStatus(
      "saveStatus",
      "❌ เชื่อมต่อ Google Sheets ไม่สำเร็จ: " +
      error.message,
      "error"
    );

  } finally {

    saveBtn.disabled = false;
  }
}


/* =====================================================
   HISTORY JSONP
===================================================== */

function loadHistory() {

  const callbackName =
    "history_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 10000);

  window[callbackName] =
    function(data) {

      try {

        if (
          !data ||
          data.success !== true
        ) {

          renderHistory([]);

          return;
        }

        renderHistory(
          data.history || []
        );

      } finally {

        delete window[callbackName];

        const script =
          document.getElementById(
            callbackName
          );

        if (script) {
          script.remove();
        }
      }

    };

  const script =
    document.createElement("script");

  script.id = callbackName;

  script.src =
    API_URL +
    "?action=history" +
    "&callback=" +
    callbackName +
    "&_=" +
    Date.now();

  script.onerror =
    function() {

      renderHistory([]);

      delete window[callbackName];

      script.remove();
    };

  document.body.appendChild(script);
}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(history) {

  const tbody =
    document.getElementById(
      "historyBody"
    );

  if (!history || history.length === 0) {

    tbody.innerHTML = `
      <tr>
        <td colspan="4" class="empty">
          ยังไม่มีประวัติ
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML = "";

  history.forEach(
    function(item) {

      const tr =
        document.createElement("tr");

      /*
       * เวลาใน Google Sheets
       * จะถูกแสดงทั้งวันที่และเวลา
       */
      const time =
        formatDateTime(
          item.time
        );

      tr.innerHTML = `

        <td>
          ${escapeHtml(time)}
        </td>

        <td>
          ${escapeHtml(
            item.employee || ""
          )}
        </td>

        <td>
          ${escapeHtml(
            item.barcode || ""
          )}
        </td>

        <td>
          ${escapeHtml(
            item.sku || ""
          )}
        </td>

      `;

      tbody.appendChild(tr);
    }
  );
}


/* =====================================================
   FORMAT DATE TIME
===================================================== */

function formatDateTime(value) {

  if (!value) {
    return "";
  }

  const text =
    String(value).trim();

  /*
   * ถ้า Apps Script ส่งมาเป็น
   * 28/8/2026, 10:07:10
   * ให้แสดงตามนั้น
   */
  if (
    text.includes(",") &&
    /\d{1,2}:\d{2}/.test(text)
  ) {

    return text;
  }

  /*
   * ถ้าเป็นวันที่อย่างเดียว
   * จะไม่เติมเวลาปลอม
   */
  return text;
}


/* =====================================================
   CLEAR
===================================================== */

function clearAll() {

  stopBarcodeScanner();
  stopSkuScanner();

  document
    .getElementById(
      "barcodeInput"
    )
    .value = "";

  document
    .getElementById(
      "skuInput"
    )
    .value = "";

  skuList = [];

  renderSkuTable();

  document
    .getElementById(
      "skuSection"
    )
    .classList.add("hidden");

  barcodeVerified = false;

  barcodeLocked = false;

  skuLocked = false;

  hideStatus("barcodeStatus");
  hideStatus("skuStatus");
  hideStatus("saveStatus");
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =====================================================
   ENTER KEY
===================================================== */

document
  .getElementById("barcodeInput")
  .addEventListener(
    "keydown",
    function(e) {

      if (e.key === "Enter") {

        e.preventDefault();

        checkBarcodeManual();
      }
    }
  );


document
  .getElementById("skuInput")
  .addEventListener(
    "keydown",
    function(e) {

      if (e.key === "Enter") {

        e.preventDefault();

        addSkuManual();
      }
    }
  );


/* =====================================================
   AUTO LOAD HISTORY
===================================================== */

window.addEventListener(
  "load",
  function() {

    loadHistory();

  }
);

</script>
