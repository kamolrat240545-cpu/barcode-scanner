<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzdIRuze-6cCmtKanisxekt6a7yl0pALUQIh6Wttt7hXwlPSanocPxlVhpRaC6qnWpBvw/exec";


/* =====================================================
   VARIABLES
===================================================== */

let barcodeScanner = null;
let skuScanner = null;

let barcodeScanning = false;
let skuScanning = false;

let barcodeProcessing = false;
let skuProcessing = false;

let skus = [];


/* =====================================================
   ELEMENTS
===================================================== */

const employeeEl =
  document.getElementById("employee");

const barcodeEl =
  document.getElementById("barcode");

const skuInputEl =
  document.getElementById("skuInput");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(id, type, text) {

  const el = document.getElementById(id);

  if (!el) return;

  el.className = "message " + type;
  el.innerHTML = text;
}


/* =====================================================
   BARCODE CAMERA
===================================================== */

async function startBarcodeScanner() {

  if (barcodeScanning) return;

  barcodeProcessing = false;

  document
    .getElementById("barcode-camera-area")
    .classList.remove("hidden");

  document
    .getElementById("openBarcodeBtn")
    .classList.add("hidden");

  try {

    barcodeScanner =
      new Html5Qrcode("barcode-reader");

    barcodeScanning = true;

    await barcodeScanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(viewfinderWidth,
                        viewfinderHeight) {

          const size =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.70;

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0

      },

      function(decodedText) {

        handleBarcodeScan(decodedText);

      },

      function(errorMessage) {

        // ไม่ต้องแสดง error ระหว่างกล้องกำลังหา Barcode

      }

    );

  } catch (error) {

    barcodeScanning = false;

    document
      .getElementById("barcode-camera-area")
      .classList.add("hidden");

    document
      .getElementById("openBarcodeBtn")
      .classList.remove("hidden");

    showMessage(
      "barcode-message",
      "error",
      "❌ เปิดกล้องไม่ได้: " +
      escapeHtml(error.message || error)
    );

  }

}


/* =====================================================
   BARCODE SCAN
   จุดสำคัญ:
   ล็อกทันทีเมื่อเจอ Barcode
   เพื่อไม่ให้กล้องอ่านตัวอื่นต่อ
===================================================== */

async function handleBarcodeScan(decodedText) {

  if (barcodeProcessing) {
    return;
  }

  barcodeProcessing = true;

  const value =
    String(decodedText || "").trim();

  if (!value) {

    barcodeProcessing = false;
    return;

  }

  // หยุดกล้องทันที
  await stopBarcodeScanner();

  barcodeEl.value = value;

  showMessage(
    "barcode-message",
    "info",
    "🔍 กำลังตรวจสอบ Barcode..."
  );

  await checkBarcode(value);

}


/* =====================================================
   STOP BARCODE CAMERA
===================================================== */

async function stopBarcodeScanner() {

  barcodeScanning = false;

  if (barcodeScanner) {

    try {

      if (
        barcodeScanner.getState &&
        barcodeScanner.getState() === 2
      ) {

        await barcodeScanner.stop();

      } else {

        try {
          await barcodeScanner.stop();
        } catch(e) {}

      }

    } catch (error) {

      console.log(
        "Barcode scanner stop:",
        error
      );

    }

    try {
      await barcodeScanner.clear();
    } catch(e) {}

    barcodeScanner = null;
  }

  document
    .getElementById("barcode-camera-area")
    .classList.add("hidden");

  document
    .getElementById("openBarcodeBtn")
    .classList.remove("hidden");
}


/* =====================================================
   CHECK BARCODE MANUAL
===================================================== */

async function checkBarcodeManual() {

  const value =
    barcodeEl.value.trim();

  if (!value) {

    showMessage(
      "barcode-message",
      "error",
      "❌ กรุณากรอกหรือสแกน Barcode"
    );

    return;

  }

  barcodeProcessing = true;

  await checkBarcode(value);

}


/* =====================================================
   CHECK BARCODE WITH GOOGLE APPS SCRIPT
===================================================== */

function checkBarcode(barcode) {

  return new Promise(function(resolve) {

    const callbackName =
      "barcodeCheck_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 10000);

    const script =
      document.createElement("script");

    const timeout =
      setTimeout(function() {

        cleanup();

        showMessage(
          "barcode-message",
          "error",
          "❌ ตรวจสอบ Barcode ไม่สำเร็จ"
        );

        barcodeProcessing = false;

        resolve(false);

      }, 15000);


    function cleanup() {

      clearTimeout(timeout);

      try {
        delete window[callbackName];
      } catch(e) {}

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    }


    window[callbackName] =
      function(data) {

        cleanup();

        if (!data || !data.success) {

          showMessage(
            "barcode-message",
            "error",
            "❌ " +
            escapeHtml(
              data && data.message
                ? data.message
                : "ตรวจสอบไม่สำเร็จ"
            )
          );

          barcodeProcessing = false;

          resolve(false);

          return;
        }


        if (data.duplicate) {

          showMessage(
            "barcode-message",
            "warning",
            "⚠️ Barcode ซ้ำ! " +
            escapeHtml(barcode)
          );

          barcodeProcessing = false;

          resolve(false);

          return;
        }


        showMessage(
          "barcode-message",
          "success",
          "✅ Barcode สามารถใช้ได้"
        );

        barcodeProcessing = false;

        // Barcode ผ่านแล้ว
        // ให้ผู้ใช้ไปสแกน SKU
        setTimeout(function() {

          skuInputEl.focus();

        }, 200);

        resolve(true);

      };


    script.onerror = function() {

      cleanup();

      showMessage(
        "barcode-message",
        "error",
        "❌ เชื่อมต่อ Google Sheets ไม่สำเร็จ"
      );

      barcodeProcessing = false;

      resolve(false);

    };


    script.src =
      API_URL +
      "?action=checkBarcode" +
      "&barcode=" +
      encodeURIComponent(barcode) +
      "&callback=" +
      callbackName +
      "&_=" +
      Date.now();

    document.body.appendChild(script);

  });

}


/* =====================================================
   SKU CAMERA
===================================================== */

async function startSkuScanner() {

  if (skuScanning) return;

  skuProcessing = false;

  document
    .getElementById("sku-camera-area")
    .classList.remove("hidden");

  document
    .getElementById("openSkuBtn")
    .classList.add("hidden");


  try {

    skuScanner =
      new Html5Qrcode("sku-reader");

    skuScanning = true;

    await skuScanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(viewfinderWidth,
                        viewfinderHeight) {

          const size =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.70;

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0

      },

      function(decodedText) {

        handleSkuScan(decodedText);

      },

      function(errorMessage) {

        // ไม่ต้องทำอะไร

      }

    );

  } catch(error) {

    skuScanning = false;

    document
      .getElementById("sku-camera-area")
      .classList.add("hidden");

    document
      .getElementById("openSkuBtn")
      .classList.remove("hidden");

    showMessage(
      "sku-message",
      "error",
      "❌ เปิดกล้อง SKU ไม่ได้: " +
      escapeHtml(error.message || error)
    );

  }

}


/* =====================================================
   SKU SCAN
   เจอแล้วหยุดทันที
===================================================== */

async function handleSkuScan(decodedText) {

  if (skuProcessing) {
    return;
  }

  skuProcessing = true;

  const value =
    String(decodedText || "").trim();

  if (!value) {

    skuProcessing = false;
    return;

  }

  // หยุดกล้องทันที
  await stopSkuScanner();

  skuInputEl.value = value;

  addSku(value);

}


/* =====================================================
   STOP SKU CAMERA
===================================================== */

async function stopSkuScanner() {

  skuScanning = false;

  if (skuScanner) {

    try {

      await skuScanner.stop();

    } catch(e) {

      console.log(
        "SKU scanner stop:",
        e
      );

    }

    try {
      await skuScanner.clear();
    } catch(e) {}

    skuScanner = null;
  }

  document
    .getElementById("sku-camera-area")
    .classList.add("hidden");

  document
    .getElementById("openSkuBtn")
    .classList.remove("hidden");
}


/* =====================================================
   ADD SKU MANUAL
===================================================== */

function addSkuManual() {

  const value =
    skuInputEl.value.trim();

  if (!value) {

    showMessage(
      "sku-message",
      "error",
      "❌ กรุณากรอกหรือสแกน SKU"
    );

    return;

  }

  addSku(value);
}


/* =====================================================
   ADD SKU
===================================================== */

function addSku(value) {

  value =
    String(value || "").trim();

  if (!value) {

    skuProcessing = false;
    return;

  }

  // ไม่ให้ SKU ซ้ำในรายการเดียวกัน
  const exists =
    skus.some(function(item) {

      return item.toUpperCase() ===
             value.toUpperCase();

    });


  if (exists) {

    showMessage(
      "sku-message",
      "warning",
      "⚠️ SKU นี้มีอยู่แล้ว"
    );

    skuInputEl.value = "";

    skuProcessing = false;

    return;

  }


  skus.push(value);

  skuInputEl.value = "";

  renderSkuList();

  showMessage(
    "sku-message",
    "success",
    "✅ เพิ่ม SKU เรียบร้อยแล้ว"
  );

  skuProcessing = false;

}


/* =====================================================
   RENDER SKU
===================================================== */

function renderSkuList() {

  const box =
    document.getElementById("skuList");

  if (skus.length === 0) {

    box.innerHTML =
      `<div style="
        text-align:center;
        padding:15px;
        color:#777;">
        ยังไม่มีรายการ SKU
      </div>`;

    return;
  }


  let html = "";

  skus.forEach(function(sku, index) {

    html += `
      <div class="sku-row">

        <input
          value="${escapeHtml(sku)}"
          readonly>

        <button
          class="sku-delete"
          onclick="removeSku(${index})">
          🗑️
        </button>

      </div>
    `;

  });

  box.innerHTML = html;
}


/* =====================================================
   REMOVE SKU
===================================================== */

function removeSku(index) {

  skus.splice(index, 1);

  renderSkuList();

}


/* =====================================================
   SAVE
===================================================== */

async function saveData() {

  const employee =
    employeeEl.value.trim();

  const barcode =
    barcodeEl.value.trim();


  if (!employee) {

    showMessage(
      "save-message",
      "error",
      "❌ กรุณาเลือกชื่อพนักงาน"
    );

    return;

  }


  if (!barcode) {

    showMessage(
      "save-message",
      "error",
      "❌ กรุณาสแกน Barcode"
    );

    return;

  }


  if (skus.length === 0) {

    showMessage(
      "save-message",
      "error",
      "❌ กรุณาเพิ่ม SKU อย่างน้อย 1 รายการ"
    );

    return;

  }


  const saveBtn =
    document.getElementById("saveBtn");

  saveBtn.disabled = true;

  saveBtn.innerText =
    "⏳ กำลังบันทึก...";


  try {

    const payload = {

      employee: employee,

      barcode: barcode,

      skus: skus

    };


    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify(payload)

      });


    const result =
      await response.json();


    if (!result.success) {

      showMessage(
        "save-message",
        "error",
        "❌ " +
        escapeHtml(
          result.message ||
          "บันทึกไม่สำเร็จ"
        )
      );

      return;

    }


    showMessage(
      "save-message",
      "success",
      "✅ บันทึกข้อมูลเรียบร้อยแล้ว"
    );


    // ล้าง Barcode + SKU
    barcodeEl.value = "";

    skus = [];

    renderSkuList();

    document
      .getElementById("barcode-message")
      .innerHTML = "";

    document
      .getElementById("sku-message")
      .innerHTML = "";


    // โหลดประวัติใหม่
    loadHistory();

  } catch(error) {

    showMessage(
      "save-message",
      "error",
      "❌ บันทึกไม่สำเร็จ: " +
      escapeHtml(error.message || error)
    );

  } finally {

    saveBtn.disabled = false;

    saveBtn.innerText =
      "💾 บันทึกข้อมูลลง Google Sheets";

  }

}


/* =====================================================
   CLEAR
===================================================== */

function clearAll() {

  if (
    !confirm(
      "ต้องการล้าง Barcode และ SKU ที่กำลังกรอกใช่หรือไม่?"
    )
  ) {
    return;
  }


  barcodeEl.value = "";

  skuInputEl.value = "";

  skus = [];

  barcodeProcessing = false;
  skuProcessing = false;

  renderSkuList();

  document
    .getElementById("barcode-message")
    .innerHTML = "";

  document
    .getElementById("sku-message")
    .innerHTML = "";

  document
    .getElementById("save-message")
    .innerHTML = "";

}


/* =====================================================
   HISTORY
===================================================== */

function loadHistory() {

  const body =
    document.getElementById("historyBody");

  body.innerHTML = `
    <tr>
      <td colspan="4">
        <div class="loading">
          ⏳ กำลังโหลด...
        </div>
      </td>
    </tr>
  `;


  const callbackName =
    "history_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 10000);


  const script =
    document.createElement("script");


  const timeout =
    setTimeout(function() {

      cleanup();

      body.innerHTML = `
        <tr>
          <td colspan="4">
            ❌ โหลดประวัติไม่สำเร็จ
          </td>
        </tr>
      `;

    }, 15000);


  function cleanup() {

    clearTimeout(timeout);

    try {
      delete window[callbackName];
    } catch(e) {}

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

  }


  window[callbackName] =
    function(data) {

      cleanup();

      if (
        !data ||
        !data.success ||
        !Array.isArray(data.history)
      ) {

        body.innerHTML = `
          <tr>
            <td colspan="4">
              ❌ ไม่พบข้อมูล
            </td>
          </tr>
        `;

        return;

      }


      if (data.history.length === 0) {

        body.innerHTML = `
          <tr>
            <td colspan="4">
              ยังไม่มีประวัติ
            </td>
          </tr>
        `;

        return;

      }


      let html = "";


      data.history.forEach(function(row) {

        html += `
          <tr>

            <td>
              ${formatDateTime(row.time)}
            </td>

            <td>
              ${escapeHtml(
                row.employee || ""
              )}
            </td>

            <td>
              ${escapeHtml(
                row.barcode || ""
              )}
            </td>

            <td>
              ${escapeHtml(
                row.sku || ""
              )}
            </td>

          </tr>
        `;

      });


      body.innerHTML = html;

    };


  script.onerror = function() {

    cleanup();

    body.innerHTML = `
      <tr>
        <td colspan="4">
          ❌ เชื่อมต่อ Google Sheets ไม่สำเร็จ
        </td>
      </tr>
    `;

  };


  script.src =
    API_URL +
    "?action=history" +
    "&callback=" +
    callbackName +
    "&_=" +
    Date.now();


  document.body.appendChild(script);

}


/* =====================================================
   FORMAT DATE / TIME
===================================================== */

function formatDateTime(value) {

  if (!value) return "";


  const text =
    String(value).trim();


  /*
    Google Sheets บางครั้งส่งมาเป็น

    28/8/2026
    28/8/2026, 10:07:10

    ถ้ามีเวลาอยู่แล้ว ให้แสดงตามนั้น
  */

  if (
    text.includes(":")
  ) {

    return escapeHtml(text);

  }


  /*
    ถ้าไม่มีเวลา
    ให้แสดงเฉพาะวันที่
  */

  return escapeHtml(text);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    renderSkuList();

    loadHistory();

  }
);

</script>
