table {

th,

th {

<!-- =====================================================
     BARCODE
===================================================== -->

<div class="card">

<h2>📦 สแกน Barcode</h2>

<div class="camera">

<video id="barcodeVideo" autoplay muted playsinline></video>

<div id="barcodeText" class="camera-text">
กดเปิดกล้องเพื่อสแกน Barcode
</div>

</div>

<button
class="green"
onclick="startBarcode()">

📷 เปิดกล้อง Barcode

</button>

<button
class="gray"
onclick="stopCamera()">

⏹ ปิดกล้อง

</button>

id="barcode"
type="text"
placeholder="สแกน Barcode">

<div id="barcodeAlert" class="alert"></div>

</div>


<!-- =====================================================
     SKU
===================================================== -->

<div class="card">

<h2>🏷️ สแกน SKU</h2>

<div class="camera">

<video id="skuVideo" autoplay muted playsinline></video>

<div id="skuText" class="camera-text">
กดเปิดกล้องเพื่อสแกน SKU
</div>

</div>

<button
class="green"
onclick="startSKU()">

📷 เปิดกล้อง SKU

</button>

<button
class="gray"
onclick="stopCamera()">

⏹ ปิดกล้อง

</button>

<label>SKU</label>

<input
id="skuInput"
type="text"
placeholder="สแกนหรือพิมพ์ SKU">

class="blue"
onclick="addSKU()">

➕ เพิ่ม SKU

</button>

</div>


<!-- =====================================================
     SKU LIST
===================================================== -->

<div class="card">

<h2>📋 รายการ SKU</h2>

จำนวน SKU:
<strong id="skuCount">0</strong>
</div>

<thead>

<tr>
<th>#</th>
<th>SKU</th>
<th>ลบ</th>
</tr>

</thead>

<tr>
<td colspan="3" class="empty">
ยังไม่มี SKU
</td>
</tr>

</tbody>

<!-- =====================================================
     SAVE
===================================================== -->

<div class="card">

<button
id="saveButton"
class="green"
onclick="saveData()">

💾 บันทึกข้อมูลลง Google Sheets

</button>

<button
class="gray"
onclick="clearAll()">

🗑️ ล้างข้อมูล

</button>

<div id="saveAlert" class="alert"></div>

</div>

<script>

/* =====================================================
   APPS SCRIPT URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxQdfCr4ubi7pZMRh9YwXzSbRWbhHH0xrzSmZ09JZeH_tAllrVjUoked06I8WhCJSSsRg/exec";


/* =====================================================
   VARIABLES
===================================================== */

let skuList = [];

let reader = null;


/* =====================================================
   SHOW ALERT
===================================================== */

function showAlert(id, text, type) {

  const el =
    document.getElementById(id);

  el.className =
    "alert " + type;

  el.textContent =
    text;

}


/* =====================================================
   HIDE ALERT
===================================================== */

function hideAlert(id) {

  const el =
    document.getElementById(id);

  el.className =
    "alert";

  el.textContent =
    "";

}


/* =====================================================
   START BARCODE
===================================================== */

async function startBarcode() {

  stopCamera();

  try {

    reader =
      new ZXing.BrowserMultiFormatReader();

    const video =
      document.getElementById(
        "barcodeVideo"
      );

    document.getElementById(
      "barcodeText"
    ).textContent =
      "กำลังสแกน Barcode...";

    await reader.decodeFromVideoDevice(
      undefined,
      video,
      function(result) {

        if (!result) return;

        const code =
          result.getText().trim();

        if (!code) return;

        document.getElementById(
          "barcode"
        ).value = code;

        showAlert(
          "barcodeAlert",
          "✅ สแกน Barcode สำเร็จ",
          "success"
        );

        stopCamera();

      }
    );

  } catch (error) {

    console.error(error);

    showAlert(
      "barcodeAlert",
      "❌ เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง",
      "error"
    );

  }

}


/* =====================================================
   START SKU
===================================================== */

async function startSKU() {

  stopCamera();

  try {

    reader =
      new ZXing.BrowserMultiFormatReader();

    const video =
      document.getElementById(
        "skuVideo"
      );

    document.getElementById(
      "skuText"
    ).textContent =
      "กำลังสแกน SKU...";

    await reader.decodeFromVideoDevice(
      undefined,
      video,
      function(result) {

        if (!result) return;

        const code =
          result.getText().trim();

        if (!code) return;

        document.getElementById(
          "skuInput"
        ).value = code;

        addSKU();

        stopCamera();

      }
    );

  } catch (error) {

    console.error(error);

    showAlert(
      "skuAlert",
      "❌ เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง",
      "error"
    );

  }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {

  if (reader) {

    try {
      reader.reset();
    } catch (e) {}

    reader = null;

  }

  document.getElementById(
    "barcodeText"
  ).textContent =
    "กดเปิดกล้องเพื่อสแกน Barcode";

  document.getElementById(
    "skuText"
  ).textContent =
    "กดเปิดกล้องเพื่อสแกน SKU";

}


/* =====================================================
   ADD SKU
===================================================== */

function addSKU() {

  const input =
    document.getElementById(
      "skuInput"
    );

  const sku =
    input.value.trim();

  if (!sku) {

    showAlert(
      "skuAlert",
      "❌ กรุณาสแกนหรือกรอก SKU",
      "error"
    );

    return;

  }

  /*
   SKU ซ้ำได้
   */

  skuList.push(sku);

  input.value = "";

  renderSKU();

  showAlert(
    "skuAlert",
    "✅ เพิ่ม SKU สำเร็จ",
    "success"
  );

}


/* =====================================================
   RENDER SKU
===================================================== */

function renderSKU() {

  const table =
    document.getElementById(
      "skuTable"
    );

  document.getElementById(
    "skuCount"
  ).textContent =
    skuList.length;

  if (skuList.length === 0) {

    table.innerHTML = `
      <tr>
        <td colspan="3" class="empty">
          ยังไม่มี SKU
        </td>
      </tr>
    `;

    return;

  }

  table.innerHTML = "";

  skuList.forEach(
    function(sku, index) {

      const row =
        document.createElement("tr");

      row.innerHTML = `
        <td>
          ${index + 1}
        </td>

        <td>
          ${escapeHTML(sku)}
        </td>

        <td>

          <button
            class="red"
            style="margin:0;padding:8px;"
            onclick="deleteSKU(${index})">

            ลบ

          </button>

        </td>
      `;

      table.appendChild(row);

    }
  );

}


/* =====================================================
   DELETE SKU
===================================================== */

function deleteSKU(index) {

  skuList.splice(index, 1);

  renderSKU();

}


/* =====================================================
   SAVE DATA
===================================================== */

async function saveData() {

  const employee =
    document.getElementById(
      "employee"
    ).value.trim();

  const barcode =
    document.getElementById(
      "barcode"
    ).value.trim();


  if (!employee) {

    showAlert(
      "saveAlert",
      "⚠️ กรุณาเลือกชื่อพนักงาน",
      "error"
    );

    return;

  }


  if (!barcode) {

    showAlert(
      "saveAlert",
      "⚠️ กรุณาสแกน Barcode",
      "error"
    );

    return;

  }


  if (skuList.length === 0) {

    showAlert(
      "saveAlert",
      "⚠️ กรุณาสแกน SKU อย่างน้อย 1 รายการ",
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "saveButton"
    );

  button.disabled = true;

  button.textContent =
    "⏳ กำลังบันทึก...";


  showAlert(
    "saveAlert",
    "⏳ กำลังส่งข้อมูลไป Google Sheets...",
    "warning"
  );


  /*
   ส่งเป็น FormData
   เพื่อหลีกเลี่ยงปัญหา CORS
  */

  const formData =
    new FormData();

  formData.append(
    "employee",
    employee
  );

  formData.append(
    "barcode",
    barcode
  );

  formData.append(
    "skus",
    JSON.stringify(skuList)
  );


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",
          body: formData
        }
      );


    const text =
      await response.text();


    console.log(
      "Apps Script response:",
      text
    );


    let result;

    try {

      result =
        JSON.parse(text);

    } catch (e) {

      /*
       ถ้า Apps Script ตอบกลับมา
       แต่ browser อ่าน JSON ไม่ได้
       ให้ถือว่าส่งคำขอแล้ว
      */

      result = {
        success: true
      };

    }


    if (
      result.duplicate === true
    ) {

      showAlert(
        "saveAlert",
        "⚠️ Barcode นี้ซ้ำ ไม่ได้บันทึก",
        "error"
      );

      alert(
        "⚠️ Barcode ซ้ำ!\n\n" +
        barcode
      );

      return;

    }


    if (
      result.success === false
    ) {

      throw new Error(
        result.message ||
        "Google Sheets ไม่สามารถบันทึกข้อมูลได้"
      );

    }


    showAlert(
      "saveAlert",
      "✅ บันทึกข้อมูลสำเร็จแล้ว",
      "success"
    );


    alert(
      "✅ บันทึกสำเร็จ!\n\n" +
      "พนักงาน: " +
      employee +
      "\n\n" +
      "Barcode: " +
      barcode +
      "\n\n" +
      "จำนวน SKU: " +
      skuList.length
    );


    /*
     ล้าง Barcode และ SKU
     เพื่อเริ่มรายการใหม่
    */

    document.getElementById(
      "barcode"
    ).value = "";

    document.getElementById(
      "skuInput"
    ).value = "";

    skuList = [];

    renderSKU();


  } catch (error) {

    console.error(error);

    showAlert(
      "saveAlert",
      "❌ บันทึกไม่สำเร็จ: " +
      error.message,
      "error"
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "💾 บันทึกข้อมูลลง Google Sheets";

  }

}


/* =====================================================
   CLEAR
===================================================== */

function clearAll() {

  document.getElementById(
    "barcode"
  ).value = "";

  document.getElementById(
    "skuInput"
  ).value = "";

  skuList = [];

  hideAlert("barcodeAlert");

  hideAlert("skuAlert");

  hideAlert("saveAlert");

  renderSKU();

  stopCamera();

}


/* =====================================================
   ENTER = ADD SKU
===================================================== */

document
.getElementById("skuInput")
.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      addSKU();

    }

  }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value;

  return div.innerHTML;

}


/* =====================================================
   INIT
===================================================== */

renderSKU();

</script>

</body>
</html>
