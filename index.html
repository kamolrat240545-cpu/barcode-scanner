<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>ระบบสแกน Barcode / SKU</title>

  <!-- ZXing Barcode Scanner -->
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Thai", "Noto Sans Myanmar", sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 15px;
    }

    header {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
    }

    section {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 13px 15px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .btn-green {
      background: #18a957;
      color: white;
    }

    .btn-blue {
      background: #1976d2;
      color: white;
    }

    .btn-red {
      background: #d32f2f;
      color: white;
    }

    .btn-gray {
      background: #777;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .camera-box {
      width: 100%;
      height: 280px;
      background: #111;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      font-size: 17px;
      pointer-events: none;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: none;
    }

    .status.success {
      display: block;
      background: #e8f8ef;
      color: #087f3f;
      border: 1px solid #b8e8ca;
    }

    .status.error {
      display: block;
      background: #fdeaea;
      color: #b71c1c;
      border: 1px solid #f2bcbc;
    }

    .status.info {
      display: block;
      background: #eaf3ff;
      color: #155fa0;
      border: 1px solid #bdd8f5;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 9px;
      text-align: left;
    }

    th {
      background: #eaf2ff;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .counter {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .small {
      font-size: 13px;
      color: #777;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 21px;
      }

      .section-title {
        font-size: 18px;
      }

      .camera-box {
        height: 260px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <header>
    <h1>📦 ระบบสแกน Barcode / SKU</h1>
    <div class="subtitle">
      ระบบบันทึก Barcode และ SKU ลง Google Sheets
    </div>
  </header>


  <!-- พนักงาน -->
  <section>
    <div class="section-title">👤 ข้อมูลผู้สแกน</div>

    <label for="employee">ชื่อคนสแกน</label>

    <input
      id="employee"
      type="text"
      placeholder="กรอกชื่อคนสแกน เช่น SAN LIN"
      autocomplete="off"
    >
  </section>


  <!-- BARCODE -->
  <section>

    <div class="section-title">📦 Barcode</div>

    <div class="camera-box">
      <video id="video" autoplay muted playsinline></video>

      <div id="cameraMessage" class="camera-message">
        กดปุ่มด้านล่างเพื่อเปิดกล้อง
      </div>
    </div>

    <button
      id="startCameraBtn"
      class="btn-green"
      onclick="startScanner()"
    >
      📷 เปิดกล้องสแกน Barcode
    </button>

    <button
      id="stopCameraBtn"
      class="btn-red"
      onclick="stopScanner()"
      style="display:none;"
    >
      ⛔ ปิดกล้อง
    </button>

    <label for="barcodeInput">Barcode ที่สแกนได้</label>

    <input
      id="barcodeInput"
      type="text"
      placeholder="สามารถพิมพ์ Barcode เองได้"
      autocomplete="off"
    >

  </section>


  <!-- SKU -->
  <section>

    <div class="section-title">🏷️ SKU</div>

    <label for="skuInput">กรอก SKU</label>

    <input
      id="skuInput"
      type="text"
      placeholder="พิมพ์ SKU"
      autocomplete="off"
    >

    <button
      class="btn-green"
      onclick="addSKU()"
    >
      ➕ เพิ่ม SKU
    </button>

    <div id="skuStatus" class="status"></div>

  </section>


  <!-- รายการ SKU -->
  <section>

    <div class="section-title">
      ☑️ รายการ SKU ภายใต้ Barcode นี้
    </div>

    <div class="counter">
      จำนวน SKU: <span id="skuCount">0</span>
    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>#</th>
            <th>รหัส SKU</th>
            <th>เวลา</th>
            <th>จัดการ</th>
          </tr>
        </thead>

        <tbody id="skuTableBody">

          <tr>
            <td colspan="4" class="empty">
              ยังไม่มีรายการ
            </td>
          </tr>

        </tbody>

      </table>

    </div>

    <br>

    <button
      class="btn-blue"
      onclick="saveData()"
    >
      💾 บันทึกข้อมูล
    </button>

    <button
      class="btn-gray"
      onclick="clearCurrent()"
    >
      🗑️ ล้างรายการนี้
    </button>

    <div id="saveStatus" class="status"></div>

  </section>


  <!-- ประวัติ -->
  <section>

    <div class="section-title">
      🕘 ประวัติการสแกนล่าสุด
    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>#</th>
            <th>เวลา</th>
            <th>ผู้สแกน</th>
            <th>ประเภท</th>
            <th>ข้อมูล</th>
          </tr>
        </thead>

        <tbody id="historyBody">

          <tr>
            <td colspan="5" class="empty">
              ยังไม่มีประวัติในเครื่องนี้
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </section>

</div>


<script>

  /*
   ============================================================
   GOOGLE APPS SCRIPT API
   ============================================================
  */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzAItW_zCe786FtP5-bjUrQXU4Fv_pgr5TK8IDRDYnMBjYIRxJl6tOedfsbYjCSH2aUGQ/exec";


  /*
   ============================================================
   ตัวแปรระบบ
   ============================================================
  */

  let codeReader = null;
  let selectedDeviceId = null;

  let skuList = [];

  let currentBarcode = "";

  let historyList = [];


  /*
   ============================================================
   ELEMENTS
   ============================================================
  */

  const video =
    document.getElementById("video");

  const barcodeInput =
    document.getElementById("barcodeInput");

  const skuInput =
    document.getElementById("skuInput");

  const employeeInput =
    document.getElementById("employee");

  const skuTableBody =
    document.getElementById("skuTableBody");

  const skuCount =
    document.getElementById("skuCount");

  const historyBody =
    document.getElementById("historyBody");

  const cameraMessage =
    document.getElementById("cameraMessage");


  /*
   ============================================================
   เปิดกล้อง
   ============================================================
  */

  async function startScanner() {

    try {

      if (!window.ZXing) {
        showStatus(
          "saveStatus",
          "ไม่สามารถโหลดระบบสแกน Barcode ได้",
          "error"
        );
        return;
      }

      codeReader =
        new ZXing.BrowserMultiFormatReader();

      const devices =
        await codeReader.listVideoInputDevices();

      if (!devices || devices.length === 0) {

        showStatus(
          "saveStatus",
          "ไม่พบกล้องในอุปกรณ์นี้",
          "error"
        );

        return;
      }

      /*
       * เลือกกล้องหลังเป็นอันดับแรก
       */

      selectedDeviceId =
        devices[devices.length - 1].deviceId;

      cameraMessage.textContent =
        "กำลังเปิดกล้อง...";

      document.getElementById(
        "startCameraBtn"
      ).style.display = "none";

      document.getElementById(
        "stopCameraBtn"
      ).style.display = "block";


      /*
       * เริ่มสแกน
       */

      codeReader.decodeFromVideoDevice(
        selectedDeviceId,
        video,
        (result, error) => {

          if (result) {

            const code =
              result.getText();

            if (code) {

              barcodeInput.value = code;

              currentBarcode = code;

              cameraMessage.textContent =
                "✅ สแกนได้: " + code;

              addHistory(
                "Barcode",
                code
              );

              /*
               * หยุดกล้องหลังสแกนสำเร็จ
               */

              stopScanner();

              /*
               * ให้ SKU พร้อมกรอกทันที
               */

              skuInput.focus();
            }

          }

        }
      );

    } catch (error) {

      console.error(error);

      showStatus(
        "saveStatus",
        "เปิดกล้องไม่ได้: " +
        error.message,
        "error"
      );

      stopScanner();
    }
  }


  /*
   ============================================================
   ปิดกล้อง
   ============================================================
  */

  function stopScanner() {

    try {

      if (codeReader) {
        codeReader.reset();
      }

    } catch (e) {
      console.log(e);
    }

    document.getElementById(
      "startCameraBtn"
    ).style.display = "block";

    document.getElementById(
      "stopCameraBtn"
    ).style.display = "none";

    cameraMessage.textContent =
      "กดปุ่มด้านล่างเพื่อเปิดกล้อง";
  }


  /*
   ============================================================
   เพิ่ม SKU
   ============================================================
  */

  function addSKU() {

    const sku =
      skuInput.value.trim();

    if (!sku) {

      showStatus(
        "skuStatus",
        "กรุณากรอก SKU ก่อน",
        "error"
      );

      skuInput.focus();

      return;
    }


    /*
     * ป้องกัน SKU ซ้ำ
     */

    if (skuList.includes(sku)) {

      showStatus(
        "skuStatus",
        "SKU นี้มีอยู่ในรายการแล้ว",
        "error"
      );

      skuInput.select();

      return;
    }


    /*
     * เพิ่ม SKU
     */

    skuList.push({
      sku: sku,
      time: new Date()
    });


    skuInput.value = "";

    renderSKU();

    showStatus(
      "skuStatus",
      "✓ เพิ่ม SKU สำเร็จ",
      "success"
    );

    addHistory(
      "SKU",
      sku
    );

    skuInput.focus();
  }


  /*
   ============================================================
   รองรับกด Enter เพื่อเพิ่ม SKU
   ============================================================
  */

  skuInput.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        addSKU();
      }

    }
  );


  /*
   ============================================================
   แสดงรายการ SKU
   ============================================================
  */

  function renderSKU() {

    skuCount.textContent =
      skuList.length;

    if (skuList.length === 0) {

      skuTableBody.innerHTML = `
        <tr>
          <td colspan="4" class="empty">
            ยังไม่มีรายการ
          </td>
        </tr>
      `;

      return;
    }


    skuTableBody.innerHTML =
      skuList.map(
        (item, index) => {

          return `
            <tr>

              <td>
                ${index + 1}
              </td>

              <td>
                ${escapeHTML(item.sku)}
              </td>

              <td>
                ${formatDate(item.time)}
              </td>

              <td>

                <button
                  class="btn-red"
                  style="margin:0;"
                  onclick="removeSKU(${index})"
                >
                  ลบ
                </button>

              </td>

            </tr>
          `;

        }
      ).join("");
  }


  /*
   ============================================================
   ลบ SKU
   ============================================================
  */

  function removeSKU(index) {

    skuList.splice(index, 1);

    renderSKU();
  }


  /*
   ============================================================
   บันทึกข้อมูลเข้า Google Sheets
   ============================================================
  */

  async function saveData() {

    const employee =
      employeeInput.value.trim();

    const barcode =
      barcodeInput.value.trim();


    /*
     * ตรวจสอบชื่อ
     */

    if (!employee) {

      showStatus(
        "saveStatus",
        "กรุณากรอกชื่อคนสแกนก่อน",
        "error"
      );

      employeeInput.focus();

      return;
    }


    /*
     * ตรวจสอบ Barcode
     */

    if (!barcode) {

      showStatus(
        "saveStatus",
        "กรุณาสแกนหรือกรอก Barcode ก่อน",
        "error"
      );

      barcodeInput.focus();

      return;
    }


    /*
     * ตรวจสอบ SKU
     */

    if (skuList.length === 0) {

      showStatus(
        "saveStatus",
        "กรุณาเพิ่ม SKU อย่างน้อย 1 รายการ",
        "error"
      );

      skuInput.focus();

      return;
    }


    /*
     * สร้างข้อมูลที่จะส่ง
     */

    const payload = {

      employee: employee,

      barcode: barcode,

      skus: skuList.map(
        item => item.sku
      ),

      barcodeTime:
        new Date().toISOString()

    };


    /*
     * แสดงสถานะกำลังบันทึก
     */

    showStatus(
      "saveStatus",
      "⏳ กำลังบันทึกข้อมูล...",
      "info"
    );


    try {

      const response =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(payload)
          }
        );


      const text =
        await response.text();

      console.log(
        "Server response:",
        text
      );


      let result;

      try {

        result =
          JSON.parse(text);

      } catch (e) {

        result = {
          success:
            response.ok,
          message:
            text
        };
      }


      if (
        result.success === true ||
        response.ok
      ) {

        showStatus(
          "saveStatus",
          "✅ บันทึกข้อมูลลง Google Sheets สำเร็จแล้ว",
          "success"
        );


        /*
         * เก็บประวัติการบันทึก
         */

        addHistory(
          "บันทึก",
          barcode +
          " / " +
          skuList
            .map(x => x.sku)
            .join(", ")
        );


        /*
         * ล้างรายการ SKU
         */

        skuList = [];

        barcodeInput.value = "";

        currentBarcode = "";

        renderSKU();

      } else {

        throw new Error(
          result.error ||
          result.message ||
          "ไม่สามารถบันทึกข้อมูลได้"
        );
      }

    } catch (error) {

      console.error(
        "SAVE ERROR:",
        error
      );

      showStatus(
        "saveStatus",
        "❌ บันทึกไม่สำเร็จ: " +
        error.message,
        "error"
      );
    }

  }


  /*
   ============================================================
   ล้างรายการปัจจุบัน
   ============================================================
  */

  function clearCurrent() {

    skuList = [];

    barcodeInput.value = "";

    currentBarcode = "";

    renderSKU();

    showStatus(
      "saveStatus",
      "ล้างรายการเรียบร้อยแล้ว",
      "info"
    );
  }


  /*
   ============================================================
   ประวัติการสแกน
   ============================================================
  */

  function addHistory(type, data) {

    historyList.unshift({

      time: new Date(),

      employee:
        employeeInput.value.trim() ||
        "-",

      type: type,

      data: data

    });


    /*
     * เก็บไว้สูงสุด 20 รายการ
     */

    if (historyList.length > 20) {

      historyList =
        historyList.slice(0, 20);
    }

    renderHistory();
  }


  function renderHistory() {

    if (historyList.length === 0) {

      historyBody.innerHTML = `
        <tr>
          <td colspan="5" class="empty">
            ยังไม่มีประวัติในเครื่องนี้
          </td>
        </tr>
      `;

      return;
    }


    historyBody.innerHTML =
      historyList.map(
        (item, index) => {

          return `
            <tr>

              <td>
                ${index + 1}
              </td>

              <td>
                ${formatDate(item.time)}
              </td>

              <td>
                ${escapeHTML(item.employee)}
              </td>

              <td>
                ${escapeHTML(item.type)}
              </td>

              <td>
                ${escapeHTML(item.data)}
              </td>

            </tr>
          `;

        }
      ).join("");
  }


  /*
   ============================================================
   STATUS MESSAGE
   ============================================================
  */

  function showStatus(
    elementId,
    message,
    type
  ) {

    const element =
      document.getElementById(
        elementId
      );

    element.textContent =
      message;

    element.className =
      "status " + type;
  }


  /*
   ============================================================
   FORMAT DATE
   ============================================================
  */

  function formatDate(date) {

    const d =
      new Date(date);

    return d.toLocaleString(
      "th-TH",
      {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }
    );
  }


  /*
   ============================================================
   ป้องกัน HTML แปลก ๆ
   ============================================================
  */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /*
   ============================================================
   โหลดข้อมูลเริ่มต้น
   ============================================================
  */

  renderSKU();

  renderHistory();

</script>

</body>
</html>
