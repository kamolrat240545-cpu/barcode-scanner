<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบสแกน Barcode / SKU</title>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans Thai", sans-serif;
  background: #f4f6f8;
  color: #222;
}

.container {
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h1 {
  font-size: 28px;
  margin: 0 0 10px;
}

h2 {
  font-size: 23px;
  margin: 0 0 18px;
}

.subtitle {
  font-size: 18px;
  color: #666;
}

label {
  display: block;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

input,
select {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  border: 2px solid #ccc;
  border-radius: 12px;
  background: white;
  outline: none;
}

input:focus,
select:focus {
  border-color: #2196f3;
}

button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 15px;
  font-size: 19px;
  cursor: pointer;
  margin-top: 12px;
}

.btn-green {
  background: #16a34a;
  color: white;
}

.btn-blue {
  background: #2563eb;
  color: white;
}

.btn-red {
  background: #dc2626;
  color: white;
}

.btn-gray {
  background: #6b7280;
  color: white;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.camera-box {
  width: 100%;
  height: 300px;
  background: #111;
  border-radius: 15px;
  overflow: hidden;
  position: relative;
  margin-bottom: 12px;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.camera-message {
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  transform: translateY(-50%);
  color: white;
  text-align: center;
  font-size: 19px;
  pointer-events: none;
}

.result-box {
  padding: 14px;
  background: #f3f4f6;
  border-radius: 12px;
  font-size: 18px;
  margin-top: 10px;
  word-break: break-all;
}

.alert {
  padding: 15px;
  border-radius: 12px;
  margin-top: 12px;
  font-size: 17px;
  display: none;
}

.alert.success {
  background: #dcfce7;
  color: #166534;
  display: block;
}

.alert.error {
  background: #fee2e2;
  color: #991b1b;
  display: block;
}

.alert.warning {
  background: #fef3c7;
  color: #92400e;
  display: block;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
}

th,
td {
  border: 1px solid #ddd;
  padding: 12px;
  text-align: center;
  font-size: 16px;
}

th {
  background: #eef2ff;
}

.empty {
  text-align: center;
  color: #777;
  padding: 25px;
}

.small {
  font-size: 14px;
  color: #777;
}

.hidden {
  display: none !important;
}

.status {
  margin-top: 10px;
  text-align: center;
  font-size: 16px;
  color: #555;
}

@media(max-width:600px) {
  h1 {
    font-size: 25px;
  }

  h2 {
    font-size: 21px;
  }

  .card {
    padding: 15px;
  }

  th,
  td {
    font-size: 14px;
    padding: 9px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- หัวระบบ -->
  <div class="card">
    <h1>📦 ระบบสแกน Barcode / SKU</h1>
    <div class="subtitle">
      ระบบบันทึก Barcode และ SKU ลง Google Sheets
    </div>
  </div>


  <!-- พนักงาน -->
  <div class="card">

    <h2>👤 ข้อมูลผู้สแกน</h2>

    <label>ชื่อคนสแกน</label>

    <select id="employee">
      <option value="">-- เลือกชื่อพนักงาน --</option>
      <option value="SAN LIN">SAN LIN</option>
      <option value="朱美燕">朱美燕</option>
      <option value="高雲宏">高雲宏</option>
    </select>

    <div class="small" style="margin-top:8px;">
      หากต้องการเพิ่มชื่อ ให้เพิ่มบรรทัด option ในโค้ดส่วนนี้
    </div>

  </div>


  <!-- BARCODE -->
  <div class="card">

    <h2>📦 Barcode</h2>

    <div class="camera-box" id="barcodeCamera">
      <video id="barcodeVideo" playsinline></video>
      <div class="camera-message" id="barcodeMessage">
        กดเปิดกล้องเพื่อสแกน Barcode
      </div>
    </div>

    <button
      class="btn-green"
      onclick="startBarcodeScanner()">
      📷 เปิดกล้องสแกน Barcode
    </button>

    <button
      class="btn-gray"
      onclick="stopScanner()">
      ⏹ ปิดกล้อง
    </button>

    <label style="margin-top:18px;">
      Barcode ที่สแกนได้
    </label>

    <input
      id="barcode"
      type="text"
      placeholder="สแกนหรือพิมพ์ Barcode">

    <div id="barcodeAlert" class="alert"></div>

  </div>


  <!-- SKU -->
  <div class="card">

    <h2>🏷️ SKU</h2>

    <div class="camera-box" id="skuCamera">

      <video id="skuVideo" playsinline></video>

      <div class="camera-message" id="skuMessage">
        กดเปิดกล้องเพื่อสแกน SKU
      </div>

    </div>

    <button
      class="btn-green"
      onclick="startSkuScanner()">
      📷 เปิดกล้องสแกน SKU
    </button>

    <button
      class="btn-gray"
      onclick="stopScanner()">
      ⏹ ปิดกล้อง
    </button>

    <label style="margin-top:18px;">
      SKU
    </label>

    <input
      id="skuInput"
      type="text"
      placeholder="สแกนหรือพิมพ์ SKU">

    <button
      class="btn-blue"
      onclick="addSKU()">
      ➕ เพิ่ม SKU
    </button>

    <div id="skuAlert" class="alert"></div>

  </div>


  <!-- รายการ SKU -->
  <div class="card">

    <h2>📋 รายการ SKU</h2>

    <div>
      จำนวน SKU:
      <strong id="skuCount">0</strong>
    </div>

    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>SKU</th>
          <th>ลบ</th>
        </tr>
      </thead>

      <tbody id="skuTable">
        <tr>
          <td colspan="3" class="empty">
            ยังไม่มีรายการ
          </td>
        </tr>
      </tbody>

    </table>

  </div>


  <!-- บันทึก -->
  <div class="card">

    <button
      id="saveButton"
      class="btn-green"
      onclick="saveData()">
      💾 บันทึกข้อมูลลง Google Sheets
    </button>

    <button
      class="btn-gray"
      onclick="clearAll()">
      🗑️ ล้างข้อมูล
    </button>

    <div id="saveAlert" class="alert"></div>

  </div>


  <!-- สถานะ -->
  <div class="card">

    <h2>🕘 สถานะระบบ</h2>

    <div id="status" class="status">
      พร้อมใช้งาน
    </div>

  </div>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT
   ========================================================= */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzAItW_zCe786FtP5-bjUrQXU4Fv_pgr5TK8IDRDYnMBjYIRxJl6tOedfsbYjCSH2aUGQ/exec";


/* =========================================================
   ตัวแปรระบบ
   ========================================================= */

let skuList = [];

let codeReader = null;

let currentScanner = null;


/* =========================================================
   ELEMENT
   ========================================================= */

const employeeInput =
  document.getElementById("employee");

const barcodeInput =
  document.getElementById("barcode");

const skuInput =
  document.getElementById("skuInput");

const skuTable =
  document.getElementById("skuTable");

const skuCount =
  document.getElementById("skuCount");

const statusBox =
  document.getElementById("status");


/* =========================================================
   แสดงข้อความ
   ========================================================= */

function showAlert(id, message, type) {

  const box = document.getElementById(id);

  box.className = "alert " + type;

  box.textContent = message;

}


/* =========================================================
   ซ่อนข้อความ
   ========================================================= */

function hideAlert(id) {

  const box = document.getElementById(id);

  box.className = "alert";

  box.textContent = "";

}


/* =========================================================
   START BARCODE
   ========================================================= */

async function startBarcodeScanner() {

  stopScanner();

  try {

    codeReader = new ZXing.BrowserMultiFormatReader();

    currentScanner = "barcode";

    const video =
      document.getElementById("barcodeVideo");

    document.getElementById("barcodeMessage")
      .textContent = "กำลังสแกน Barcode...";

    statusBox.textContent =
      "กำลังเปิดกล้อง Barcode";

    await codeReader.decodeFromVideoDevice(
      undefined,
      video,
      (result, error) => {

        if (result) {

          const value =
            result.getText().trim();

          if (value) {

            handleBarcode(value);

            stopScanner();

          }

        }

      }
    );

  } catch (error) {

    showAlert(
      "barcodeAlert",
      "ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้อง",
      "error"
    );

  }

}


/* =========================================================
   START SKU
   ========================================================= */

async function startSkuScanner() {

  stopScanner();

  try {

    codeReader = new ZXing.BrowserMultiFormatReader();

    currentScanner = "sku";

    const video =
      document.getElementById("skuVideo");

    document.getElementById("skuMessage")
      .textContent = "กำลังสแกน SKU...";

    statusBox.textContent =
      "กำลังเปิดกล้อง SKU";

    await codeReader.decodeFromVideoDevice(
      undefined,
      video,
      (result, error) => {

        if (result) {

          const value =
            result.getText().trim();

          if (value) {

            skuInput.value = value;

            addSKU();

            stopScanner();

          }

        }

      }
    );

  } catch (error) {

    showAlert(
      "skuAlert",
      "ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้อง",
      "error"
    );

  }

}


/* =========================================================
   HANDLE BARCODE
   ========================================================= */

function handleBarcode(value) {

  barcodeInput.value = value;

  /*
   ตรวจ Barcode ซ้ำจากประวัติในเครื่อง
  */

  let history = [];

  try {

    history =
      JSON.parse(
        localStorage.getItem("barcodeHistory") || "[]"
      );

  } catch (e) {

    history = [];

  }


  if (history.includes(value)) {

    showAlert(
      "barcodeAlert",
      "⚠️ Barcode นี้เคยสแกนแล้ว: " + value,
      "warning"
    );

    statusBox.textContent =
      "พบ Barcode ซ้ำ";

    return;

  }


  /*
   เพิ่ม Barcode ลงประวัติ
  */

  history.push(value);

  /*
   เก็บไว้สูงสุด 500 รายการ
  */

  if (history.length > 500) {

    history =
      history.slice(history.length - 500);

  }

  localStorage.setItem(
    "barcodeHistory",
    JSON.stringify(history)
  );


  showAlert(
    "barcodeAlert",
    "✓ สแกน Barcode สำเร็จ: " + value,
    "success"
  );

  statusBox.textContent =
    "สแกน Barcode สำเร็จ";

}


/* =========================================================
   ADD SKU
   ========================================================= */

function addSKU() {

  const value =
    skuInput.value.trim();

  if (!value) {

    showAlert(
      "skuAlert",
      "กรุณาสแกนหรือกรอก SKU ก่อน",
      "error"
    );

    return;

  }


  /*
   SKU ซ้ำได้
   ไม่ตรวจซ้ำ
  */

  skuList.push(value);

  skuInput.value = "";

  renderSKU();


  showAlert(
    "skuAlert",
    "✓ เพิ่ม SKU สำเร็จ: " + value,
    "success"
  );

}


/* =========================================================
   RENDER SKU
   ========================================================= */

function renderSKU() {

  skuCount.textContent =
    skuList.length;


  if (skuList.length === 0) {

    skuTable.innerHTML = `
      <tr>
        <td colspan="3" class="empty">
          ยังไม่มีรายการ
        </td>
      </tr>
    `;

    return;

  }


  skuTable.innerHTML =
    skuList.map((sku, index) => {

      return `
        <tr>

          <td>
            ${index + 1}
          </td>

          <td>
            ${escapeHTML(sku)}
          </td>

          <td>

            <button
              class="btn-red"
              style="margin:0;padding:8px 12px;"
              onclick="removeSKU(${index})">
              ลบ
            </button>

          </td>

        </tr>
      `;

    }).join("");

}


/* =========================================================
   REMOVE SKU
   ========================================================= */

function removeSKU(index) {

  skuList.splice(index, 1);

  renderSKU();

}


/* =========================================================
   SAVE DATA
   ========================================================= */

async function saveData() {

  hideAlert("saveAlert");


  const employee =
    employeeInput.value.trim();

  const barcode =
    barcodeInput.value.trim();


  /* ตรวจชื่อ */

  if (!employee) {

    showAlert(
      "saveAlert",
      "⚠️ กรุณาเลือกชื่อพนักงาน",
      "error"
    );

    employeeInput.focus();

    return;

  }


  /* ตรวจ Barcode */

  if (!barcode) {

    showAlert(
      "saveAlert",
      "⚠️ กรุณาสแกน Barcode ก่อน",
      "error"
    );

    barcodeInput.focus();

    return;

  }


  /* ตรวจ SKU */

  if (skuList.length === 0) {

    showAlert(
      "saveAlert",
      "⚠️ กรุณาเพิ่ม SKU อย่างน้อย 1 รายการ",
      "error"
    );

    return;

  }


  const saveButton =
    document.getElementById("saveButton");


  saveButton.disabled = true;

  saveButton.textContent =
    "⏳ กำลังบันทึก...";


  statusBox.textContent =
    "กำลังส่งข้อมูลไป Google Sheets";


  /*
   ข้อมูลที่จะส่ง
  */

  const data = {

    employee: employee,

    barcode: barcode,

    skus: skuList,

    barcodeTime:
      new Date().toISOString()

  };


  try {

    /*
     ส่งข้อมูลไป Apps Script

     ใช้ no-cors เพราะ Google Apps Script
     อาจมี CORS redirect
    */

    await fetch(
      GOOGLE_SCRIPT_URL,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify(data)
      }
    );


    /*
     เนื่องจาก no-cors อ่าน response ไม่ได้
     แต่คำขอถูกส่งไป Apps Script แล้ว
    */

    showAlert(
      "saveAlert",
      "✅ บันทึกข้อมูลเรียบร้อยแล้ว",
      "success"
    );

    statusBox.textContent =
      "บันทึกข้อมูลเรียบร้อยแล้ว";


    /*
     ล้างข้อมูลสำหรับรายการถัดไป
    */

    skuList = [];

    barcodeInput.value = "";

    renderSKU();


  } catch (error) {

    console.error(error);

    showAlert(
      "saveAlert",
      "❌ บันทึกไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่อ",
      "error"
    );

    statusBox.textContent =
      "เกิดข้อผิดพลาด";


  } finally {

    saveButton.disabled = false;

    saveButton.textContent =
      "💾 บันทึกข้อมูลลง Google Sheets";

  }

}


/* =========================================================
   STOP SCANNER
   ========================================================= */

function stopScanner() {

  try {

    if (codeReader) {

      codeReader.reset();

      codeReader = null;

    }

  } catch (e) {

    console.log(e);

  }

  currentScanner = null;

  document.getElementById("barcodeMessage")
    .textContent =
    "กดเปิดกล้องเพื่อสแกน Barcode";

  document.getElementById("skuMessage")
    .textContent =
    "กดเปิดกล้องเพื่อสแกน SKU";

}


/* =========================================================
   CLEAR ALL
   ========================================================= */

function clearAll() {

  if (
    !confirm(
      "ต้องการล้าง Barcode และรายการ SKU ทั้งหมดหรือไม่?"
    )
  ) {

    return;

  }


  skuList = [];

  barcodeInput.value = "";

  skuInput.value = "";

  hideAlert("barcodeAlert");

  hideAlert("skuAlert");

  hideAlert("saveAlert");

  renderSKU();

  statusBox.textContent =
    "ล้างข้อมูลเรียบร้อยแล้ว";

}


/* =========================================================
   ENTER = เพิ่ม SKU
   ========================================================= */

skuInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      addSKU();

    }

  }
);


/* =========================================================
   HTML SECURITY
   ========================================================= */

function escapeHTML(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =========================================================
   INITIAL
   ========================================================= */

renderSKU();

statusBox.textContent =
  "พร้อมใช้งาน";

</script>

</body>
</html>
