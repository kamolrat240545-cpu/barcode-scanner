<html lang="th">

<head>

    .error {

      color: #991b1b;
    }

    .warning {
      background: #fef3c7;
      color: #92400e;
    }

    .info {
      background: #dbeafe;
      color: #1e40af;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: white;

    th,
    td {
      border: 1px solid #ddd;

      background: #eef2ff;
    }

    .delete-btn {

        padding: 7px 4px;

  <!-- ================================================= -->

  <!-- ================================================= -->

  <!-- ================================================= -->

  <!-- ================================================= -->

    </h2>


    <button

      🔄 โหลดประวัติ

    <table>

      <thead>

        <tr>

          <th>
            เวลา

          <th>

            Barcode

<script>


// =====================================================

// =====================================================
// รายชื่อพนักงาน 41 คน
// =====================================================

const employees = [

  ["นาย สหภาพ ทรัพย์บำเรอ", "เจ๋ง"],

  ["นาย รวีวัฒธ์ สีเสน", "โฟกัส"],

  ["นาย บัญชา ศุภศร", "ออย"],

  ["น.ส.ประกายดาว ประทังเจริญ", "เนส"],

  ["น.ส.กัลยา มูลพุ่มสาย", "พี่พลอย"],

  ["ZinMin htet", "ซินนิแถะ"],

  ["WIN THU RAIN", "พี่วิน"],

  ["WAI PHYO", "แวะพิว"],

  ["THIHA MIN WAI", "ตีห้า"],

  ["THANT ZIN OO", "ต้าซินอู้"],

  ["THANT ZIN AUNG", "ต้าซิงออง"],

  ["SI POE", "เซโป"],

  ["SAW WAH DO MOO", "ซอวัดตูมโม"],

  ["SAW SI BLU HSEL", "ซอ"],

  ["SAW SAY", "ซอเซ"],

  ["Saw Poe Chit", "ชิ"],

  ["SAW PATHI HTOO", "โพดา"],

  ["SAW JOE", "ซูจู"],

  ["SAW GAY DO HTOO", "ซอเค"],

  ["SAW ER KEN LAH", "ซอเอ"],

  ["SAN LIN", "ซาเลน"],

  ["PYAE PHYO HAN", "บี้พิวหา"],

  ["Pyae Phyo", "ปิพิว"],

  ["PAING PAING SOE", "ไปไปซู"],

  ["NJAING MTO KO", "ใน"],

  ["Myint Myat oo", "เมี๊ยะ"],

  ["MYAT MIN KO", "เมี๊ยะเมียกุ"],

  ["MOE KYAW KYAW", "โกโม"],

  ["MOE HTET KYAW", "โมทาจอง"],

  ["MG AYE LIN", "เอเลน"],

  ["KYAW TUN LIN", "จอ"],

  ["KYAW NAING TUN", "จอไนทู"],

  ["HTOO HTOO", "ทูทู"],

  ["EH SOE", "เอปโซ่"],

  ["EH POE", "เอปโพ่"],

  ["CHO CHO LWIN", "พี่เอ"],

  ["AUNG PAING SOE", "อองปัยซุ่"],

  ["หม่อโอมิ", "หม่อ"]

];



// =====================================================
// ตัวแปรระบบ
// =====================================================

let skuList = [];

let barcodeReader = null;

let barcodeScanning = false;

let checkingBarcode = false;



// =====================================================
// โหลดพนักงาน
// =====================================================

function loadEmployees() {

  const select =
    document.getElementById("employee");


  employees.forEach(function(item) {

    const option =
      document.createElement("option");


    option.value =
      item[0];


    option.textContent =
      item[0] + " | " + item[1];


    select.appendChild(option);

  });

}



// =====================================================
// JSONP ตรวจ Barcode
// =====================================================

function checkBarcode(barcode) {

  return new Promise(function(resolve) {

    const callbackName =
      "barcodeCallback_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 100000
      );


    let script = null;


    const timeout =
      setTimeout(function() {

        delete window[callbackName];

        if (
          script &&
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        resolve({

          success: false,

          duplicate: false,

          message:
            "หมดเวลาการตรวจสอบ Barcode"

        });

      }, 10000);


    window[callbackName] =
      function(data) {

        clearTimeout(timeout);


        try {

          resolve(data);

        } finally {

          delete window[callbackName];


          if (
            script &&
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );

          }

        }

      };


    script =
      document.createElement("script");


    script.src =
      API_URL +
      "?action=checkBarcode" +
      "&barcode=" +
      encodeURIComponent(barcode) +
      "&callback=" +
      callbackName;


    script.onerror =
      function() {

        clearTimeout(timeout);


        delete window[callbackName];


        if (
          script &&
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        resolve({

          success: false,

          duplicate: false,

          message:
            "ไม่สามารถเชื่อมต่อ Google Sheets ได้"

        });

      };


    document.body.appendChild(
      script
    );

  });

}



// =====================================================
// ตรวจ Barcode
// =====================================================

async function handleBarcode(barcode) {

  barcode =
    String(barcode || "")
      .trim();


  if (!barcode) {

    return false;

  }


  if (checkingBarcode) {

    return false;

  }


  checkingBarcode = true;


  document.getElementById(
    "barcode"
  ).value = barcode;


  showMessage(
    "barcodeMessage",
    "⏳ กำลังตรวจสอบ Barcode...",
    "info"
  );


  try {

    const result =
      await checkBarcode(
        barcode
      );


    // ========================================
    // Barcode ซ้ำ
    // ========================================

    if (
      result &&
      result.success &&
      result.duplicate === true
    ) {

      showMessage(
        "barcodeMessage",
        "⚠️ Barcode ซ้ำ! " + barcode,
        "warning"
      );


      // เสียงเตือน
      playBeep(false);


      // แจ้งเตือนทันที
      alert(
        "⚠️ BARCODE ซ้ำ!\n\n" +
        barcode +
        "\n\nไม่สามารถใช้ Barcode นี้ซ้ำได้"
      );


      document.getElementById(
        "barcode"
      ).select();


      return false;

    }


    // ========================================
    // Barcode ใช้ได้
    // ========================================

    if (
      result &&
      result.success &&
      result.duplicate === false
    ) {

      showMessage(
        "barcodeMessage",
        "✅ Barcode สามารถใช้ได้",
        "success"
      );


      playBeep(true);


      return true;

    }


    showMessage(
      "barcodeMessage",
      "❌ " +
      (
        result &&
        result.message
          ? result.message
          : "ตรวจสอบ Barcode ไม่สำเร็จ"
      ),
      "error"
    );


    return false;


  } catch (error) {

    showMessage(
      "barcodeMessage",
      "❌ " + error.message,
      "error"
    );


    return false;


  } finally {

    checkingBarcode = false;

  }

}



// =====================================================
// เพิ่ม Barcode
// =====================================================

async function addBarcode() {

  const input =
    document.getElementById(
      "barcode"
    );


  const barcode =
    input.value.trim();


  if (!barcode) {

    showMessage(
      "barcodeMessage",
      "กรุณาสแกน Barcode",
      "error"
    );


    input.focus();


    return;

  }


  await handleBarcode(
    barcode
  );

}



// =====================================================
// เพิ่ม SKU
// SKU ซ้ำได้
// =====================================================

function addSKU() {

  const input =
    document.getElementById(
      "skuInput"
    );


  const sku =
    input.value.trim();


  if (!sku) {

    showMessage(
      "skuMessage",
      "กรุณากรอกหรือสแกน SKU",
      "error"
    );


    input.focus();


    return;

  }


  // ตั้งใจให้ SKU ซ้ำได้
  skuList.push(sku);


  input.value = "";


  renderSKU();


  showMessage(
    "skuMessage",
    "✅ เพิ่ม SKU สำเร็จ",
    "success"
  );


  input.focus();

}



// =====================================================
// แสดง SKU
// =====================================================

function renderSKU() {

  const tbody =
    document.getElementById(
      "skuTable"
    );


  tbody.innerHTML = "";


  if (
    skuList.length === 0
  ) {

    tbody.innerHTML = `

      <tr>

        <td colspan="3">
          ยังไม่มีรายการ SKU
        </td>

      </tr>

    `;


    return;

  }


  skuList.forEach(
    function(sku, index) {

      const tr =
        document.createElement(
          "tr"
        );


      tr.innerHTML = `

        <td>
          ${index + 1}
        </td>

        <td>
          ${escapeHTML(sku)}
        </td>

        <td>

          <button
            class="btn-red delete-btn"
            onclick="removeSKU(${index})"
          >
            ลบ
          </button>

        </td>

      `;


      tbody.appendChild(tr);

    }
  );

}



// =====================================================
// ลบ SKU
// =====================================================

function removeSKU(index) {

  skuList.splice(
    index,
    1
  );


  renderSKU();

}



// =====================================================
// บันทึกข้อมูล
// =====================================================

async function saveData() {

  const employee =
    document.getElementById(
      "employee"
    ).value.trim();


  const barcode =
    document.getElementById(
      "barcode"
    ).value.trim();


  // ========================================
  // ตรวจพนักงาน
  // ========================================

  if (!employee) {

    showMessage(
      "saveMessage",
      "❌ กรุณาเลือกชื่อพนักงาน",
      "error"
    );


    return;

  }


  // ========================================
  // ตรวจ Barcode
  // ========================================

  if (!barcode) {

    showMessage(
      "saveMessage",
      "❌ กรุณาสแกน Barcode",
      "error"
    );


    return;

  }


  // ========================================
  // ตรวจ SKU
  // ========================================

  if (
    skuList.length === 0
  ) {

    showMessage(
      "saveMessage",
      "❌ กรุณาเพิ่ม SKU อย่างน้อย 1 รายการ",
      "error"
    );


    return;

  }


  // ========================================
  // ตรวจ Barcode ซ้ำก่อนบันทึก
  // ========================================

  const check =
    await handleBarcode(
      barcode
    );


  if (!check) {

    return;

  }


  const button =
    document.getElementById(
      "saveButton"
    );


  button.disabled = true;


  button.textContent =
    "⏳ กำลังบันทึก...";


  showMessage(
    "saveMessage",
    "⏳ กำลังบันทึกข้อมูล...",
    "info"
  );


  const data = {

    employee:
      employee,

    barcode:
      barcode,

    skus:
      skuList

  };


  try {

    /*
      ใช้ fetch POST
      Google Apps Script จะบันทึกข้อมูล
    */

    await fetch(

      API_URL,

      {

        method: "POST",

        mode: "no-cors",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(data)

      }

    );


    // ======================================
    // สำเร็จ
    // ======================================

    showMessage(
      "saveMessage",
      "✅ บันทึกข้อมูลเรียบร้อยแล้ว",
      "success"
    );


    playBeep(true);


    // ล้าง SKU
    skuList = [];


    renderSKU();


    // โหลดประวัติใหม่
    setTimeout(
      function() {

        loadHistory();

      },
      1000
    );


  } catch (error) {

    showMessage(
      "saveMessage",
      "❌ บันทึกไม่สำเร็จ: " +
      error.message,
      "error"
    );

  } finally {

    button.disabled = false;


    button.textContent =
      "💾 บันทึกข้อมูลลง Google Sheets";

  }

}



// =====================================================
// โหลดประวัติ
// =====================================================

function loadHistory() {

  const callbackName =
    "historyCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  let script = null;


  const timeout =
    setTimeout(
      function() {

        delete window[callbackName];


        if (
          script &&
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        document.getElementById(
          "historyTable"
        ).innerHTML = `

          <tr>

            <td colspan="4">
              ❌ โหลดประวัติไม่สำเร็จ
            </td>

          </tr>

        `;

      },
      10000
    );


  window[callbackName] =
    function(data) {

      clearTimeout(timeout);


      try {

        if (
          !data ||
          !data.success
        ) {

          throw new Error(
            "โหลดประวัติไม่สำเร็จ"
          );

        }


        renderHistory(
          data.history || []
        );


      } catch (error) {

        document.getElementById(
          "historyTable"
        ).innerHTML = `

          <tr>

            <td colspan="4">

              ❌
              ${escapeHTML(
                error.message
              )}

            </td>

          </tr>

        `;

      } finally {

        delete window[callbackName];


        if (
          script &&
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

      }

    };


  script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?action=history" +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      clearTimeout(timeout);


      delete window[callbackName];


      if (
        script &&
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }


      document.getElementById(
        "historyTable"
      ).innerHTML = `

        <tr>

          <td colspan="4">
            ❌ ไม่สามารถโหลดประวัติได้
          </td>

        </tr>

      `;

    };


  document.body.appendChild(
    script
  );

}



// =====================================================
// แสดงประวัติ
// =====================================================

function renderHistory(history) {

  const tbody =
    document.getElementById(
      "historyTable"
    );


  tbody.innerHTML = "";


  if (
    !history ||
    history.length === 0
  ) {

    tbody.innerHTML = `

      <tr>

        <td colspan="4">
          ยังไม่มีประวัติ
        </td>

      </tr>

    `;


    return;

  }


  history.forEach(
    function(item) {

      const tr =
        document.createElement(
          "tr"
        );


      /*
        สำคัญ:
        ไม่ใช้ new Date()
        เพราะอาจทำให้เวลาเปลี่ยน
        ตาม Timezone ของเครื่อง

        ใช้เวลาที่ Code.gs ส่งมาโดยตรง
      */


      tr.innerHTML = `

        <td class="time-cell">
          ${escapeHTML(
            item.time || "-"
          )}
        </td>

        <td>
          ${escapeHTML(
            item.employee || "-"
          )}
        </td>

        <td>
          ${escapeHTML(
            item.barcode || "-"
          )}
        </td>

        <td>
          ${escapeHTML(
            item.sku || "-"
          )}
        </td>

      `;


      tbody.appendChild(tr);

    }
  );

}



// =====================================================
// เปิดกล้อง
// =====================================================

async function startBarcodeScanner() {

  try {

    stopBarcodeScanner();


    if (!barcodeReader) {

      barcodeReader =
        new ZXing.BrowserMultiFormatReader();

    }


    barcodeScanning = true;


    const video =
      document.getElementById(
        "barcodeVideo"
      );


    const devices =
      await navigator
        .mediaDevices
        .enumerateDevices();


    const cameras =
      devices.filter(
        function(device) {

          return device.kind ===
            "videoinput";

        }
      );


    if (
      cameras.length === 0
    ) {

      throw new Error(
        "ไม่พบกล้อง"
      );

    }


    let cameraId =
      cameras[0].deviceId;


    // พยายามเลือกกล้องหลัง

    const backCamera =
      cameras.find(
        function(device) {

          return /back|rear|environment/i
            .test(
              device.label
            );

        }
      );


    if (backCamera) {

      cameraId =
        backCamera.deviceId;

    }


    barcodeReader.decodeFromVideoDevice(

      cameraId,

      video,

      async function(result, error) {

        if (
          !barcodeScanning
        ) {

          return;

        }


        if (result) {

          const code =
            result.getText();


          barcodeScanning = false;


          try {

            barcodeReader.reset();

          } catch (e) {}


          await handleBarcode(
            code
          );

        }

      }

    );


    showMessage(
      "barcodeMessage",
      "📷 กำลังสแกน Barcode...",
      "info"
    );


  } catch (error) {

    showMessage(
      "barcodeMessage",
      "❌ เปิดกล้องไม่ได้: " +
      error.message,
      "error"
    );

  }

}



// =====================================================
// ปิดกล้อง
// =====================================================

function stopBarcodeScanner() {

  barcodeScanning = false;


  if (barcodeReader) {

    try {

      barcodeReader.reset();

    } catch (e) {}

  }

}



// =====================================================
// เสียงเตือน
// =====================================================

function playBeep(success) {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {
      return;
    }


    const audioContext =
      new AudioContext();


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    if (success) {

      oscillator.frequency.value =
        1000;

    } else {

      oscillator.frequency.value =
        300;

    }


    gain.gain.value =
      0.2;


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      0.15
    );

  } catch (e) {}

}

function showMessage(
  id,
  text,
  type
) {

  const el =
    document.getElementById(
      id

  el.innerHTML = `

    <div class="message ${type}">

      ${escapeHTML(text)}

    </div>

  `;

}



// =====================================================
// ป้องกัน HTML
// =====================================================

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
