<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwsEZhW08-KxnGDLkl0EzpaIuYXCrqhzWXgYXVNYOEW6XRmOrNSqVhjPXCm5laSKjXy/exec";


/* =====================================================
   DATA
===================================================== */

let barcodeValue = "";
let skuList = [];

let cameraStream = null;
let scanning = false;
let barcodeDetector = null;


/* =====================================================
   ELEMENTS
===================================================== */

const employeeEl =
document.getElementById("employee");

const barcodeEl =
document.getElementById("barcode");

const skuEl =
document.getElementById("sku");

const barcodeStatus =
document.getElementById("barcodeStatus");

const skuStatus =
document.getElementById("skuStatus");

const saveStatus =
document.getElementById("saveStatus");

const video =
document.getElementById("video");

const cameraText =
document.getElementById("cameraText");

const scanFrame =
document.getElementById("scanFrame");


/* =====================================================
   MESSAGE
===================================================== */

function showStatus(element, message, type) {

  element.className =
    "status " + type;

  element.textContent =
    message;

  element.classList.remove("hidden");
}


function hideStatus(element) {

  element.classList.add("hidden");

}


/* =====================================================
   BARCODE INPUT
===================================================== */

function barcodeKeyDown(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    addBarcode();

  }

}


/* =====================================================
   SKU INPUT
===================================================== */

function skuKeyDown(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    addSKU();

  }

}


/* =====================================================
   ADD BARCODE
===================================================== */

function addBarcode() {

  const barcode =
    barcodeEl.value.trim();

  if (!barcode) {

    showStatus(
      barcodeStatus,
      "❌ กรุณาสแกนหรือกรอก Barcode",
      "error"
    );

    return;

  }

  checkBarcode(barcode);

}


/* =====================================================
   CHECK BARCODE
   ใช้ JSONP เพื่อให้ GitHub Pages
   เรียก Google Apps Script ได้
===================================================== */

function checkBarcode(barcode) {

  showStatus(
    barcodeStatus,
    "⏳ กำลังตรวจสอบ Barcode...",
    "info"
  );

  const callbackName =
    "barcodeCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);

  const script =
    document.createElement("script");

  let finished = false;

  window[callbackName] =
    function(data) {

      finished = true;

      try {

        if (
          data &&
          data.success === true &&
          data.duplicate === true
        ) {

          barcodeValue = "";

          document.getElementById(
            "currentBarcode"
          ).classList.add("hidden");

          document.getElementById(
            "skuBarcode"
          ).textContent = "-";

          showStatus(
            barcodeStatus,
            "⚠️ Barcode ซ้ำ!\n" +
            barcode +
            "\n\nBarcode นี้มีอยู่ในระบบแล้ว ไม่สามารถใช้ซ้ำได้",
            "warning"
          );

          barcodeEl.value = "";

          barcodeEl.focus();

          return;

        }


        if (
          data &&
          data.success === true &&
          data.duplicate === false
        ) {

          barcodeValue =
            barcode;

          document.getElementById(
            "currentBarcode"
          ).classList.remove("hidden");

          document.getElementById(
            "currentBarcodeText"
          ).textContent =
            barcode;

          document.getElementById(
            "skuBarcode"
          ).textContent =
            barcode;

          showStatus(
            barcodeStatus,
            "✅ Barcode นี้ยังไม่ถูกสแกน สามารถใช้งานได้",
            "success"
          );

          barcodeEl.value = "";

          skuEl.focus();

          return;

        }


        showStatus(
          barcodeStatus,
          "❌ ไม่สามารถตรวจสอบ Barcode ได้",
          "error"
        );

      }
      finally {

        cleanup();

      }

    };


  function cleanup() {

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackName];
    } catch(e) {}

  }


  script.onerror =
    function() {

      if (finished) return;

      cleanup();

      showStatus(
        barcodeStatus,
        "❌ ตรวจสอบ Barcode ไม่สำเร็จ กรุณาลองใหม่",
        "error"
      );

    };


  script.src =
    API_URL +
    "?action=checkBarcode" +
    "&barcode=" +
    encodeURIComponent(barcode) +
    "&callback=" +
    callbackName +
    "&_=" +
    Date.now();

  document.body.appendChild(script);

}


/* =====================================================
   ADD SKU
===================================================== */

function addSKU() {

  if (!barcodeValue) {

    showStatus(
      skuStatus,
      "❌ กรุณาสแกน Barcode ก่อน",
      "error"
    );

    return;

  }

  const sku =
    skuEl.value.trim();

  if (!sku) {

    showStatus(
      skuStatus,
      "❌ กรุณาสแกนหรือกรอก SKU",
      "error"
    );

    return;

  }


  if (skuList.includes(sku)) {

    showStatus(
      skuStatus,
      "⚠️ SKU นี้ถูกเพิ่มไปแล้ว",
      "warning"
    );

    skuEl.value = "";

    return;

  }


  skuList.push(sku);

  renderSKU();

  skuEl.value = "";

  showStatus(
    skuStatus,
    "✅ เพิ่ม SKU สำเร็จ",
    "success"
  );

  skuEl.focus();

}


/* =====================================================
   RENDER SKU
===================================================== */

function renderSKU() {

  const list =
    document.getElementById("skuList");

  const count =
    document.getElementById("skuCount");


  count.textContent =
    "จำนวน SKU : " +
    skuList.length;


  if (skuList.length === 0) {

    list.innerHTML =
      '<div style="text-align:center;color:#777;padding:15px;">' +
      'ยังไม่มีรายการ SKU' +
      '</div>';

    return;

  }


  list.innerHTML = "";

  skuList.forEach(
    function(sku, index) {

      const row =
        document.createElement("div");

      row.className =
        "sku-item";

      const text =
        document.createElement("span");

      text.textContent =
        (index + 1) +
        ". " +
        sku;


      const btn =
        document.createElement("button");

      btn.textContent =
        "ลบ";

      btn.onclick =
        function() {

          skuList.splice(index, 1);

          renderSKU();

        };


      row.appendChild(text);

      row.appendChild(btn);

      list.appendChild(row);

    }
  );

}


/* =====================================================
   SAVE
===================================================== */

async function saveData() {

  const employee =
    employeeEl.value.trim();


  if (!employee) {

    showStatus(
      saveStatus,
      "❌ กรุณาเลือกชื่อพนักงาน",
      "error"
    );

    return;

  }


  if (!barcodeValue) {

    showStatus(
      saveStatus,
      "❌ กรุณาสแกน Barcode ก่อน",
      "error"
    );

    return;

  }


  if (skuList.length === 0) {

    showStatus(
      saveStatus,
      "❌ กรุณาเพิ่ม SKU อย่างน้อย 1 รายการ",
      "error"
    );

    return;

  }


  const saveBtn =
    document.getElementById("saveBtn");

  saveBtn.disabled = true;

  saveBtn.textContent =
    "⏳ กำลังบันทึก...";


  const data = {

    employee:
      employee,

    barcode:
      barcodeValue,

    skus:
      skuList

  };


  try {

    /*
      ใช้ no-cors เพราะ Google Apps Script
      อาจไม่ส่ง CORS header ให้ GitHub Pages

      ฝั่ง Server จะเป็นคนตรวจ Barcode ซ้ำ
      อีกครั้งก่อนบันทึก
    */

    await fetch(
      API_URL,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(data)
      }
    );


    /*
      เนื่องจาก no-cors อ่าน response ไม่ได้
      เราจึงถือว่าการส่งสำเร็จหลังจาก request จบ
    */

    showStatus(
      saveStatus,
      "✅ บันทึกข้อมูลเรียบร้อยแล้ว",
      "success"
    );


    /*
      โหลดประวัติใหม่
    */

    setTimeout(
      function() {
        loadHistory();
      },
      800
    );


    /*
      เตรียมรับ Barcode ใหม่
    */

    barcodeValue = "";

    skuList = [];

    document.getElementById(
      "currentBarcode"
    ).classList.add("hidden");

    document.getElementById(
      "currentBarcodeText"
    ).textContent = "";

    document.getElementById(
      "skuBarcode"
    ).textContent = "-";

    renderSKU();

    barcodeEl.value = "";

    skuEl.value = "";

    barcodeEl.focus();


  } catch (error) {

    showStatus(
      saveStatus,
      "❌ บันทึกไม่สำเร็จ: " +
      error.message,
      "error"
    );

  }
  finally {

    saveBtn.disabled = false;

    saveBtn.textContent =
      "💾 บันทึกข้อมูลลง Google Sheets";

  }

}


/* =====================================================
   CLEAR
===================================================== */

function clearAll() {

  barcodeValue = "";

  skuList = [];

  barcodeEl.value = "";

  skuEl.value = "";

  document.getElementById(
    "currentBarcode"
  ).classList.add("hidden");

  document.getElementById(
    "currentBarcodeText"
  ).textContent = "";

  document.getElementById(
    "skuBarcode"
  ).textContent = "-";

  hideStatus(barcodeStatus);

  hideStatus(skuStatus);

  hideStatus(saveStatus);

  renderSKU();

  barcodeEl.focus();

}


/* =====================================================
   CAMERA
===================================================== */

async function openCamera() {

  try {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      alert(
        "อุปกรณ์นี้ไม่รองรับการเปิดกล้องจากเว็บไซต์"
      );

      return;

    }


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    video.srcObject =
      cameraStream;

    video.style.display =
      "block";

    cameraText.style.display =
      "none";

    scanFrame.style.display =
      "block";


    document.getElementById(
      "openCameraBtn"
    ).classList.add("hidden");


    document.getElementById(
      "closeCameraBtn"
    ).classList.remove("hidden");


    scanning = true;


    /*
      BarcodeDetector รองรับใน Browser
      บางรุ่นเท่านั้น
    */

    if ("BarcodeDetector" in window) {

      try {

        barcodeDetector =
          new BarcodeDetector();

      } catch(e) {

        barcodeDetector = null;

      }

    }


    if (barcodeDetector) {

      scanBarcodeLoop();

    }
    else {

      showStatus(
        barcodeStatus,
        "ℹ️ กล้องเปิดแล้ว แต่ Browser นี้ไม่รองรับการอ่าน Barcode อัตโนมัติ กรุณาใช้เครื่องสแกนหรือกรอก Barcode",
        "info"
      );

    }


  } catch (error) {

    alert(
      "ไม่สามารถเปิดกล้องได้\n\n" +
      error.message
    );

  }

}


/* =====================================================
   SCAN LOOP
===================================================== */

async function scanBarcodeLoop() {

  if (!scanning) return;

  if (!barcodeDetector) return;


  try {

    const codes =
      await barcodeDetector.detect(video);


    if (codes && codes.length > 0) {

      const value =
        codes[0].rawValue;


      if (value) {

        scanning = false;

        barcodeEl.value =
          value;

        /*
          ตรวจซ้ำทันที
        */

        checkBarcode(value);

        /*
          เปิดการสแกนต่อหลังจาก
          ตรวจเสร็จเล็กน้อย
        */

        setTimeout(
          function() {

            if (cameraStream) {
              scanning = true;
              scanBarcodeLoop();
            }

          },
          1500
        );

        return;

      }

    }

  } catch(error) {

    console.log(
      "Barcode detection:",
      error
    );

  }


  requestAnimationFrame(
    scanBarcodeLoop
  );

}


/* =====================================================
   CLOSE CAMERA
===================================================== */

function closeCamera() {

  scanning = false;


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );

    cameraStream = null;

  }


  video.srcObject = null;

  video.style.display =
    "none";

  cameraText.style.display =
    "block";

  scanFrame.style.display =
    "none";


  document.getElementById(
    "openCameraBtn"
  ).classList.remove("hidden");


  document.getElementById(
    "closeCameraBtn"
  ).classList.add("hidden");

}


/* =====================================================
   HISTORY
   ใช้ JSONP เช่นเดียวกับ Barcode
===================================================== */

function loadHistory() {

  const body =
    document.getElementById(
      "historyBody"
    );


  body.innerHTML =
    '<tr><td colspan="4">⏳ กำลังโหลด...</td></tr>';


  const callbackName =
    "historyCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);


  const script =
    document.createElement("script");


  window[callbackName] =
    function(data) {

      try {

        if (
          !data ||
          data.success !== true
        ) {

          throw new Error(
            "ข้อมูลประวัติไม่ถูกต้อง"
          );

        }


        const history =
          Array.isArray(data.history)
            ? data.history
            : [];


        if (history.length === 0) {

          body.innerHTML =
            '<tr><td colspan="4">' +
            'ยังไม่มีประวัติ' +
            '</td></tr>';

          return;

        }


        body.innerHTML = "";


        history.forEach(
          function(item) {

            const tr =
              document.createElement("tr");


            const time =
              document.createElement("td");

            const employee =
              document.createElement("td");

            const barcode =
              document.createElement("td");

            const sku =
              document.createElement("td");


            /*
              แสดงเวลาตามที่ Server ส่งมา
            */

            time.textContent =
              formatDateTime(item.time);


            employee.textContent =
              item.employee || "";


            barcode.textContent =
              item.barcode || "";


            sku.textContent =
              item.sku || "";


            tr.appendChild(time);

            tr.appendChild(employee);

            tr.appendChild(barcode);

            tr.appendChild(sku);


            body.appendChild(tr);

          }
        );


      } catch(error) {

        body.innerHTML =
          '<tr><td colspan="4">' +
          '❌ โหลดประวัติไม่สำเร็จ' +
          '</td></tr>';

      }
      finally {

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        try {
          delete window[callbackName];
        } catch(e) {}

      }

    };


  script.onerror =
    function() {

      body.innerHTML =
        '<tr><td colspan="4">' +
        '❌ ไม่สามารถเชื่อมต่อระบบได้' +
        '</td></tr>';

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[callbackName];
      } catch(e) {}

    };


  script.src =
    API_URL +
    "?action=history" +
    "&callback=" +
    callbackName +
    "&_=" +
    Date.now();


  document.body.appendChild(script);

}


/* =====================================================
   FORMAT DATE TIME
===================================================== */

function formatDateTime(value) {

  if (!value) {
    return "-";
  }


  const text =
    String(value).trim();


  /*
    ถ้า Apps Script ส่งวันที่มาในรูป
    28/8/2026, 10:07:10
    ให้แสดงตามนั้น
  */

  if (
    text.includes(":")
  ) {

    return text;

  }


  /*
    ถ้าเป็นวันที่อย่างเดียว
    เราไม่สามารถสร้างเวลาเดิมขึ้นมาได้
    เพราะข้อมูลเดิมไม่มีเวลา
  */

  return text;

}

   INITIAL
===================================================== */

renderSKU();

loadHistory();


/*
  ให้ช่อง Barcode พร้อมใช้งาน
*/

setTimeout(
  function() {
    barcodeEl.focus();
  },
  500
);

</script>
