<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ระบบสแกน Barcode / SKU</title>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f5f7;
  font-family:
    Arial,
    "Noto Sans Thai",
    "Noto Sans Myanmar",
    sans-serif;
  color: #222;
}

.container {
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h1 {
  margin: 0 0 10px;
  font-size: 28px;
}

h2 {
  margin-top: 0;
}

.subtitle {
  color: #666;
  font-size: 18px;
}

label {
  display: block;
  font-size: 18px;
  font-weight: bold;
  margin: 12px 0 8px;
}

input,
select {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  border: 2px solid #ddd;
  border-radius: 12px;
  outline: none;
  background: white;
}

input:focus,
select:focus {
  border-color: #2196f3;
}

button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 16px;
  margin-top: 10px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.btn-green {
  background: #16a34a;
  color: white;
}

.btn-blue {
  background: #2563eb;
  color: white;
}

.btn-gray {
  background: #6b7280;
  color: white;
}

.btn-red {
  background: #dc2626;
  color: white;
}

.btn-disabled {
  background: #aaa;
  color: white;
  pointer-events: none;
}

.camera-box {
  width: 100%;
  background: #111;
  border-radius: 15px;
  overflow: hidden;
  position: relative;
}

#video {
  width: 100%;
  display: block;
  min-height: 260px;
  object-fit: cover;
}

.camera-message {
  color: white;
  text-align: center;
  padding: 12px;
  font-size: 18px;
}

.status {
  margin-top: 12px;
  padding: 14px;
  border-radius: 12px;
  font-size: 17px;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.warning {
  background: #fef3c7;
  color: #92400e;
}

.info {
  background: #dbeafe;
  color: #1e40af;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th,
td {
  border: 1px solid #ddd;
  padding: 12px;
  text-align: center;
  font-size: 17px;
}

th {
  background: #eef2ff;
}

.small-delete {
  background: #dc2626;
  color: white;
  padding: 8px 12px;
  margin: 0;
  width: auto;
  font-size: 15px;
}

.hidden {
  display: none !important;
}

.count {
  font-size: 18px;
  margin-top: 8px;
}

.loading {
  opacity: 0.6;
  pointer-events: none;
}

</style>

</head>


<body>

<div class="container">


<!-- ================================================= -->
<!-- HEADER -->
<!-- ================================================= -->

<div class="card">

<h1>📦 ระบบสแกน Barcode / SKU</h1>

<div class="subtitle">
ระบบบันทึก Barcode และ SKU ลง Google Sheets
</div>

</div>



<!-- ================================================= -->
<!-- EMPLOYEE -->
<!-- ================================================= -->

<div class="card">

<h2>👤 ข้อมูลผู้สแกน</h2>

<label>ชื่อคนสแกน</label>

<select id="employee">

<option value="">
-- เลือกชื่อพนักงาน --
</option>

<option value="SAN LIN">
SAN LIN
</option>

<option value="朱美燕">
朱美燕
</option>

<option value="高雲宏">
高雲宏
</option>

</select>

<div
  id="employeeStatus"
  class="status hidden"
></div>

</div>



<!-- ================================================= -->
<!-- BARCODE -->
<!-- ================================================= -->

<div class="card">

<h2>📦 Barcode</h2>

<button
  id="startBarcodeBtn"
  class="btn-green"
  onclick="startBarcodeScanner()"
>
📷 เปิดกล้องสแกน Barcode
</button>

<button
  id="stopBarcodeBtn"
  class="btn-gray hidden"
  onclick="stopScanner()"
>
⏹️ ปิดกล้อง
</button>

<div
  id="barcodeCamera"
  class="camera-box hidden"
>

<video
  id="video"
  playsinline
></video>

<div
  id="cameraMessage"
  class="camera-message"
>
กำลังเตรียมกล้อง...
</div>

</div>


<label>Barcode ที่สแกนได้</label>

<input
  id="barcode"
  type="text"
  placeholder="สแกน Barcode"
  autocomplete="off"
>

<div
  id="barcodeStatus"
  class="status hidden"
></div>

</div>



<!-- ================================================= -->
<!-- SKU -->
<!-- ================================================= -->

<div class="card">

<h2>🏷️ SKU</h2>

<button
  id="startSkuBtn"
  class="btn-green"
  onclick="startSkuScanner()"
>
📷 เปิดกล้องสแกน SKU
</button>

<button
  id="stopSkuBtn"
  class="btn-gray hidden"
  onclick="stopScanner()"
>
⏹️ ปิดกล้อง
</button>

<label>SKU</label>

<input
  id="skuInput"
  type="text"
  placeholder="สแกนหรือพิมพ์ SKU"
  autocomplete="off"
>

<button
  class="btn-blue"
  onclick="addSKU()"
>
➕ เพิ่ม SKU
</button>

<div
  id="skuStatus"
  class="status hidden"
></div>

</div>



<!-- ================================================= -->
<!-- SKU LIST -->
<!-- ================================================= -->

<div class="card">

<h2>📋 รายการ SKU</h2>

<div class="count">
จำนวน SKU :
<span id="skuCount">0</span>
</div>

<table>

<thead>

<tr>

<th>
#
</th>

<th>
SKU
</th>

<th>
ลบ
</th>

</tr>

</thead>

<tbody id="skuTableBody">

<tr>

<td colspan="3">
ยังไม่มีรายการ
</td>

</tr>

</tbody>

</table>

</div>



<!-- ================================================= -->
<!-- SAVE -->
<!-- ================================================= -->

<div class="card">

<button
  id="saveBtn"
  class="btn-green"
  onclick="saveData()"
>
💾 บันทึกข้อมูลลง Google Sheets
</button>

<button
  class="btn-gray"
  onclick="clearAll()"
>
🗑️ ล้างข้อมูล
</button>

<div
  id="saveStatus"
  class="status hidden"
></div>

</div>


</div>



<script>


// =====================================================
// URL ของ Google Apps Script
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbwzQ9RN-jLu8dP8ahi_9jep98uub8WXBiBVUWM0d1f9LgGWclaLYc8nEJWqqHg0S52r/exec";


// =====================================================
// ตัวแปร
// =====================================================

let skus = [];

let codeReader = null;

let scanning = false;

let scanMode = "";

let lastScannedBarcode = "";

let lastScanTime = 0;


// =====================================================
// ELEMENT
// =====================================================

const employee =
document.getElementById("employee");

const barcodeInput =
document.getElementById("barcode");

const skuInput =
document.getElementById("skuInput");

const skuCount =
document.getElementById("skuCount");

const skuTableBody =
document.getElementById("skuTableBody");

const video =
document.getElementById("video");


// =====================================================
// เมื่อเลือกพนักงาน
// =====================================================

employee.addEventListener("change", function() {

  const box =
  document.getElementById("employeeStatus");

  if (employee.value) {

    box.className =
      "status success";

    box.textContent =
      "✅ เลือกผู้สแกน: " + employee.value;

  } else {

    box.className =
      "status hidden";

  }

});


// =====================================================
// เริ่ม Barcode Scanner
// =====================================================

async function startBarcodeScanner() {

  scanMode = "barcode";

  await startScanner();

}


// =====================================================
// เริ่ม SKU Scanner
// =====================================================

async function startSkuScanner() {

  scanMode = "sku";

  await startScanner();

}


// =====================================================
// เปิดกล้อง
// =====================================================

async function startScanner() {

  try {

    stopScanner();

    document
      .getElementById("barcodeCamera")
      .classList.remove("hidden");

    document
      .getElementById("startBarcodeBtn")
      .classList.add("hidden");

    document
      .getElementById("startSkuBtn")
      .classList.add("hidden");

    document
      .getElementById("stopBarcodeBtn")
      .classList.remove("hidden");

    document
      .getElementById("stopSkuBtn")
      .classList.remove("hidden");


    document
      .getElementById("cameraMessage")
      .textContent =
      "กำลังเปิดกล้อง...";


    codeReader =
      new ZXing.BrowserMultiFormatReader();


    scanning = true;


    await codeReader.decodeFromVideoDevice(
      null,
      video,
      async function(result, err) {

        if (!result || !scanning) {
          return;
        }

        const value =
          result.getText().trim();

        if (!value) {
          return;
        }

        // กันการยิงซ้ำจากกล้องในเสี้ยววินาที
        const now = Date.now();

        if (
          value === lastScannedBarcode &&
          now - lastScanTime < 2000
        ) {
          return;
        }

        lastScannedBarcode = value;
        lastScanTime = now;


        // ---------------------------------------------
        // Barcode
        // ---------------------------------------------

        if (scanMode === "barcode") {

          await handleBarcodeScanned(value);

        }


        // ---------------------------------------------
        // SKU
        // ---------------------------------------------

        if (scanMode === "sku") {

          skuInput.value = value;

          addSKU();

          stopScanner();

        }

      }
    );


    document
      .getElementById("cameraMessage")
      .textContent =
      "📷 กำลังสแกน " +
      (scanMode === "barcode"
        ? "Barcode"
        : "SKU") +
      "...";


  } catch (error) {

    showStatus(
      "barcodeStatus",
      "error",
      "❌ เปิดกล้องไม่ได้: " +
      error.message
    );

    stopScanner();

  }

}


// =====================================================
// หยุด Scanner
// =====================================================

function stopScanner() {

  scanning = false;

  try {

    if (codeReader) {

      codeReader.reset();

      codeReader = null;

    }

  } catch (e) {}


  if (video.srcObject) {

    video.srcObject
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

    video.srcObject = null;

  }


  document
    .getElementById("barcodeCamera")
    .classList.add("hidden");

  document
    .getElementById("stopBarcodeBtn")
    .classList.add("hidden");

  document
    .getElementById("stopSkuBtn")
    .classList.add("hidden");

  document
    .getElementById("startBarcodeBtn")
    .classList.remove("hidden");

  document
    .getElementById("startSkuBtn")
    .classList.remove("hidden");

}


// =====================================================
// Barcode ถูกสแกน
// =====================================================

async function handleBarcodeScanned(value) {

  barcodeInput.value = value;

  showStatus(
    "barcodeStatus",
    "info",
    "🔎 กำลังตรวจสอบ Barcode..."
  );


  // หยุดกล้องก่อน
  stopScanner();


  // ตรวจ Barcode ทันที
  const duplicate =
    await checkBarcodeDuplicate(value);


  if (duplicate) {

    // -----------------------------------------------
    // ซ้ำ
    // -----------------------------------------------

    barcodeInput.value = "";

    showStatus(
      "barcodeStatus",
      "error",
      "❌ Barcode นี้ซ้ำแล้ว: " + value
    );


    // แจ้งเตือนทันที
    alert(
      "⚠️ Barcode ซ้ำ!\n\n" +
      value +
      "\n\nBarcode นี้ถูกสแกนไปแล้ว"
    );


    return;

  }


  // -----------------------------------------------
  // ไม่ซ้ำ
  // -----------------------------------------------

  showStatus(
    "barcodeStatus",
    "success",
    "✅ Barcode นี้ยังไม่เคยสแกน: " + value
  );

}


// =====================================================
// ตรวจ Barcode ซ้ำกับ Google Sheets
// =====================================================

async function checkBarcodeDuplicate(barcode) {

  try {

    const url =
      API_URL +
      "?action=checkBarcode&barcode=" +
      encodeURIComponent(barcode) +
      "&t=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        "ตรวจสอบ Barcode ไม่สำเร็จ"
      );

    }


    return data.duplicate === true;


  } catch (error) {

    console.error(error);


    showStatus(
      "barcodeStatus",
      "error",
      "❌ ตรวจสอบ Barcode ไม่สำเร็จ: " +
      error.message
    );


    // ถ้าตรวจสอบไม่ได้ ให้หยุดไว้ก่อน
    // เพื่อป้องกัน Barcode ซ้ำ
    return true;

  }

}


// =====================================================
// เพิ่ม SKU
// =====================================================

function addSKU() {

  const value =
    skuInput.value.trim();


  if (!value) {

    showStatus(
      "skuStatus",
      "error",
      "❌ กรุณากรอก SKU ก่อน"
    );

    return;

  }


  // สำคัญ:
  // ไม่ตรวจ SKU ซ้ำ
  // เพราะอนุญาตให้ SKU ซ้ำได้

  skus.push(value);


  skuInput.value = "";


  renderSKU();


  showStatus(
    "skuStatus",
    "success",
    "✅ เพิ่ม SKU สำเร็จ"
  );


  skuInput.focus();

}


// =====================================================
// แสดงรายการ SKU
// =====================================================

function renderSKU() {

  skuCount.textContent =
    skus.length;


  if (skus.length === 0) {

    skuTableBody.innerHTML = `
      <tr>
        <td colspan="3">
          ยังไม่มีรายการ
        </td>
      </tr>
    `;

    return;

  }


  skuTableBody.innerHTML =
    skus.map(function(sku, index) {

      return `
        <tr>

          <td>
            ${index + 1}
          </td>

          <td>
            ${escapeHtml(sku)}
          </td>

          <td>

            <button
              class="small-delete"
              onclick="removeSKU(${index})"
            >
              ลบ
            </button>

          </td>

        </tr>
      `;

    }).join("");

}


// =====================================================
// ลบ SKU
// =====================================================

function removeSKU(index) {

  skus.splice(index, 1);

  renderSKU();

}


// =====================================================
// บันทึก
// =====================================================

async function saveData() {

  const emp =
    employee.value.trim();

  const barcode =
    barcodeInput.value.trim();


  // -----------------------------------------------
  // ตรวจข้อมูล
  // -----------------------------------------------

  if (!emp) {

    alert(
      "⚠️ กรุณาเลือกชื่อพนักงาน"
    );

    employee.focus();

    return;

  }


  if (!barcode) {

    alert(
      "⚠️ กรุณาสแกน Barcode ก่อน"
    );

    barcodeInput.focus();

    return;

  }


  if (skus.length === 0) {

    alert(
      "⚠️ กรุณาเพิ่ม SKU อย่างน้อย 1 รายการ"
    );

    skuInput.focus();

    return;

  }


  const saveBtn =
    document.getElementById("saveBtn");


  saveBtn.disabled = true;

  saveBtn.textContent =
    "⏳ กำลังบันทึก...";


  showStatus(
    "saveStatus",
    "info",
    "⏳ กำลังบันทึกข้อมูล..."
  );


  try {

    const payload = {

      employee: emp,

      barcode: barcode,

      skus: skus

    };


    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(payload)
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    // ---------------------------------------------
    // Barcode ซ้ำ
    // ---------------------------------------------

    if (data.duplicate) {

      alert(
        "⚠️ Barcode ซ้ำ!\n\n" +
        barcode
      );


      showStatus(
        "saveStatus",
        "error",
        "❌ Barcode นี้ถูกสแกนไปแล้ว"
      );


      return;

    }


    // ---------------------------------------------
    // สำเร็จ
    // ---------------------------------------------

    if (data.success) {

      showStatus(
        "saveStatus",
        "success",
        "✅ บันทึกข้อมูลสำเร็จ"
      );


      alert(
        "✅ บันทึกข้อมูลเรียบร้อยแล้ว"
      );


      // เคลียร์ข้อมูล
      barcodeInput.value = "";

      skus = [];

      renderSKU();


      document
        .getElementById("barcodeStatus")
        .className =
        "status hidden";

    } else {

      throw new Error(
        data.message ||
        "บันทึกไม่สำเร็จ"
      );

    }


  } catch (error) {

    console.error(error);


    showStatus(
      "saveStatus",
      "error",
      "❌ บันทึกไม่สำเร็จ: " +
      error.message
    );

  } finally {

    saveBtn.disabled = false;

    saveBtn.textContent =
      "💾 บันทึกข้อมูลลง Google Sheets";

  }

}


// =====================================================
// ล้างข้อมูล
// =====================================================

function clearAll() {

  if (
    !confirm(
      "ต้องการล้างข้อมูลทั้งหมดหรือไม่?"
    )
  ) {
    return;
  }


  barcodeInput.value = "";

  skuInput.value = "";

  skus = [];

  renderSKU();


  document
    .getElementById("barcodeStatus")
    .className =
    "status hidden";


  document
    .getElementById("skuStatus")
    .className =
    "status hidden";


  document
    .getElementById("saveStatus")
    .className =
    "status hidden";

}


// =====================================================
// Status
// =====================================================

function showStatus(
  id,
  type,
  message
) {

  const element =
    document.getElementById(id);


  element.className =
    "status " + type;


  element.textContent =
    message;

}


// =====================================================
// ป้องกัน HTML
// =====================================================

function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}


// =====================================================
// Enter เพิ่ม SKU
// =====================================================

skuInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      addSKU();

    }

  }
);


// =====================================================
// Enter Barcode
// =====================================================

barcodeInput.addEventListener(
  "keydown",
  async function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      const value =
        barcodeInput.value.trim();


      if (!value) {
        return;
      }


      await handleBarcodeScanned(
        value
      );

    }

  }
);


// =====================================================
// เริ่มต้น
// =====================================================

renderSKU();

</script>

</body>

</html>
