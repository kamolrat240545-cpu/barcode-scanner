<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Barcode Scanner</title>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Thai","Noto Sans Myanmar",sans-serif;
  background:#f3f5f7;
  color:#222;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:15px;
}

.header{
  background:#fff;
  border-radius:15px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.header h1{
  margin:0 0 8px;
  font-size:28px;
}

.header p{
  margin:0;
  font-size:18px;
  color:#666;
}

.section{
  background:#fff;
  border-radius:15px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.section-title{
  font-size:25px;
  font-weight:bold;
  margin-bottom:15px;
}

label{
  display:block;
  font-size:19px;
  font-weight:bold;
  margin-bottom:8px;
}

select,
input{
  width:100%;
  padding:15px;
  font-size:18px;
  border:1px solid #ccc;
  border-radius:10px;
  background:#fff;
  margin-bottom:12px;
}

button{
  width:100%;
  border:none;
  border-radius:10px;
  padding:15px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}

.btn-green{
  background:#16a34a;
  color:#fff;
}

.btn-blue{
  background:#2563eb;
  color:#fff;
}

.btn-gray{
  background:#6b7280;
  color:#fff;
}

.btn-red{
  background:#dc2626;
  color:#fff;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* CAMERA */

.camera-box{
  width:100%;
  height:300px;
  background:#111;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  margin-bottom:10px;
}

.camera-box video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.camera-message{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  color:#fff;
  font-size:18px;
  text-align:center;
  width:90%;
}

.scan-line{
  position:absolute;
  left:10%;
  right:10%;
  top:50%;
  height:2px;
  background:red;
  box-shadow:0 0 8px red;
}

/* SKU TABLE */

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,
td{
  border:1px solid #ddd;
  padding:12px;
  text-align:center;
  font-size:17px;
}

th{
  background:#eef2ff;
}

.delete-btn{
  background:#dc2626;
  color:white;
  padding:9px 14px;
  border-radius:8px;
  font-size:16px;
  width:auto;
  margin:0;
}

/* STATUS */

.status{
  padding:14px;
  border-radius:10px;
  margin-top:12px;
  font-size:18px;
  font-weight:bold;
  display:none;
}

.status.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.warning{
  display:block;
  background:#fef3c7;
  color:#92400e;
}

.status.info{
  display:block;
  background:#dbeafe;
  color:#1e40af;
}

/* HISTORY */

.history-item{
  border-bottom:1px solid #ddd;
  padding:10px 0;
}

.history-item:last-child{
  border-bottom:none;
}

.small{
  color:#666;
  font-size:14px;
}

</style>
</head>


<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <h1>📦 ระบบสแกน Barcode / SKU</h1>

    <p>
      ระบบบันทึก Barcode และ SKU ลง Google Sheets
    </p>

  </div>


  <!-- EMPLOYEE -->

  <div class="section">

    <div class="section-title">
      👤 ข้อมูลผู้สแกน
    </div>

    <label for="employee">
      ชื่อคนสแกน
    </label>

    <select id="employee">

      <option value="">
        -- เลือกชื่อพนักงาน --
      </option>

      <!-- แก้ชื่อพนักงานตรงนี้ได้ -->

      <option value="SAN LIN">
        SAN LIN
      </option>

      <option value="พนักงาน 2">
        พนักงาน 2
      </option>

      <option value="พนักงาน 3">
        พนักงาน 3
      </option>

      <option value="พนักงาน 4">
        พนักงาน 4
      </option>

    </select>

  </div>


  <!-- BARCODE -->

  <div class="section">

    <div class="section-title">
      📦 Barcode
    </div>

    <div class="camera-box" id="barcodeCamera">

      <video id="barcodeVideo" playsinline></video>

      <div class="camera-message" id="barcodeMessage">
        กดเปิดกล้องเพื่อสแกน Barcode
      </div>

      <div class="scan-line"></div>

    </div>

    <button
      class="btn-green"
      id="barcodeCameraButton"
      onclick="toggleBarcodeCamera()">

      📷 เปิดกล้องสแกน Barcode

    </button>


    <label style="margin-top:15px;">
      Barcode ที่สแกนได้
    </label>

    <input
      id="barcodeInput"
      type="text"
      placeholder="สแกนหรือพิมพ์ Barcode"
      autocomplete="off">


    <div id="barcodeStatus"
         class="status">
    </div>

  </div>


  <!-- SKU -->

  <div class="section">

    <div class="section-title">
      🏷️ SKU
    </div>


    <div class="camera-box" id="skuCamera">

      <video id="skuVideo" playsinline></video>

      <div class="camera-message" id="skuMessage">
        กดเปิดกล้องเพื่อสแกน SKU
      </div>

      <div class="scan-line"></div>

    </div>


    <button
      class="btn-green"
      id="skuCameraButton"
      onclick="toggleSkuCamera()">

      📷 เปิดกล้องสแกน SKU

    </button>


    <label style="margin-top:15px;">
      SKU
    </label>

    <input
      id="skuInput"
      type="text"
      placeholder="สแกนหรือพิมพ์ SKU"
      autocomplete="off">


    <button
      class="btn-blue"
      onclick="addSKU()">

      ➕ เพิ่ม SKU

    </button>


    <div id="skuStatus"
         class="status">
    </div>

  </div>


  <!-- SKU LIST -->

  <div class="section">

    <div class="section-title">
      📋 รายการ SKU
    </div>


    <div style="font-size:18px;margin-bottom:10px;">

      จำนวน SKU:
      <strong id="skuCount">0</strong>

    </div>


    <table>

      <thead>

        <tr>

          <th style="width:15%;">
            #
          </th>

          <th>
            SKU
          </th>

          <th style="width:25%;">
            ลบ
          </th>

        </tr>

      </thead>


      <tbody id="skuTableBody">

        <tr id="emptyRow">

          <td colspan="3"
              style="color:#777;padding:25px;">

            ยังไม่มีรายการ SKU

          </td>

        </tr>

      </tbody>

    </table>

  </div>


  <!-- SAVE -->

  <div class="section">

    <button
      class="btn-green"
      id="saveButton"
      onclick="saveData()">

      💾 บันทึกข้อมูลลง Google Sheets

    </button>


    <button
      class="btn-gray"
      onclick="clearAll()">

      🗑️ ล้างข้อมูล

    </button>


    <div id="saveStatus"
         class="status">
    </div>

  </div>


  <!-- HISTORY -->

  <div class="section">

    <div class="section-title">
      🕘 ประวัติการสแกนล่าสุด
    </div>

    <div id="history">

      ยังไม่มีประวัติ

    </div>

  </div>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT URL
   ========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzkUsC_SW53ZrQfS94rjyZzTSlBDdtOoZQd-MUsmK6kHU-oLiOJnQ26RwcKNLeHgPh5qA/exec";


/* =========================================================
   DATA
   ========================================================= */

let skuList = [];

let barcodeReader = null;
let skuReader = null;

let barcodeStream = null;
let skuStream = null;

let barcodeScanning = false;
let skuScanning = false;


/* =========================================================
   ELEMENTS
   ========================================================= */

const employeeInput =
  document.getElementById("employee");

const barcodeInput =
  document.getElementById("barcodeInput");

const skuInput =
  document.getElementById("skuInput");

const skuCount =
  document.getElementById("skuCount");

const skuTableBody =
  document.getElementById("skuTableBody");

const saveButton =
  document.getElementById("saveButton");


/* =========================================================
   STATUS FUNCTION
   ========================================================= */

function showStatus(elementId, message, type){

  const el =
    document.getElementById(elementId);

  el.className =
    "status " + type;

  el.textContent =
    message;

}


function clearStatus(elementId){

  const el =
    document.getElementById(elementId);

  el.className =
    "status";

  el.textContent =
    "";

}


/* =========================================================
   BARCODE CAMERA
   ========================================================= */

async function toggleBarcodeCamera(){

  if(barcodeScanning){

    stopBarcodeCamera();

    return;

  }

  try{

    barcodeMessage.textContent =
      "กำลังเปิดกล้อง...";

    barcodeStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          }
        },

        audio:false

      });


    barcodeVideo.srcObject =
      barcodeStream;

    await barcodeVideo.play();


    barcodeScanning = true;

    barcodeCameraButton.textContent =
      "⏹️ ปิดกล้อง";

    barcodeMessage.textContent =
      "กำลังสแกน Barcode...";


    startBarcodeScanning();

  }catch(error){

    showStatus(
      "barcodeStatus",
      "❌ ไม่สามารถเปิดกล้องได้: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   STOP BARCODE CAMERA
   ========================================================= */

function stopBarcodeCamera(){

  barcodeScanning = false;

  if(barcodeStream){

    barcodeStream
      .getTracks()
      .forEach(track => track.stop());

    barcodeStream = null;

  }

  barcodeVideo.srcObject = null;

  barcodeCameraButton.textContent =
    "📷 เปิดกล้องสแกน Barcode";

  barcodeMessage.textContent =
    "กดเปิดกล้องเพื่อสแกน Barcode";

}


/* =========================================================
   BARCODE SCANNING
   ========================================================= */

function startBarcodeScanning(){

  if(typeof ZXing === "undefined"){

    showStatus(
      "barcodeStatus",
      "❌ ไม่สามารถโหลดระบบสแกนได้",
      "error"
    );

    return;

  }


  barcodeReader =
    new ZXing.BrowserMultiFormatReader();


  barcodeReader.decodeFromVideoDevice(
    null,
    "barcodeVideo",
    function(result, error){

      if(!barcodeScanning){
        return;
      }


      if(result){

        const code =
          result.getText().trim();


        if(code){

          checkBarcodeDuplicate(code);

        }

      }

    }

  );

}


/* =========================================================
   CHECK DUPLICATE BARCODE
   ========================================================= */

async function checkBarcodeDuplicate(code){

  if(!code){
    return;
  }


  /*
    ตรวจซ้ำกับ Barcode ที่กำลังกรอกอยู่
  */

  if(
    barcodeInput.value.trim() === code
  ){

    showStatus(
      "barcodeStatus",
      "⚠️ Barcode นี้ถูกสแกนซ้ำ",
      "warning"
    );

    return;

  }


  /*
    ตอนสแกนจากกล้อง
    ให้ใส่ Barcode ลงช่องก่อน
  */

  barcodeInput.value =
    code;


  /*
    หยุดกล้อง
  */

  stopBarcodeCamera();


  /*
    ตรวจซ้ำใน Google Sheets
  */

  try{

    showStatus(
      "barcodeStatus",
      "🔍 กำลังตรวจสอบ Barcode...",
      "info"
    );


    const response =
      await fetch(
        API_URL +
        "?action=checkBarcode&barcode=" +
        encodeURIComponent(code),
        {
          method:"GET",
          redirect:"follow"
        }
      );


    const text =
      await response.text();


    let data;

    try{

      data =
        JSON.parse(text);

    }catch(e){

      /*
        ถ้า Code.gs รุ่นปัจจุบันยังไม่มี
        action=checkBarcode
        จะไม่บล็อกการใช้งาน
      */

      showStatus(
        "barcodeStatus",
        "✅ Barcode: " + code,
        "success"
      );

      return;

    }


    if(data.duplicate){

      showStatus(
        "barcodeStatus",
        "⚠️ Barcode นี้ถูกสแกนไปแล้ว!",
        "warning"
      );

      barcodeInput.value = "";

      return;

    }


    showStatus(
      "barcodeStatus",
      "✅ Barcode ใช้งานได้",
      "success"
    );


  }catch(error){

    /*
      ไม่ให้กล้องหรือระบบหยุด
      หาก Google Apps Script ตรวจไม่ได้
    */

    showStatus(
      "barcodeStatus",
      "✅ Barcode: " + code,
      "success"
    );

  }

}


/* =========================================================
   SKU CAMERA
   ========================================================= */

async function toggleSkuCamera(){

  if(skuScanning){

    stopSkuCamera();

    return;

  }


  try{

    skuMessage.textContent =
      "กำลังเปิดกล้อง...";


    skuStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          }
        },

        audio:false

      });


    skuVideo.srcObject =
      skuStream;

    await skuVideo.play();


    skuScanning = true;

    skuCameraButton.textContent =
      "⏹️ ปิดกล้อง";

    skuMessage.textContent =
      "กำลังสแกน SKU...";


    startSkuScanning();


  }catch(error){

    showStatus(
      "skuStatus",
      "❌ ไม่สามารถเปิดกล้องได้: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   STOP SKU CAMERA
   ========================================================= */

function stopSkuCamera(){

  skuScanning = false;

  if(skuStream){

    skuStream
      .getTracks()
      .forEach(track => track.stop());

    skuStream = null;

  }

  skuVideo.srcObject = null;

  skuCameraButton.textContent =
    "📷 เปิดกล้องสแกน SKU";

  skuMessage.textContent =
    "กดเปิดกล้องเพื่อสแกน SKU";

}


/* =========================================================
   SKU SCANNING
   ========================================================= */

function startSkuScanning(){

  if(typeof ZXing === "undefined"){

    showStatus(
      "skuStatus",
      "❌ ไม่สามารถโหลดระบบสแกนได้",
      "error"
    );

    return;

  }


  skuReader =
    new ZXing.BrowserMultiFormatReader();


  skuReader.decodeFromVideoDevice(
    null,
    "skuVideo",
    function(result,error){

      if(!skuScanning){
        return;
      }


      if(result){

        const code =
          result.getText().trim();


        if(code){

          skuInput.value =
            code;

          stopSkuCamera();

          addSKU();

        }

      }

    }

  );

}


/* =========================================================
   ADD SKU
   ========================================================= */

function addSKU(){

  const sku =
    skuInput.value.trim();


  if(!sku){

    showStatus(
      "skuStatus",
      "❌ กรุณาสแกนหรือกรอก SKU ก่อน",
      "error"
    );

    skuInput.focus();

    return;

  }


  /*
    สำคัญ:
    SKU ซ้ำได้
    ดังนั้นตรงนี้ไม่ตรวจซ้ำ
  */


  skuList.push(sku);


  skuInput.value = "";


  renderSKU();


  showStatus(
    "skuStatus",
    "✅ เพิ่ม SKU สำเร็จ",
    "success"
  );


  skuInput.focus();

}


/* =========================================================
   RENDER SKU
   ========================================================= */

function renderSKU(){

  skuCount.textContent =
    skuList.length;


  skuTableBody.innerHTML = "";


  if(skuList.length === 0){

    skuTableBody.innerHTML = `

      <tr>

        <td colspan="3"
            style="color:#777;padding:25px;">

          ยังไม่มีรายการ SKU

        </td>

      </tr>

    `;

    return;

  }


  skuList.forEach(
    function(sku,index){

      const row =
        document.createElement("tr");


      row.innerHTML = `

        <td>
          ${index + 1}
        </td>

        <td>
          <strong>${escapeHtml(sku)}</strong>
        </td>

        <td>

          <button
            class="delete-btn"
            onclick="removeSKU(${index})">

            ลบ

          </button>

        </td>

      `;


      skuTableBody.appendChild(row);

    }
  );

}


/* =========================================================
   REMOVE SKU
   ========================================================= */

function removeSKU(index){

  skuList.splice(index,1);

  renderSKU();

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =========================================================
   SAVE DATA
   ========================================================= */

async function saveData(){

  clearStatus("saveStatus");


  const employee =
    employeeInput.value.trim();


  const barcode =
    barcodeInput.value.trim();


  /*
    ตรวจชื่อพนักงาน
  */

  if(!employee){

    showStatus(
      "saveStatus",
      "❌ กรุณาเลือกชื่อพนักงานก่อน",
      "error"
    );

    employeeInput.focus();

    return;

  }


  /*
    ตรวจ Barcode
  */

  if(!barcode){

    showStatus(
      "saveStatus",
      "❌ กรุณาสแกน Barcode ก่อน",
      "error"
    );

    barcodeInput.focus();

    return;

  }


  /*
    ตรวจ SKU
  */

  if(skuList.length === 0){

    showStatus(
      "saveStatus",
      "❌ กรุณาเพิ่ม SKU อย่างน้อย 1 รายการ",
      "error"
    );

    skuInput.focus();

    return;

  }


  /*
    ป้องกันการกดบันทึกซ้ำ
  */

  saveButton.disabled = true;

  saveButton.textContent =
    "⏳ กำลังบันทึก...";


  showStatus(
    "saveStatus",
    "⏳ กำลังส่งข้อมูลไป Google Sheets...",
    "info"
  );


  /*
    ข้อมูลที่จะส่ง
  */

  const data = {

    employee: employee,

    barcode: barcode,

    skus: [...skuList],

    barcodeTime:
      new Date().toISOString()

  };


  try{

    /*
      สำคัญมาก:
      ใช้ text/plain
      เพื่อหลีกเลี่ยง CORS preflight
      กับ Apps Script Web App
    */

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          redirect:"follow",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(data)

        }
      );


    const text =
      await response.text();


    if(!text){

      throw new Error(
        "ไม่ได้รับข้อมูลจากระบบ"
      );

    }


    let result;


    try{

      result =
        JSON.parse(text);

    }catch(error){

      throw new Error(
        "ระบบตอบกลับไม่ถูกต้อง"
      );

    }


    /*
      Barcode ซ้ำ
    */

    if(
      result.duplicate === true
    ){

      showStatus(
        "saveStatus",
        "⚠️ Barcode นี้ถูกสแกนไปแล้ว ไม่ได้บันทึกซ้ำ",
        "warning"
      );

      return;

    }


    /*
      Error จาก Apps Script
    */

    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        "บันทึกข้อมูลไม่สำเร็จ"
      );

    }


    /*
      สำเร็จ
    */

    showStatus(
      "saveStatus",
      "✅ บันทึกข้อมูลสำเร็จ!",
      "success"
    );


    /*
      บันทึกประวัติ
    */

    addHistory(
      employee,
      barcode,
      skuList.length
    );


    /*
      ล้างข้อมูลหลังบันทึก
    */

    barcodeInput.value = "";

    skuList = [];

    renderSKU();


    /*
      เลือกชื่อพนักงานคงเดิม
      เพื่อให้สแกนรายการต่อได้
    */


  }catch(error){

    console.error(error);


    showStatus(
      "saveStatus",
      "❌ บันทึกไม่สำเร็จ: " +
      error.message,
      "error"
    );


  }finally{

    saveButton.disabled = false;

    saveButton.textContent =
      "💾 บันทึกข้อมูลลง Google Sheets";

  }

}


/* =========================================================
   HISTORY
   ========================================================= */

function addHistory(
  employee,
  barcode,
  count
){

  const history =
    document.getElementById("history");


  const now =
    new Date();


  const time =
    now.toLocaleString(
      "th-TH",
      {
        dateStyle:"short",
        timeStyle:"medium"
      }
    );


  /*
    ถ้ายังไม่มีประวัติ
  */

  if(
    history.textContent.trim() ===
    "ยังไม่มีประวัติ"
  ){

    history.innerHTML = "";

  }


  const item =
    document.createElement("div");


  item.className =
    "history-item";


  item.innerHTML = `

    <strong>📦 ${escapeHtml(barcode)}</strong>

    <br>

    👤 ${escapeHtml(employee)}

    <br>

    🏷️ ${count} SKU

    <div class="small">
      ${time}
    </div>

  `;


  history.prepend(item);

}


/* =========================================================
   CLEAR ALL
   ========================================================= */

function clearAll(){

  const confirmClear =
    confirm(
      "ต้องการล้างข้อมูลทั้งหมดหรือไม่?"
    );


  if(!confirmClear){
    return;
  }


  barcodeInput.value = "";

  skuInput.value = "";

  skuList = [];

  renderSKU();


  clearStatus("barcodeStatus");

  clearStatus("skuStatus");

  clearStatus("saveStatus");


  stopBarcodeCamera();

  stopSkuCamera();

}


/* =========================================================
   ENTER KEY
   ========================================================= */

barcodeInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      checkBarcodeDuplicate(
        barcodeInput.value.trim()
      );

    }

  }
);


skuInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      addSKU();

    }

  }
);


/* =========================================================
   PAGE LOAD
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    renderSKU();

  }
);

</script>
