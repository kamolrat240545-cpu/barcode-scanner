*{

}

body{
  margin:0;
  padding:15px;

  font-family:Arial,"Noto Sans",sans-serif;
  color:#222;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.title{
  font-size:27px;
  font-weight:bold;
}

.lang{
  width:auto;
  min-width:120px;
  padding:10px 12px;
  font-size:16px;
  border-radius:12px;
}

h2{
  margin:0 0 15px;
}

label{
  display:block;
  font-size:19px;
  font-weight:bold;
  margin-bottom:9px;
}

select,
input{
  width:100%;
  padding:15px;
  border:2px solid #ddd;
  border-radius:14px;
  font-size:18px;
  background:#fff;
  outline:none;
}

select:focus,
input:focus{
  border-color:#1976d2;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
  color:#fff;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

.blue{
  background:#1976d2;
}

.green{
  background:#16a34a;
}

.gray{
  background:#6b7280;
}

.red{
  background:#dc2626;
}

.orange{
  background:#f59e0b;
}

.camera{
  background:#111;
  border-radius:16px;
  overflow:hidden;
  margin-top:12px;
}

#barcode-reader,
#sku-reader{
  width:100%;
}

#barcode-reader video,
#sku-reader video{
  width:100%!important;
  height:auto!important;
}

.hidden{
  display:none!important;
}

.message{
  padding:14px;
  border-radius:14px;
  margin-top:12px;
  font-size:17px;
  font-weight:bold;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.warning{
  background:#fef3c7;
  color:#92400e;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.info{
  background:#dbeafe;
  color:#1e40af;
}

.sku-item{
  display:flex;
  gap:8px;
  margin-bottom:8px;
}

.sku-item input{
  flex:1;
}

.delete-sku{
  width:65px;
  margin:0;
  padding:10px;
  background:#dc2626;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  border:1px solid #ddd;
  padding:10px 7px;
  text-align:center;
  word-break:break-word;
}

th{
  background:#eef2ff;
}

@media(max-width:600px){

  .title{
    font-size:22px;
  }

  .header{
    align-items:flex-start;
  }

  .lang{
    min-width:105px;
  }

  .card{
    padding:15px;
  }

}
</style>

/* =====================================================
   BARCODE SCANNER
===================================================== */

async function startBarcodeScanner(){

  if(barcodeScanning){
    return;
  }


  barcodeProcessing =
    false;


  document
    .getElementById("barcode-camera-area")
    .classList
    .remove("hidden");


  document
    .getElementById("openBarcodeBtn")
    .classList
    .add("hidden");


  try{

    barcodeScanner =
      new Html5Qrcode(
        "barcode-reader"
      );


    barcodeScanning =
      true;


    await barcodeScanner.start(

      {
        facingMode:"environment"
      },

      {

        fps:15,

        qrbox:function(
          width,
          height
        ){

          return{

            width:
              Math.floor(
                width * .9
              ),

            height:
              Math.floor(
                Math.min(
                  height * .5,
                  300
                )
              )

          };

        },

        formatsToSupport:
          SKU_FORMATS

      },


      function(decodedText){

        handleBarcodeScan(
          decodedText
        );

      },


      function(errorMessage){

      }

    );


  }catch(error){

    barcodeScanning =
      false;

    barcodeProcessing =
      false;


    if(barcodeScanner){

      try{

        await barcodeScanner.clear();

      }catch(e){}


      barcodeScanner =
        null;

    }


    document
      .getElementById("barcode-camera-area")
      .classList
      .add("hidden");


    document
      .getElementById("openBarcodeBtn")
      .classList
      .remove("hidden");


    showMessage(

      "barcode-message",

      "error",

      "❌ " +
      escapeHtml(
        error.message ||
        error
      )

    );

  }

}


/* =====================================================
   HANDLE BARCODE
===================================================== */

async function handleBarcodeScan(
  decodedText
){

  if(!barcodeScanning){
    return;
  }


  if(barcodeProcessing){
    return;
  }


  barcodeProcessing =
    true;


  const barcode =
    String(
      decodedText || ""
    ).trim();


  if(!barcode){

    barcodeProcessing =
      false;

    return;

  }


  await stopBarcodeScanner();


  document
    .getElementById("barcode")
    .value =
      barcode;


  await checkBarcode(
    barcode
  );

}


/* =====================================================
   STOP BARCODE SCANNER
===================================================== */

async function stopBarcodeScanner(){

  barcodeScanning =
    false;


  if(barcodeScanner){

    const scanner =
      barcodeScanner;

    barcodeScanner =
      null;


    try{

      await scanner.stop();

    }catch(e){}


    try{

      await scanner.clear();

    }catch(e){}

  }


  document
    .getElementById("barcode-reader")
    .innerHTML =
      "";


  document
    .getElementById("barcode-camera-area")
    .classList
    .add("hidden");


  document
    .getElementById("openBarcodeBtn")
    .classList
    .remove("hidden");

}


/* =====================================================
   CHECK BARCODE MANUAL
===================================================== */

function checkBarcodeManual(){

  const barcode =
    document
      .getElementById("barcode")
      .value
      .trim();


  if(!barcode){

    showMessage(

      "barcode-message",

      "error",

      t("needBarcode")

    );

    return;

  }


  checkBarcode(
    barcode
  );

}


/* =====================================================
   CHECK BARCODE
===================================================== */

async function checkBarcode(
  barcode
){

  showMessage(

    "barcode-message",

    "info",

    t("barcodeChecking")

  );


  try{

    const response =
      await fetch(

        API_URL +

        "?action=checkBarcode" +

        "&barcode=" +

        encodeURIComponent(
          barcode
        )

      );


    const result =
      await response.json();


    if(
      result &&
      result.exists
    ){

      showMessage(

        "barcode-message",

        "warning",

        t("barcodeDuplicate")

      );

      return;

    }


    showMessage(

      "barcode-message",

      "success",

      t("barcodeOK")

    );


  }catch(error){

    showMessage(

      "barcode-message",

      "error",

      "❌ " +
      escapeHtml(
        error.message ||
        t("barcodeFail")
      )

    );

  }

}


/* =====================================================
   SKU SCANNER
   แก้ปัญหาเปิดกล้องใหม่แล้ว SKU เดิมถูกเพิ่ม
===================================================== */

async function startSkuScanner(){

  if(skuScanning){
    return;
  }


  /*
   * สร้าง generation ใหม่
   */
  ++skuScannerGeneration;


  const generation =
    skuScannerGeneration;


  skuProcessing =
    false;


  document
    .getElementById("sku-camera-area")
    .classList
    .remove("hidden");


  document
    .getElementById("openSkuBtn")
    .classList
    .add("hidden");


  const reader =
    document
      .getElementById("sku-reader");


  if(reader){
    reader.innerHTML = "";
  }


  try{

    skuScanner =
      new Html5Qrcode(
        "sku-reader"
      );


    skuScanning =
      true;


    await skuScanner.start(

      {
        facingMode:"environment"
      },

      {

        fps:15,

        qrbox:function(
          width,
          height
        ){

          /*
           * กรอบแนวนอน
           * สำหรับ Barcode แบบเส้น
           */

          return{

            width:
              Math.floor(
                width * .90
              ),

            height:
              Math.floor(
                Math.min(
                  height * .55,
                  300
                )
              )

          };

        },

        aspectRatio:1.0,

        formatsToSupport:
          SKU_FORMATS,

        experimentalFeatures:{
          useBarCodeDetectorIfSupported:true
        }

      },


      /*
       * อ่าน Barcode สำเร็จ
       */

      function(decodedText){

        /*
         * callback จากกล้องรอบเก่า
         * ห้ามใช้งาน
         */

        if(
          generation !==
          skuScannerGeneration
        ){

          return;

        }


        if(!skuScanning){
          return;
        }


        if(skuProcessing){
          return;
        }


        handleSkuScan(
          decodedText,
          generation
        );

      },


      /*
       * อ่านไม่เจอ
       */

      function(errorMessage){

        /*
         * ไม่ต้องแสดง error
         */

      }

    );


  }catch(error){

    /*
     * ถ้าเป็นกล้องรอบเก่า
     * ห้ามไปเปลี่ยน UI
     */

    if(
      generation !==
      skuScannerGeneration
    ){

      return;

    }


    skuScanning =
      false;

    skuProcessing =
      false;


    if(skuScanner){

      const scanner =
        skuScanner;

      skuScanner =
        null;


      try{

        await scanner.stop();

      }catch(e){}


      try{

        await scanner.clear();

      }catch(e){}

    }


    if(reader){

      reader.innerHTML = "";

    }


    document
      .getElementById("sku-camera-area")
      .classList
      .add("hidden");


    document
      .getElementById("openSkuBtn")
      .classList
      .remove("hidden");


    showMessage(

      "sku-message",

      "error",

      "❌ " +
      escapeHtml(
        error.message ||
        error
      )

    );

  }

}


/* =====================================================
   HANDLE SKU SCAN
===================================================== */

async function handleSkuScan(
  decodedText,
  generation
){

  /*
   * callback จากกล้องเก่า
   */

  if(
    generation !==
    skuScannerGeneration
  ){

    return;

  }


  /*
   * กล้องถูกปิดแล้ว
   */

  if(!skuScanning){

    return;

  }


  /*
   * กำลังประมวลผลอยู่
   */

  if(skuProcessing){

    return;

  }


  /*
   * ล็อกทันที
   */

  skuProcessing =
    true;


  const sku =
    String(
      decodedText || ""
    ).trim();


  if(!sku){

    skuProcessing =
      false;

    return;

  }


  /*
   * ตรวจอีกครั้งก่อนหยุดกล้อง
   */

  if(
    generation !==
    skuScannerGeneration
  ){

    skuProcessing =
      false;

    return;

  }


  /*
   * หยุดเฉพาะกล้องรอบที่กำลังสแกน
   */

  await stopSkuScanner(
    generation
  );


  /*
   * ถ้ามีรอบใหม่เกิดขึ้นระหว่าง await
   * ไม่ต้องเอาค่าเก่ามาใส่
   */

  if(
    generation !==
    skuScannerGeneration
  ){

    skuProcessing =
      false;

    return;

  }


  document
    .getElementById("skuInput")
    .value =
      sku;


  addSku(
    sku
  );

}


/* =====================================================
   STOP SKU SCANNER
===================================================== */

async function stopSkuScanner(
  generation
){

  /*
   * ถ้าสั่งหยุดจาก callback เก่า
   * ห้ามปิดกล้องรอบใหม่
   */

  if(
    generation !== undefined &&
    generation !== skuScannerGeneration
  ){

    return;

  }


  /*
   * ทำให้ callback ที่ค้างอยู่
   * กลายเป็น callback ของรอบเก่า
   */

  ++skuScannerGeneration;


  skuScanning =
    false;


  const scanner =
    skuScanner;


  skuScanner =
    null;


  if(scanner){

    try{

      await scanner.stop();

    }catch(e){}


    try{

      await scanner.clear();

    }catch(e){}

  }


  const reader =
    document
      .getElementById("sku-reader");


  if(reader){

    reader.innerHTML =
      "";

  }


  document
    .getElementById("sku-camera-area")
    .classList
    .add("hidden");


  document
    .getElementById("openSkuBtn")
    .classList
    .remove("hidden");

}

/* =====================================================
   ADD SKU
===================================================== */

function addSku(sku){

  sku =
    String(
      sku || ""
    ).trim();


  if(!sku){

    skuProcessing =
      false;

    return;

  }


  /*
   * ไม่ตรวจ SKU ซ้ำ
   *
   * เพราะผู้ใช้สามารถเพิ่ม SKU เดิม
   * ได้ถ้าตั้งใจ
   */

  skus.push(
    sku
  );


  document
    .getElementById("skuInput")
    .value =
      "";


  renderSkuList();


  showMessage(

    "sku-message",

    "success",

    t("skuAdded")

  );


  skuProcessing =
    false;

}

  /*
   * หยุดกล้องทั้งสองตัว
   */

  document

   */

  showMessage(

  );

    ""
  );

    ""
  );

}


/* =====================================================
   LOAD HISTORY
===================================================== */

async function loadHistory(){

  const tbody =
    document.getElementById(
      "historyBody"
    );


  tbody.innerHTML = `

    <tr>

      <td colspan="4">

        ${escapeHtml(
          t("loading")
        )}

      </td>

    </tr>

  `;


  try{

    const response =
      await fetch(

        API_URL +
        "?action=getHistory" +
        "&_=" +
        Date.now()

      );


    const result =
      await response.json();


    if(
      !result ||
      !result.success
    ){

      throw new Error(
        result &&
        result.message
          ? result.message
          : "โหลดประวัติไม่สำเร็จ"
      );

    }


    const history =
      Array.isArray(
        result.data
      )
        ? result.data
        : [];


    if(history.length === 0){

      tbody.innerHTML = `

        <tr>

          <td colspan="4">

            ${escapeHtml(
              t("noHistory")
            )}

          </td>

        </tr>

      `;

      return;

    }


    /*
     * แสดงล่าสุดก่อน
     */

    tbody.innerHTML = "";


    history.forEach(
      function(item){

        const tr =
          document.createElement(
            "tr"
          );


        const timeTd =
          document.createElement(
            "td"
          );

        timeTd.innerText =
          item.time || "";


        const employeeTd =
          document.createElement(
            "td"
          );

        employeeTd.innerText =
          item.employee || "";


        const barcodeTd =
          document.createElement(
            "td"
          );

        barcodeTd.innerText =
          item.barcode || "";


        const skuTd =
          document.createElement(
            "td"
          );

        skuTd.innerText =
          item.sku || "";


        tr.appendChild(
          timeTd
        );

        tr.appendChild(
          employeeTd
        );

        tr.appendChild(
          barcodeTd
        );

        tr.appendChild(
          skuTd
        );


        tbody.appendChild(
          tr
        );

      }
    );


  }catch(error){

    console.error(
      "History error:",
      error
    );


    tbody.innerHTML = `

      <tr>

        <td
          colspan="4"
          style="
            color:#dc2626;
            text-align:center;
          "
        >

          ❌ ${escapeHtml(
            error.message ||
            error
          )}

        </td>

      </tr>

    `;

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
