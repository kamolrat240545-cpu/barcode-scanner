<!-- ==================================================
     SAVE
================================================== -->

<div class="card">

<button
class="green"
onclick="saveData()">

💾 บันทึกข้อมูลลง Google Sheets

</button>

class="gray"
onclick="clearData()">

🗑️ ล้างข้อมูล

</button>

<script>

/* ==================================================
   GOOGLE APPS SCRIPT URL
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzAItW_zCe786FtP5-bjUrQXU4Fv_pgr5TK8IDRDYnMBjYIRxJl6tOedfsbYjCSH2aUGQ/exec";


/* ==================================================
   VARIABLES
================================================== */

let skuList = [];

let barcodeReader = null;

let skuReader = null;


/* ==================================================
   BARCODE
================================================== */

async function startBarcode() {

  try {

    stopBarcode();

    barcodeReader =
      new ZXing.BrowserMultiFormatReader();

    const video =
      document.getElementById(
        "barcodeVideo"
      );

    document.getElementById(
      "barcodeCameraText"
    ).innerText =
      "กำลังสแกน Barcode...";

    await barcodeReader.decodeFromConstraints(
      {
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      },
      video,
      async function(result) {

        if (!result) return;

        const code =
          result.getText().trim();

        if (!code) return;

        document.getElementById(
          "barcode"
        ).value = code;

        stopBarcode();

        // ตรวจ Barcode ทันที
        await checkDuplicateBarcode(code);

      }
    );

  } catch (error) {

    showStatus(
      "barcodeStatus",
      "❌ เปิดกล้องไม่ได้: " +
      error.message,
      "err"
    );

  }

}


function stopBarcode() {

  if (barcodeReader) {

    try {
      barcodeReader.reset();
    } catch(e) {}

    barcodeReader = null;

  }

}


/* ==================================================
   CHECK DUPLICATE BARCODE
================================================== */

async function checkDuplicateBarcode(barcode) {

  showStatus(
    "barcodeStatus",
    "กำลังตรวจสอบ Barcode...",
    "warn"
  );

  try {

    const url =
      API_URL +
      "?action=checkBarcode&barcode=" +
      encodeURIComponent(barcode);

    const response =
      await fetch(url);

    const result =
      await response.json();

    if (result.duplicate) {

      alert(
        "⚠️ BARCODE ซ้ำ!\n\n" +
        "Barcode นี้เคยสแกนแล้ว\n\n" +
        barcode
      );

      document.getElementById(
        "barcode"
      ).value = "";

      showStatus(
        "barcodeStatus",
        "❌ Barcode ซ้ำ ไม่สามารถใช้ Barcode นี้ได้",
        "err"
      );

      return false;

    }

    showStatus(
      "barcodeStatus",
      "✅ Barcode นี้ยังไม่ซ้ำ สามารถใช้งานได้",
      "ok"
    );

    return true;

  } catch (error) {

    showStatus(
      "barcodeStatus",
      "❌ ตรวจสอบ Barcode ไม่สำเร็จ",
      "err"
    );

    return false;

  }

}


/* ==================================================
   SKU CAMERA
================================================== */

async function startSKU() {

  try {

    stopSKU();

    skuReader =
      new ZXing.BrowserMultiFormatReader();

    const video =
      document.getElementById(
        "skuVideo"
      );

    document.getElementById(
      "skuCameraText"
    ).innerText =
      "กำลังสแกน SKU...";

    await skuReader.decodeFromConstraints(
      {
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      },
      video,
      function(result) {

        if (!result) return;

        const code =
          result.getText().trim();

        if (!code) return;

        document.getElementById(
          "skuInput"
        ).value = code;

        stopSKU();

        addSKU();

      }
    );

  } catch (error) {

    showStatus(
      "skuStatus",
      "❌ เปิดกล้องไม่ได้: " +
      error.message,
      "err"
    );

  }

}


function stopSKU() {

  if (skuReader) {

    try {
      skuReader.reset();
    } catch(e) {}

    skuReader = null;

  }

}


/* ==================================================
   ADD SKU
================================================== */

function addSKU() {

  const input =
    document.getElementById(
      "skuInput"
    );

  const sku =
    input.value.trim();

  if (!sku) {

    showStatus(
      "skuStatus",
      "กรุณาสแกนหรือกรอก SKU",
      "err"
    );

    return;

  }

  /*
   * สำคัญ:
   *
   * SKU ซ้ำได้
   *
   * ไม่ตรวจ SKU ซ้ำ
   */

  skuList.push(sku);

  input.value = "";

  renderSKU();

  showStatus(
    "skuStatus",
    "✅ เพิ่ม SKU แล้ว",
    "ok"
  );

}


/* ==================================================
   RENDER SKU
================================================== */

function renderSKU() {

  const table =
    document.getElementById(
      "skuTable"
    );

  document.getElementById(
    "skuCount"
  ).innerText =
    skuList.length;

  if (skuList.length === 0) {

    table.innerHTML = `
      <tr>
        <td colspan="3" class="center">
          ยังไม่มี SKU
        </td>
      </tr>
    `;

    return;

  }

  table.innerHTML = "";

  skuList.forEach(
    function(sku, index) {

      const row =
        document.createElement("tr");

      row.innerHTML = `
        <td>${index + 1}</td>

        <td>${escapeHTML(sku)}</td>

        <td>
          <button
            class="red sku-delete"
            onclick="deleteSKU(${index})">
            ลบ
          </button>
        </td>
      `;

      table.appendChild(row);

    }
  );

}


function deleteSKU(index) {

  skuList.splice(index, 1);

  renderSKU();

}


/* ==================================================
   SAVE
================================================== */

async function saveData() {

  const employee =
    document.getElementById(
      "employee"
    ).value;

  const barcode =
    document.getElementById(
      "barcode"
    ).value.trim();


  if (!employee) {

    showStatus(
      "saveStatus",
      "❌ กรุณาเลือกชื่อพนักงาน",
      "err"
    );

    return;

  }


  if (!barcode) {

    showStatus(
      "saveStatus",
      "❌ กรุณาสแกน Barcode",
      "err"
    );

    return;

  }


  if (skuList.length === 0) {

    showStatus(
      "saveStatus",
      "❌ กรุณาเพิ่ม SKU อย่างน้อย 1 รายการ",
      "err"
    );

    return;

  }


  // ตรวจ Barcode ก่อนบันทึก
  const isValid =
    await checkDuplicateBarcode(barcode);

  if (!isValid) {
    return;
  }


  showStatus(
    "saveStatus",
    "⏳ กำลังบันทึกข้อมูล...",
    "warn"
  );


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            employee: employee,

            barcode: barcode,

            skus: skuList

          })

        }
      );


    const result =
      await response.json();


    if (result.duplicate) {

      alert(
        "⚠️ Barcode ซ้ำ!\n\n" +
        "ไม่ได้บันทึกข้อมูล"
      );

      showStatus(
        "saveStatus",
        "❌ Barcode ซ้ำ",
        "err"
      );

      return;

    }


    if (!result.success) {

      throw new Error(
        result.message ||
        "บันทึกไม่สำเร็จ"
      );

    }


    showStatus(
      "saveStatus",
      "✅ บันทึกข้อมูลเรียบร้อยแล้ว",
      "ok"
    );


    alert(
      "✅ บันทึกสำเร็จ\n\n" +
      "พนักงาน: " +
      employee +
      "\nBarcode: " +
      barcode +
      "\nจำนวน SKU: " +
      skuList.length
    );


    clearData();

  } catch (error) {

    showStatus(
      "saveStatus",
      "❌ บันทึกไม่สำเร็จ: " +
      error.message,
      "err"
    );

  }

}


/* ==================================================
   CLEAR
================================================== */

function clearData() {

  stopBarcode();

  stopSKU();

  skuList = [];

  document.getElementById(
    "barcode"
  ).value = "";

  document.getElementById(
    "skuInput"
  ).value = "";

  document.getElementById(
    "barcodeStatus"
  ).innerHTML = "";

  document.getElementById(
    "skuStatus"
  ).innerHTML = "";

  document.getElementById(
    "saveStatus"
  ).innerHTML = "";

  renderSKU();

}


/* ==================================================
   ENTER = ADD SKU
================================================== */

document
  .getElementById("skuInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        addSKU();

      }

    }
  );


/* ==================================================
   HTML SECURITY
================================================== */

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* ==================================================
   START
================================================== */

renderSKU();

</script>

</body>
