*{box-sizing:border-box}

body{
  margin:0;
  padding:15px;
  background:#f1f3f6;
  font-family:Arial,"Noto Sans",sans-serif;
  color:#222;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.title{
  font-size:27px;
  font-weight:bold;
}

.lang{
  width:auto;
  min-width:120px;
  padding:10px 12px;
  font-size:16px;
  border-radius:12px;
}

h2{
  margin:0 0 15px;
}

label{
  display:block;
  font-size:19px;
  font-weight:bold;
  margin-bottom:9px;
}

select,input{
  width:100%;
  padding:15px;
  border:2px solid #ddd;
  border-radius:14px;
  font-size:18px;
  background:#fff;
  outline:none;
}

select:focus,input:focus{
  border-color:#1976d2;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
  color:#fff;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

.blue{background:#1976d2}
.green{background:#16a34a}
.gray{background:#6b7280}
.red{background:#dc2626}
.orange{background:#f59e0b}

.camera{
  background:#111;
  border-radius:16px;
  overflow:hidden;
  margin-top:12px;
}

#barcode-reader,
#sku-reader{
  width:100%;
}

#barcode-reader video,
#sku-reader video{
  width:100%!important;
  height:auto!important;
}

.hidden{
  display:none!important;
}

.message{
  padding:14px;
  border-radius:14px;
  margin-top:12px;
  font-size:17px;
  font-weight:bold;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.warning{
  background:#fef3c7;
  color:#92400e;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.info{
  background:#dbeafe;
  color:#1e40af;
}

.sku-item{
  display:flex;
  gap:8px;
  margin-bottom:8px;
}

.sku-item input{
  flex:1;
}

.delete-sku{
  width:65px;
  margin:0;
  padding:10px;
  background:#dc2626;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:10px 7px;
  text-align:center;
  word-break:break-word;
}

th{
  background:#eef2ff;
}

@media(max-width:600px){
  .title{
    font-size:22px;
  }

  .header{
    align-items:flex-start;
  }

  .lang{
    min-width:105px;
  }

  .card{
    padding:15px;

  localStorage.getItem("scannerLanguage") || "th";


function t(key){

  return (
    translations[currentLanguage] &&
    translations[currentLanguage][key]
  ) || translations.th[key] || key;

}


/* =====================================================
   CHANGE LANGUAGE
===================================================== */

function changeLanguage(){

  currentLanguage =
    document.getElementById("language").value;

  localStorage.setItem(
    "scannerLanguage",
    currentLanguage
  );

  applyLanguage();

}

async function startBarcodeScanner(){

  document
    .getElementById("openBarcodeBtn")

            width:size,

          };

        },

      .classList.remove("hidden");

  if(barcodeProcessing)return;

  barcodeProcessing = true;

  const barcode =

  if(!barcode){

    barcodeProcessing = false;
    return;

  }

/* =====================================================
   BARCODE CHECK JSONP
===================================================== */

function checkBarcode(barcode){

  return new Promise(function(resolve){

    const callback =
      "barcode_" +
      Date.now() +
      "_" +
      Math.floor(Math.random()*99999);

    const script =
      document.createElement("script");

    let finished = false;


    const timer =
      setTimeout(function(){

        if(finished)return;

        finished = true;

        cleanup();

        showMessage(
          "barcode-message",
          "error",
          t("barcodeFail")
        );

        barcodeProcessing = false;

        resolve(false);

      },15000);


    function cleanup(){

      clearTimeout(timer);

      try{
        delete window[callback];
      }catch(e){}

      if(script.parentNode){
        script.parentNode.removeChild(script);
      }

    }


    window[callback] =
      function(data){

        if(finished)return;

        finished = true;

        cleanup();


        if(!data || !data.success){

          showMessage(
            "barcode-message",
            "error",
            "❌ " +
            escapeHtml(
              data &&
              data.message
                ? data.message
                : t("barcodeFail")
            )
          );

          barcodeProcessing = false;

          resolve(false);

          return;

        }


        // =================================================
        // BARCODE ซ้ำ
        // =================================================

        if(data.duplicate){

          showMessage(
            "barcode-message",
            "warning",
            t("barcodeDuplicate") +
            "<br>" +
            escapeHtml(barcode)
          );

          barcodeProcessing = false;

          resolve(false);

          return;

        }


        // =================================================
        // BARCODE ใหม่
        // =================================================

        showMessage(
          "barcode-message",
          "success",
          t("barcodeOK")
        );

        barcodeProcessing = false;

        resolve(true);

      };


    script.onerror =
      function(){

        if(finished)return;

        finished = true;

        cleanup();

        showMessage(
          "barcode-message",
          "error",
          t("barcodeFail")
        );

        barcodeProcessing = false;

        resolve(false);

      };


    script.src =
      API_URL +
      "?action=checkBarcode" +
      "&barcode=" +
      encodeURIComponent(barcode) +
      "&callback=" +
      callback +
      "&_=" +
      Date.now();


    document.body.appendChild(script);

  });

}

/* =====================================================
   ADD SKU
   สำคัญ:
   ไม่มีการตรวจ SKU ซ้ำ
   ดังนั้น SKU ซ้ำสามารถเพิ่มได้
===================================================== */

function addSku(sku){

  sku =
    String(sku || "").trim();

  if(!sku){

    skuProcessing = false;

    return;

  }


  // ===================================================
  // ไม่เช็กซ้ำ
  // SKU ซ้ำสามารถเพิ่มได้
  // ===================================================

  skus.push(sku);


  document
    .getElementById("skuInput")
    .value = "";


  renderSkuList();


  showMessage(
    "sku-message",
    "success",
    t("skuAdded")
  );


  skuProcessing = false;

}


/* =====================================================
   RENDER SKU
===================================================== */

function renderSkuList(){

  const box =
    document.getElementById("skuList");


  if(skus.length===0){

    box.innerHTML =
      `<div style="
        text-align:center;
        padding:15px;
        color:#777;">
        ${escapeHtml(t("noSku"))}
      </div>`;

    return;

  }


  let html = "";


  skus.forEach(function(sku,index){

    html += `
      <div class="sku-item">

        <input
          value="${escapeHtml(sku)}"
          readonly>

        <button
          class="delete-sku"
          onclick="removeSku(${index})">
          🗑️
        </button>

      </div>
    `;

  });


  box.innerHTML = html;

}


/* =====================================================
   REMOVE SKU
===================================================== */

function removeSku(index){

  skus.splice(index,1);

  renderSkuList();

}


/* =====================================================
   SAVE
===================================================== */

async function saveData(){

  const employee =
    document
      .getElementById("employee")
      .value
      .trim();

  const barcode =
    document
      .getElementById("barcode")
      .value
      .trim();


  if(!employee){

    showMessage(
      "save-message",
      "error",
      t("needEmployee")
    );

    return;

  }


  if(!barcode){

    showMessage(
      "save-message",
      "error",
      t("needBarcode")
    );

    return;

  }


  if(skus.length===0){

    showMessage(
      "save-message",
      "error",
      t("needSku")
    );

    return;

  }


  const saveBtn =
    document.getElementById("saveBtn");


  saveBtn.disabled = true;

  saveBtn.textContent =
    t("saving");


  try{

    const payload = {

      employee:employee,

      barcode:barcode,

      skus:skus

    };


    const response =
      await fetch(API_URL,{

        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:JSON.stringify(payload)

      });


    const result =
      await response.json();


    if(!result.success){

      // ถ้า Barcode ซ้ำ
      if(result.duplicate){

        showMessage(
          "save-message",
          "warning",
          t("barcodeDuplicate")
        );

      }else{

        showMessage(
          "save-message",
          "error",
          "❌ " +
          escapeHtml(
            result.message ||
            t("saveFail")
          )
        );

      }

      return;

    }


    showMessage(
      "save-message",
      "success",
      t("saveSuccess")
    );


    // ล้างข้อมูลหลังบันทึก
    document
      .getElementById("barcode")
      .value = "";


    skus = [];

    renderSkuList();


    document
      .getElementById("barcode-message")
      .innerHTML = "";


    document
      .getElementById("sku-message")
      .innerHTML = "";


    loadHistory();


  }catch(error){

    showMessage(
      "save-message",
      "error",
      "❌ " +
      escapeHtml(
        error.message ||
        t("saveFail")
      )
    );

  }finally{

    saveBtn.disabled = false;

    saveBtn.textContent =
      t("save");

  }

}

/* =====================================================
   HISTORY
===================================================== */

function loadHistory(){

  const body =
    document.getElementById("historyBody");


  body.innerHTML = `
    <tr>
      <td colspan="4">
        ${escapeHtml(t("loading"))}
      </td>
    </tr>
  `;


  const callback =
    "history_" +
    Date.now() +
    "_" +
    Math.floor(Math.random()*99999);


  const script =
    document.createElement("script");


  let finished = false;


  const timer =
    setTimeout(function(){

      if(finished)return;

      finished = true;

      cleanup();

      body.innerHTML = `
        <tr>
          <td colspan="4">
            ❌ ${escapeHtml(t("saveFail"))}
          </td>
        </tr>
      `;

    },15000);


  function cleanup(){

    clearTimeout(timer);

    try{
      delete window[callback];
    }catch(e){}

    if(script.parentNode){
      script.parentNode.removeChild(script);
    }

  }


  window[callback] =
    function(data){

      if(finished)return;

      finished = true;

      cleanup();


      if(
        !data ||
        !data.success ||
        !Array.isArray(data.history)
      ){

        body.innerHTML = `
          <tr>
            <td colspan="4">
              ${escapeHtml(t("noHistory"))}
            </td>
          </tr>
        `;

        return;

      }


      if(data.history.length===0){

        body.innerHTML = `
          <tr>
            <td colspan="4">
              ${escapeHtml(t("noHistory"))}
            </td>
          </tr>
        `;

        return;

      }


      let html = "";


      data.history.forEach(function(row){

        html += `
          <tr>

            <td>
              ${escapeHtml(
                row.time || ""
              )}
            </td>

            <td>
              ${escapeHtml(
                row.employee || ""
              )}
            </td>

            <td>
              ${escapeHtml(
                row.barcode || ""
              )}
            </td>

            <td>
              ${escapeHtml(
                row.sku || ""
              )}
            </td>

          </tr>
        `;

      });


      body.innerHTML = html;

    };


  script.onerror =
    function(){

      if(finished)return;

      finished = true;

      cleanup();

      body.innerHTML = `
        <tr>
          <td colspan="4">
            ❌ ${escapeHtml(t("saveFail"))}
          </td>
        </tr>
      `;

    };


  script.src =
    API_URL +
    "?action=history" +
    "&callback=" +
    callback +
    "&_=" +
    Date.now();


  document.body.appendChild(script);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
