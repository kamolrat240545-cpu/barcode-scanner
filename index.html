<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ระบบสแกน Barcode / SKU</title>

  <!-- QR / Barcode Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f1f3f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        "Noto Sans Thai",
        sans-serif;
      color: #111;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin: 5px 0 20px;
    }

    h2 {
      font-size: 25px;
      margin: 0 0 18px;
    }

    label {
      display: block;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      height: 62px;
      border: 2px solid #d0d0d0;
      border-radius: 16px;
      padding: 0 18px;
      font-size: 20px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #1976d2;
    }

    .btn {
      width: 100%;
      min-height: 62px;
      border: 0;
      border-radius: 16px;
      margin-top: 12px;
      padding: 12px 15px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-blue {
      background: #1976d2;
      color: white;
    }

    .btn-green {
      background: #16a34a;
      color: white;
    }

    .btn-red {
      background: #dc2626;
      color: white;
    }

    .btn-gray {
      background: #6b7280;
      color: white;
    }

    .btn-orange {
      background: #f59e0b;
      color: white;
    }

    .scanner-box {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      background: #111;
      margin-top: 10px;
    }

    .scanner-box video {
      width: 100%;
    }

    .scanner-title {
      color: white;
      text-align: center;
      padding: 12px;
      font-size: 20px;
      background: #111;
    }

    .hidden {
      display: none !important;
    }

    .status {
      margin-top: 12px;
      border-radius: 16px;
      padding: 17px;
      font-size: 19px;
      font-weight: bold;
    }

    .status-success {
      background: #dcfce7;
      color: #166534;
    }

    .status-error {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-warning {
      background: #fef3c7;
      color: #92400e;
    }

    .status-info {
      background: #dbeafe;
      color: #1e40af;
    }

    .barcode-current {
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      border-radius: 16px;
      padding: 15px;
      margin-top: 12px;
      font-size: 20px;
    }

    .barcode-current strong {
      display: block;
      margin-bottom: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      table-layout: fixed;
    }

    th,
    td {
      border: 1px solid #d1d5db;
      padding: 10px 7px;
      text-align: center;
      font-size: 16px;
      word-break: break-word;
    }

    th {
      background: #eef2ff;
      font-weight: bold;
    }

    th:nth-child(1),
    td:nth-child(1) {
      width: 12%;
    }

    th:nth-child(2),
    td:nth-child(2) {
      width: 46%;
    }

    th:nth-child(3),
    td:nth-child(3) {
      width: 42%;
    }

    .sku-table th:nth-child(1),
    .sku-table td:nth-child(1) {
      width: 12%;
    }

    .sku-table th:nth-child(2),
    .sku-table td:nth-child(2) {
      width: 53%;
    }

    .sku-table th:nth-child(3),
    .sku-table td:nth-child(3) {
      width: 35%;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 10px 15px;
      font-size: 17px;
      font-weight: bold;
    }

    .loading {
      opacity: 0.65;
      pointer-events: none;
    }

    .small {
      font-size: 15px;
      color: #666;
      margin-top: 7px;
    }

    .center {
      text-align: center;
    }

    @media (max-width: 500px) {
      body {
        padding: 8px;
      }

      .card {
        padding: 15px;
        border-radius: 18px;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 23px;
      }

      label {
        font-size: 19px;
      }

      input,
      select {
        font-size: 18px;
        height: 58px;
      }

      .btn {
        font-size: 20px;
      }

      th,
      td {
        font-size: 14px;
        padding: 8px 5px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  </div>


  <!-- ================================================= -->
  <!-- BARCODE -->
  <!-- ================================================= -->

  <div class="card">

    <h2>📦 Barcode</h2>

    <div id="barcodeScannerArea" class="scanner-box hidden">
      <div class="scanner-title">
        📷 กำลังสแกน Barcode...

    <button

<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzdIRuze-6cCmtKanisxekt6a7yl0pALUQIh6Wttt7hXwlPSanocPxlVhpRaC6qnWpBvw/exec";


/* =====================================================
   VARIABLES
===================================================== */

let barcodeScanner = null;
let skuScanner = null;

let barcodeScanning = false;
let skuScanning = false;

let skus = [];

let barcodeCheckTimer = null;


/* =====================================================
   ELEMENTS
===================================================== */

const employeeEl =
  document.getElementById("employee");

const barcodeEl =
  document.getElementById("barcode");

const barcodeStatusEl =
  document.getElementById("barcodeStatus");

const skuInputEl =
  document.getElementById("skuInput");

const skuStatusEl =
  document.getElementById("skuStatus");

const saveStatusEl =
  document.getElementById("saveStatus");


/* =====================================================
   MESSAGE
===================================================== */

function showStatus(element, message, type) {

  element.className =
    "status status-" + type;

  element.textContent = message;

  element.classList.remove("hidden");
}


function hideStatus(element) {
  element.classList.add("hidden");
}


/* =====================================================
   BARCODE CAMERA
===================================================== */

async function openBarcodeScanner() {

  try {

    if (barcodeScanning) {
      return;
    }

    document
      .getElementById("barcodeScannerArea")
      .classList.remove("hidden");

    document
      .getElementById("openBarcodeBtn")
      .classList.add("hidden");

    document
      .getElementById("closeBarcodeBtn")
      .classList.remove("hidden");


    barcodeScanner =
      new Html5Qrcode("barcode-reader");

    barcodeScanning = true;


    await barcodeScanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,
        qrbox: {
          width: 280,
          height: 160
        }
      },

      function(decodedText) {

        if (!decodedText) {
          return;
        }

        barcodeEl.value =
          decodedText.trim();

        checkBarcodeImmediately(
          decodedText.trim()
        );

      },

      function(errorMessage) {
        // ไม่ต้องแสดง error ระหว่างกล้องกำลังหา barcode
      }

    );

  } catch (error) {

    showStatus(
      barcodeStatusEl,
      "❌ เปิดกล้อง Barcode ไม่สำเร็จ: " +
      error.message,
      "error"
    );

    closeBarcodeScanner();
  }
}


async function closeBarcodeScanner() {

  try {

    if (
      barcodeScanner &&
      barcodeScanning
    ) {

      await barcodeScanner.stop();
      await barcodeScanner.clear();

    }

  } catch (e) {}

  barcodeScanner = null;
  barcodeScanning = false;

  document
    .getElementById("barcodeScannerArea")
    .classList.add("hidden");

  document
    .getElementById("openBarcodeBtn")
    .classList.remove("hidden");

  document
    .getElementById("closeBarcodeBtn")
    .classList.add("hidden");
}


/* =====================================================
   SKU CAMERA
===================================================== */

async function openSkuScanner() {

  try {

    if (skuScanning) {
      return;
    }

    document
      .getElementById("skuScannerArea")
      .classList.remove("hidden");

    document
      .getElementById("openSkuBtn")
      .classList.add("hidden");

    document
      .getElementById("closeSkuBtn")
      .classList.remove("hidden");


    skuScanner =
      new Html5Qrcode("sku-reader");

    skuScanning = true;


    await skuScanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,
        qrbox: {
          width: 280,
          height: 160
        }
      },

      function(decodedText) {

        if (!decodedText) {
          return;
        }

        skuInputEl.value =
          decodedText.trim();

        closeSkuScanner();

        addSku();

      },

      function(errorMessage) {
        // ไม่แสดง error ระหว่างค้นหา
      }

    );

  } catch (error) {

    showStatus(
      skuStatusEl,
      "❌ เปิดกล้อง SKU ไม่สำเร็จ: " +
      error.message,
      "error"
    );

    closeSkuScanner();
  }
}


async function closeSkuScanner() {

  try {

    if (
      skuScanner &&
      skuScanning
    ) {

      await skuScanner.stop();
      await skuScanner.clear();

    }

  } catch (e) {}

  skuScanner = null;
  skuScanning = false;

  document
    .getElementById("skuScannerArea")
    .classList.add("hidden");

  document
    .getElementById("openSkuBtn")
    .classList.remove("hidden");

  document
    .getElementById("closeSkuBtn")
    .classList.add("hidden");
}


/* =====================================================
   BARCODE CHECK
===================================================== */

function checkBarcodeButton() {

  const barcode =
    barcodeEl.value.trim();

  if (!barcode) {

    showStatus(
      barcodeStatusEl,
      "❌ กรุณาสแกนหรือกรอก Barcode",
      "error"
    );

    return;
  }

  checkBarcodeImmediately(barcode);
}


function checkBarcodeImmediately(barcode) {

  barcode = String(barcode || "").trim();

  if (!barcode) {
    return;
  }


  clearTimeout(barcodeCheckTimer);


  barcodeCheckTimer =
    setTimeout(function() {

      checkBarcodeJSONP(barcode);

    }, 250);
}


/* =====================================================
   JSONP CHECK
   ป้องกันปัญหา CORS
===================================================== */

function checkBarcodeJSONP(barcode) {

  showStatus(
    barcodeStatusEl,
    "🔍 กำลังตรวจสอบ Barcode...",
    "info"
  );


  const callbackName =
    "barcodeCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);


  const script =
    document.createElement("script");


  const timeout =
    setTimeout(function() {

      cleanup();

      showStatus(
        barcodeStatusEl,
        "❌ ตรวจสอบ Barcode ไม่สำเร็จ: ระบบไม่ตอบกลับ",
        "error"
      );

    }, 15000);


  window[callbackName] =
    function(data) {

      clearTimeout(timeout);

      cleanup();


      if (!data) {

        showStatus(
          barcodeStatusEl,
          "❌ ระบบไม่ส่งข้อมูลกลับมา",
          "error"
        );

        return;
      }


      if (data.duplicate === true) {

        // ============================================
        // สำคัญ: แจ้งซ้ำทันที
        // ============================================

        showStatus(
          barcodeStatusEl,
          "⚠️ Barcode ซ้ำ!\n" +
          barcode,
          "warning"
        );


        // ล้าง Barcode ที่ซ้ำ
        barcodeEl.value = "";


        // ไม่ให้เพิ่ม SKU
        skus = [];
        renderSkuTable();

        return;
      }


      if (
        data.success === true &&
        data.duplicate === false
      ) {

        showStatus(
          barcodeStatusEl,
          "✅ Barcode สามารถใช้ได้",
          "success"
        );

        return;
      }


      showStatus(
        barcodeStatusEl,
        "❌ ตรวจสอบ Barcode ไม่สำเร็จ",
        "error"
      );

    };


  script.onerror =
    function() {

      clearTimeout(timeout);

      cleanup();

      showStatus(
        barcodeStatusEl,
        "❌ เชื่อมต่อระบบตรวจสอบ Barcode ไม่สำเร็จ",
        "error"
      );
    };


  script.src =
    API_URL +
    "?action=checkBarcode" +
    "&barcode=" +
    encodeURIComponent(barcode) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  document.body.appendChild(script);


  function cleanup() {

    try {
      script.remove();
    } catch (e) {}

    try {
      delete window[callbackName];
    } catch (e) {}

  }

}


/* =====================================================
   BARCODE INPUT
   ตรวจทันทีเมื่อพิมพ์ / scanner ยิงเข้า
===================================================== */

barcodeEl.addEventListener(
  "change",
  function() {

    const value =
      barcodeEl.value.trim();

    if (value) {
      checkBarcodeImmediately(value);
    }

  }
);


barcodeEl.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      const value =
        barcodeEl.value.trim();

      if (value) {
        checkBarcodeImmediately(value);
      }

    }

  }
);


/* =====================================================
   ADD SKU
===================================================== */

function addSku() {

  const barcode =
    barcodeEl.value.trim();

  const sku =
    skuInputEl.value.trim();


  if (!barcode) {

    showStatus(
      skuStatusEl,
      "❌ กรุณาสแกน Barcode ก่อน",
      "error"
    );

    return;
  }


  if (!sku) {

    showStatus(
      skuStatusEl,
      "❌ กรุณากรอกหรือสแกน SKU",
      "error"
    );

    return;
  }


  // ================================================
  // ตรวจ SKU ซ้ำในรายการปัจจุบัน
  // ================================================

  const exists =
    skus.some(function(item) {

      return item.toUpperCase() ===
             sku.toUpperCase();

    });


  if (exists) {

    showStatus(
      skuStatusEl,
      "⚠️ SKU นี้มีอยู่ในรายการแล้ว",
      "warning"
    );

    skuInputEl.value = "";

    return;
  }


  skus.push(sku);

  skuInputEl.value = "";

  renderSkuTable();


  showStatus(
    skuStatusEl,
    "✅ เพิ่ม SKU สำเร็จ",
    "success"
  );

}


/* =====================================================
   SKU TABLE
===================================================== */

function renderSkuTable() {

  const tbody =
    document.getElementById(
      "skuTableBody"
    );

  const count =
    document.getElementById(
      "skuCount"
    );


  count.textContent =
    skus.length;


  if (skus.length === 0) {

    tbody.innerHTML = `
      <tr>
        <td colspan="3">
          ยังไม่มีรายการ SKU
        </td>
      </tr>
    `;

    return;
  }


  tbody.innerHTML = "";


  skus.forEach(
    function(sku, index) {

      const tr =
        document.createElement("tr");


      const td1 =
        document.createElement("td");

      td1.textContent =
        index + 1;


      const td2 =
        document.createElement("td");

      td2.textContent =
        sku;


      const td3 =
        document.createElement("td");


      const btn =
        document.createElement("button");

      btn.className =
        "delete-btn";

      btn.textContent =
        "ลบ";

      btn.onclick =
        function() {

          removeSku(index);

        };


      td3.appendChild(btn);


      tr.appendChild(td1);
      tr.appendChild(td2);
      tr.appendChild(td3);


      tbody.appendChild(tr);

    }
  );

}


/* =====================================================
   REMOVE SKU
===================================================== */

function removeSku(index) {

  if (
    index < 0 ||
    index >= skus.length
  ) {
    return;
  }

  skus.splice(index, 1);

  renderSkuTable();


  showStatus(
    skuStatusEl,
    "🗑️ ลบ SKU แล้ว",
    "info"
  );
}


/* =====================================================
   SAVE
===================================================== */

function saveData() {

  const employee =
    employeeEl.value.trim();

  const barcode =
    barcodeEl.value.trim();


  if (!employee) {

    showStatus(
      saveStatusEl,
      "❌ กรุณาเลือกชื่อพนักงาน",
      "error"
    );

    return;
  }


  if (!barcode) {

    showStatus(
      saveStatusEl,
      "❌ กรุณาสแกน Barcode",
      "error"
    );

    return;
  }


  if (skus.length === 0) {

    showStatus(
      saveStatusEl,
      "❌ กรุณาเพิ่ม SKU อย่างน้อย 1 รายการ",
      "error"
    );

    return;
  }


  const saveBtn =
    document.getElementById("saveBtn");


  saveBtn.classList.add("loading");

  saveBtn.textContent =
    "⏳ กำลังบันทึก...";


  // ================================================
  // ตรวจซ้ำอีกครั้งก่อนบันทึก
  // ================================================

  checkBeforeSave(
    employee,
    barcode,
    function(canSave) {

      if (!canSave) {

        saveBtn.classList.remove(
          "loading"
        );

        saveBtn.textContent =
          "💾 บันทึกข้อมูลลง Google Sheets";

        return;
      }


      const payload = {

        employee: employee,

        barcode: barcode,

        skus: skus.slice()

      };


      submitSaveForm(
        payload,
        function() {

          saveBtn.classList.remove(
            "loading"
          );

          saveBtn.textContent =
            "💾 บันทึกข้อมูลลง Google Sheets";


          showStatus(
            saveStatusEl,
            "✅ บันทึกข้อมูลเรียบร้อยแล้ว",
            "success"
          );


          // โหลดประวัติใหม่
          setTimeout(
            loadHistory,
            800
          );


          // เตรียม Barcode ใหม่
          barcodeEl.value = "";

          skus = [];

          renderSkuTable();

          hideStatus(
            barcodeStatusEl
          );

          hideStatus(
            skuStatusEl
          );

        }
      );

    }
  );

}


/* =====================================================
   CHECK BEFORE SAVE
===================================================== */

function checkBeforeSave(
  employee,
  barcode,
  callback
) {

  const callbackName =
    "saveCheckCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement("script");


  let finished = false;


  const timeout =
    setTimeout(function() {

      if (finished) {
        return;
      }

      finished = true;

      cleanup();


      showStatus(
        saveStatusEl,
        "❌ ตรวจสอบ Barcode ก่อนบันทึกไม่สำเร็จ",
        "error"
      );

      callback(false);

    }, 15000);


  window[callbackName] =
    function(data) {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timeout);

      cleanup();


      if (
        data &&
        data.success === true &&
        data.duplicate === true
      ) {

        showStatus(
          saveStatusEl,
          "⚠️ Barcode ซ้ำ! ไม่สามารถบันทึกได้\n" +
          barcode,
          "warning"
        );

        barcodeEl.value = "";

        skus = [];

        renderSkuTable();

        callback(false);

        return;
      }


      if (
        data &&
        data.success === true &&
        data.duplicate === false
      ) {

        callback(true);

        return;
      }


      showStatus(
        saveStatusEl,
        "❌ ไม่สามารถตรวจสอบ Barcode ได้",
        "error"
      );

      callback(false);

    };


  script.onerror =
    function() {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timeout);

      cleanup();


      showStatus(
        saveStatusEl,
        "❌ เชื่อมต่อระบบไม่ได้",
        "error"
      );

      callback(false);

    };


  script.src =
    API_URL +
    "?action=checkBarcode" +
    "&barcode=" +
    encodeURIComponent(barcode) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  document.body.appendChild(script);


  function cleanup() {

    try {
      script.remove();
    } catch (e) {}

    try {
      delete window[callbackName];
    } catch (e) {}

  }

}


/* =====================================================
   SUBMIT SAVE FORM
   ใช้ hidden iframe
   ไม่ติดปัญหา CORS
===================================================== */

function submitSaveForm(
  payload,
  onDone
) {

  const iframeName =
    "saveFrame_" +
    Date.now();


  const iframe =
    document.createElement("iframe");

  iframe.name =
    iframeName;

  iframe.style.display =
    "none";


  document.body.appendChild(
    iframe
  );


  const form =
    document.createElement("form");

  form.method =
    "POST";

  form.action =
    API_URL;

  form.target =
    iframeName;

  form.style.display =
    "none";


  const input =
    document.createElement("input");

  input.type =
    "hidden";

  input.name =
    "payload";

  input.value =
    JSON.stringify(payload);


  form.appendChild(input);

  document.body.appendChild(form);


  form.submit();


  /*
    Google Apps Script รับ POST แล้ว
    เราไม่อ่าน response จาก iframe
    เพราะไม่จำเป็นและจะติด CORS

    รอเล็กน้อยแล้วแสดงว่าส่งข้อมูลแล้ว
  */

  setTimeout(
    function() {

      try {
        form.remove();
      } catch (e) {}

      try {
        iframe.remove();
      } catch (e) {}

      onDone();

    },
    1500
  );

}


/* =====================================================
   LOAD HISTORY
===================================================== */

function loadHistory() {

  const callbackName =
    "historyCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement("script");


  const timeout =
    setTimeout(
      function() {

        cleanup();

        showHistoryError(
          "ไม่สามารถโหลดประวัติได้"
        );

      },
      15000
    );


  window[callbackName] =
    function(data) {

      clearTimeout(timeout);

      cleanup();


      if (
        !data ||
        data.success !== true
      ) {

        showHistoryError(
          "ไม่สามารถโหลดประวัติได้"
        );

        return;
      }


      renderHistory(
        data.history || []
      );

    };


  script.onerror =
    function() {

      clearTimeout(timeout);

      cleanup();

      showHistoryError(
        "เชื่อมต่อระบบไม่ได้"
      );

    };


  script.src =
    API_URL +
    "?action=history" +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  document.body.appendChild(
    script
  );


  function cleanup() {

    try {
      script.remove();
    } catch (e) {}

    try {
      delete window[callbackName];
    } catch (e) {}

  }

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(history) {

  const tbody =
    document.getElementById(
      "historyTableBody"
    );


  if (
    !Array.isArray(history) ||
    history.length === 0
  ) {

    tbody.innerHTML = `
      <tr>
        <td colspan="4">
          ยังไม่มีประวัติ
        </td>
      </tr>
    `;

    return;
  }


  tbody.innerHTML = "";


  history.forEach(
    function(item) {

      const tr =
        document.createElement("tr");


      const tdTime =
        document.createElement("td");

      tdTime.textContent =
        formatDateTime(
          item.time
        );


      const tdEmployee =
        document.createElement("td");

      tdEmployee.textContent =
        item.employee || "";


      const tdBarcode =
        document.createElement("td");

      tdBarcode.textContent =
        item.barcode || "";


      const tdSku =
        document.createElement("td");

      tdSku.textContent =
        item.sku || "";


      tr.appendChild(tdTime);
      tr.appendChild(tdEmployee);
      tr.appendChild(tdBarcode);
      tr.appendChild(tdSku);


      tbody.appendChild(tr);

    }
  );

}


/* =====================================================
   DATE TIME
   ไม่ตัดเวลาออก
===================================================== */

function formatDateTime(value) {

  if (!value) {
    return "";
  }


  let text =
    String(value).trim();


  /*
    Google Sheets บางกรณีอาจส่งมาเป็น

    28/8/2026
    หรือ
    28/8/2026, 10:07:10

    เราไม่ตัดส่วนเวลาออก
  */


  return text;
}


/* =====================================================
   HISTORY ERROR
===================================================== */

function showHistoryError(message) {

  const tbody =
    document.getElementById(
      "historyTableBody"
    );


  tbody.innerHTML = `
    <tr>
      <td colspan="4">
        ❌ ${escapeHtml(message)}
      </td>
    </tr>
  `;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;
}


/* =====================================================
   CLEAR ALL
===================================================== */

async function clearAll() {

  const confirmed =
    confirm(
      "ต้องการล้าง Barcode และรายการ SKU ใช่หรือไม่?"
    );


  if (!confirmed) {
    return;
  }


  await closeBarcodeScanner();
  await closeSkuScanner();


  barcodeEl.value = "";

  skuInputEl.value = "";

  skus = [];

  renderSkuTable();


  hideStatus(
    barcodeStatusEl
  );

  hideStatus(
    skuStatusEl
  );

  hideStatus(
    saveStatusEl
  );

}


/* =====================================================
   AUTO LOAD HISTORY
===================================================== */

window.addEventListener(
  "load",
  function() {

    loadHistory();

  }
);


/* =====================================================
   ENTER KEY FOR SKU
===================================================== */

skuInputEl.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      addSku();

    }

  }
);

</script>
