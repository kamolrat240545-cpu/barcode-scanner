<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;

}

.container {

}

.card {

select,
input {

}

.btn-blue {

}

.btn-green {

  color: white;
}

.btn-red {

}

.btn-gray {
  background: #737b89;
  color: white;
}

.btn-orange {
  background: #f59e0b;
  color: white;
}

.message {
  padding: 18px;
  border-radius: 16px;
  margin-top: 14px;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.5;
}

.message.success {
  background: #dcfce7;
  color: #166534;
}

.message.error {
  background: #fee2e2;
  color: #991b1b;
}

.message.warning {
  background: #fef3c7;
  color: #92400e;
}

.message.info {

  color: #1e40af;
}

.hidden {
  display: none !important;
}


/* =====================================================
   SCANNER
   ===================================================== */

.scanner-wrapper {
  width: 100%;
  background: #111;
  border-radius: 20px;
  overflow: hidden;
  min-height: 300px;
}

#barcode-reader,
#sku-reader {
  width: 100%;
}

#barcode-reader video,
#sku-reader video {
  width: 100% !important;
  height: auto !important;
  border-radius: 18px;
}

.scanner-placeholder {
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  font-size: 25px;
  padding: 30px;
  background: #111;
}

.scan-status {
  margin-top: 12px;
  padding: 14px;
  border-radius: 14px;
  background: #eef2ff;
  color: #3730a3;
  font-size: 18px;
  font-weight: 600;
}


/* =====================================================
   SKU TABLE
   ===================================================== */

.table-wrapper {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th {

  font-size: 18px;

td {

.delete-btn {

/* =====================================================

   ===================================================== */

.history-table th {

  top: 0;
}

.history-table td {
  vertical-align: middle;
}

.empty {
  text-align: center;
  padding: 25px;

}


/* =====================================================

   ===================================================== */

.loading {

    font-size: 15px;
  }

}

</style>

</div>

<script>

/* =====================================================
   CONFIG
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzdIRuze-6cCmtKanisxekt6a7yl0pALUQIh6Wttt7hXwlPSanocPxlVhpRaC6qnWpBvw/exec";


/* =====================================================
   EMPLOYEES 41 คน
   ===================================================== */

const employees = [

  ["นาย สหภาพ ทรัพย์บำเรอ", "เจ๋ง"],
  ["นาย รวีวัฒธ์ สีเสน", "โฟกัส"],
  ["นาย บัญชา ศุภศร", "ออย"],
  ["นาย ธีรพัฒน์ ขวานทอง", "ตี๋"],
  ["นาย ธวัชชัย นุกิจ", "อาร์ม"],
  ["นาง มัลลิกา เทียงดาห์", "พี่เปิ้น"],
  ["น.ส.ประกายดาว ประทังเจริญ", "เนส"],
  ["น.ส.กัลยา มูลพุ่มสาย", "พี่พลอย"],
  ["ZinMin htet", "ซินนิแถะ"],
  ["WIN THU RAIN", "พี่วิน"],
  ["WAI PHYO", "แวะพิว"],
  ["THIHA MIN WAI", "ตีห้า"],
  ["THANT ZIN OO", "ต้าซินอู้"],
  ["THANT ZIN AUNG", "ต้าซิงออง"],
  ["SI POE", "เซโป"],
  ["SAW WAH DO MOO", "ซอวัดตูมโม"],
  ["SAW SI BLU HSEL", "ซอ"],
  ["SAW SAY", "ซอเซ"],
  ["Saw Poe Chit", "ชิ"],
  ["SAW PATHI HTOO", "โพดา"],
  ["SAW JOE", "ซูจู"],
  ["SAW GAY DO HTOO", "ซอเค"],
  ["SAW ER KEN LAH", "ซอเอ"],
  ["SAN LIN", "ซาเลน"],
  ["PYAE PHYO HAN", "บี้พิวหา"],
  ["Pyae Phyo", "ปิพิว"],
  ["PAING PAING SOE", "ไปไปซู"],
  ["NJAING MTO KO", "ใน"],
  ["Myint Myat oo", "เมี๊ยะ"],
  ["MYAT MIN KO", "เมี๊ยะเมียกุ"],
  ["MOE KYAW KYAW", "โกโม"],
  ["MOE HTET KYAW", "โมทาจอง"],
  ["MG AYE LIN", "เอเลน"],
  ["KYAW TUN LIN", "จอ"],
  ["KYAW NAING TUN", "จอไนทู"],
  ["HTOO HTOO", "ทูทู"],
  ["EH SOE", "เอปโซ่"],
  ["EH POE", "เอปโพ่"],
  ["CHO CHO LWIN", "พี่เอ"],
  ["AUNG PAING SOE", "อองปัยซุ่"],
  ["หม่อโอมิ", "หม่อ"]

];


/* =====================================================
   STATE
   ===================================================== */

let barcodeScanner = null;
let skuScanner = null;

let barcodeScanning = false;
let skuScanning = false;

let barcodeLocked = false;
let skuLocked = false;

let barcodeValue = "";

let skuList = [];


/* =====================================================
   LOAD EMPLOYEES
   ===================================================== */

function loadEmployees() {

  const select =
    document.getElementById("employee");

  employees.forEach(function(item) {

    const option =
      document.createElement("option");

    option.value = item[0];

    option.textContent =
      item[0] + "  |  " + item[1];

    select.appendChild(option);

  });

}


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(
  id,
  text,
  type
) {

  const el =
    document.getElementById(id);

  el.textContent = text;

  el.className =
    "message " + type;

  el.classList.remove("hidden");
}


function hideMessage(id) {

  const el =
    document.getElementById(id);

  el.classList.add("hidden");

}


/* =====================================================
   BARCODE SCANNER
   ===================================================== */

async function startBarcodeScanner() {

  if (barcodeLocked) {

    showMessage(
      "barcodeMessage",
      "⚠️ Barcode ถูกล็อกไว้แล้ว กรุณากดล้างข้อมูลก่อนสแกนใหม่",
      "warning"
    );

    return;
  }


  try {

    await stopBarcodeScanner();


    document
      .getElementById("barcode-placeholder")
      .classList.add("hidden");

    document
      .getElementById("barcode-reader")
      .classList.remove("hidden");

    document
      .getElementById("barcodeStartBtn")
      .classList.add("hidden");

    document
      .getElementById("barcodeStopBtn")
      .classList.remove("hidden");


    barcodeScanner =
      new Html5Qrcode("barcode-reader");


    barcodeScanning = true;


    showMessage(
      "barcodeMessage",
      "📷 กำลังค้นหา Barcode...",
      "info"
    );


    await barcodeScanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const minEdge =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            );

          const width =
            Math.floor(minEdge * 0.80);

          const height =
            Math.floor(minEdge * 0.35);

          return {
            width: width,
            height: height
          };

        },

        aspectRatio: 1.777
      },

      function(decodedText) {

        /*
         * สำคัญ:
         * เมื่ออ่านได้ครั้งแรก
         * ให้ล็อกทันที
         * เพื่อไม่ให้เลื่อนกล้องแล้วอ่านตัวอื่น
         */

        if (barcodeLocked) {
          return;
        }

        barcodeLocked = true;

        barcodeValue =
          String(decodedText).trim();

        document
          .getElementById("barcodeInput")
          .value = barcodeValue;


        // หยุดกล้องทันที
        stopBarcodeScanner();


        // ตรวจซ้ำ
        checkBarcode();

      },

      function(errorMessage) {

        // ไม่ต้องแสดง error ทุก frame
        // เพราะ scanner จะ error ตลอดเวลาที่หา barcode ไม่เจอ

      }

    );

  } catch (error) {

    barcodeScanning = false;
    barcodeLocked = false;

    document
      .getElementById("barcode-placeholder")
      .classList.remove("hidden");

    document
      .getElementById("barcode-reader")
      .classList.add("hidden");

    document
      .getElementById("barcodeStartBtn")
      .classList.remove("hidden");

    document
      .getElementById("barcodeStopBtn")
      .classList.add("hidden");


    showMessage(
      "barcodeMessage",
      "❌ เปิดกล้องไม่ได้: " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   STOP BARCODE
   ===================================================== */

async function stopBarcodeScanner() {

  barcodeScanning = false;

  if (barcodeScanner) {

    try {

      await barcodeScanner.stop();

    } catch (e) {}

    try {

      barcodeScanner.clear();

    } catch (e) {}

    barcodeScanner = null;
  }


  document
    .getElementById("barcode-reader")
    .classList.add("hidden");

  document
    .getElementById("barcode-placeholder")
    .classList.remove("hidden");

  document
    .getElementById("barcodeStartBtn")
    .classList.remove("hidden");

  document
    .getElementById("barcodeStopBtn")
    .classList.add("hidden");
}


/* =====================================================
   CHECK BARCODE
   ===================================================== */

async function checkBarcode() {

  const barcode =
    document
      .getElementById("barcodeInput")
      .value
      .trim();


  if (!barcode) {

    showMessage(
      "barcodeMessage",
      "❌ กรุณาสแกนหรือกรอก Barcode",
      "error"
    );

    return;
  }


  showMessage(
    "barcodeMessage",
    "🔍 กำลังตรวจสอบ Barcode...",
    "info"
  );


  try {

    const url =
      API_URL +
      "?action=checkBarcode" +
      "&barcode=" +
      encodeURIComponent(barcode);


    const response =
      await fetch(url);


    const data =
      await response.json();


    if (!data.success) {

      barcodeLocked = false;

      showMessage(
        "barcodeMessage",
        "❌ ตรวจสอบ Barcode ไม่สำเร็จ: " +
        (data.message || "ไม่ทราบสาเหตุ"),
        "error"
      );

      return;
    }


    if (data.duplicate === true) {

      /*
       * Barcode ซ้ำ
       */

      showMessage(
        "barcodeMessage",
        "⚠️ Barcode ซ้ำ! " + barcode,
        "warning"
      );

      /*
       * ซ้ำแล้วไม่ให้ไปต่อ
       */
      barcodeLocked = true;

      return;
    }


    /*
     * Barcode ไม่ซ้ำ
     */

    showMessage(
      "barcodeMessage",
      "✅ Barcode สามารถใช้ได้",
      "success"
    );

    barcodeLocked = true;


  } catch (error) {

    barcodeLocked = false;

    showMessage(
      "barcodeMessage",
      "❌ ตรวจสอบ Barcode ไม่สำเร็จ: " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   SKU SCANNER
   ===================================================== */

async function startSkuScanner() {

  if (skuLocked) {

    showMessage(
      "skuMessage",
      "⚠️ กรุณาปิดกล้อง SKU ก่อนเริ่มสแกนใหม่",
      "warning"
    );

    return;
  }


  try {

    await stopSkuScanner();


    document
      .getElementById("sku-placeholder")
      .classList.add("hidden");

    document
      .getElementById("sku-reader")
      .classList.remove("hidden");

    document
      .getElementById("skuStartBtn")
      .classList.add("hidden");

    document
      .getElementById("skuStopBtn")
      .classList.remove("hidden");


    skuScanner =
      new Html5Qrcode("sku-reader");


    skuScanning = true;


    showMessage(
      "skuMessage",
      "📷 กำลังค้นหา SKU...",
      "info"
    );


    await skuScanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const minEdge =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            );

          return {
            width:
              Math.floor(minEdge * 0.75),

            height:
              Math.floor(minEdge * 0.40)
          };

        },

        aspectRatio: 1.777
      },

      function(decodedText) {

        /*
         * อ่าน SKU แค่ครั้งเดียว
         */

        if (skuLocked) {
          return;
        }

        skuLocked = true;

        const sku =
          String(decodedText).trim();

        document
          .getElementById("skuInput")
          .value = sku;


        // หยุดกล้องทันที
        stopSkuScanner();


        // เพิ่ม SKU
        addSku();

      },

      function(errorMessage) {

        // ไม่ต้องแสดง error ทุก frame

      }

    );

  } catch (error) {

    skuScanning = false;
    skuLocked = false;

    document
      .getElementById("sku-placeholder")
      .classList.remove("hidden");

    document
      .getElementById("sku-reader")
      .classList.add("hidden");

    document
      .getElementById("skuStartBtn")
      .classList.remove("hidden");

    document
      .getElementById("skuStopBtn")
      .classList.add("hidden");


    showMessage(
      "skuMessage",
      "❌ เปิดกล้อง SKU ไม่ได้: " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   STOP SKU
   ===================================================== */

async function stopSkuScanner() {

  skuScanning = false;

  if (skuScanner) {

    try {

      await skuScanner.stop();

    } catch (e) {}

    try {

      skuScanner.clear();

    } catch (e) {}

    skuScanner = null;

  }


  document
    .getElementById("sku-reader")
    .classList.add("hidden");

  document
    .getElementById("sku-placeholder")
    .classList.remove("hidden");

  document
    .getElementById("skuStartBtn")
    .classList.remove("hidden");

  document
    .getElementById("skuStopBtn")
    .classList.add("hidden");

}


/* =====================================================
   ADD SKU
   ===================================================== */

function addSku() {

  const input =
    document.getElementById("skuInput");

  const sku =
    input.value.trim();


  if (!sku) {

    showMessage(
      "skuMessage",
      "❌ กรุณากรอกหรือสแกน SKU",
      "error"
    );

    return;
  }


  /*
   * ป้องกัน SKU ซ้ำในรายการเดียวกัน
   */

  const exists =
    skuList.some(function(item) {

      return item.toUpperCase() ===
             sku.toUpperCase();

    });


  if (exists) {

    showMessage(
      "skuMessage",
      "⚠️ SKU นี้มีอยู่ในรายการแล้ว",
      "warning"
    );

    input.value = "";

    skuLocked = false;

    return;
  }


  skuList.push(sku);

  input.value = "";

  skuLocked = false;

  hideMessage("skuMessage");

  renderSkuTable();

}


/* =====================================================
   RENDER SKU
   ===================================================== */

function renderSkuTable() {

  const body =
    document.getElementById("skuTableBody");


  body.innerHTML = "";


  if (skuList.length === 0) {

    body.innerHTML = `
      <tr>
        <td colspan="3" class="empty">
          ยังไม่มีรายการ SKU
        </td>
      </tr>
    `;

    return;
  }


  skuList.forEach(function(sku, index) {

    const tr =
      document.createElement("tr");


    tr.innerHTML = `

      <td>
        ${index + 1}
      </td>

      <td>
        ${escapeHtml(sku)}
      </td>

      <td>

        <button
          class="delete-btn"
          onclick="removeSku(${index})">

          🗑️ ลบ

        </button>

      </td>

    `;


    body.appendChild(tr);

  });

}


/* =====================================================
   REMOVE SKU
   ===================================================== */

function removeSku(index) {

  skuList.splice(index, 1);

  renderSkuTable();

}


/* =====================================================
   SAVE DATA
   ===================================================== */

async function saveData() {

  const employee =
    document
      .getElementById("employee")
      .value
      .trim();


  const barcode =
    document
      .getElementById("barcodeInput")
      .value
      .trim();


  if (!employee) {

    showMessage(
      "saveMessage",
      "❌ กรุณาเลือกชื่อพนักงาน",
      "error"
    );

    return;
  }


  if (!barcode) {

    showMessage(
      "saveMessage",
      "❌ กรุณาสแกน Barcode ก่อน",
      "error"
    );

    return;
  }


  if (!barcodeLocked) {

    showMessage(
      "saveMessage",
      "❌ กรุณาตรวจสอบ Barcode ก่อน",
      "error"
    );

    return;
  }


  if (skuList.length === 0) {

    showMessage(
      "saveMessage",
      "❌ กรุณาเพิ่ม SKU อย่างน้อย 1 รายการ",
      "error"
    );

    return;
  }


  /*
   * ตรวจซ้ำก่อนบันทึกอีกครั้ง
   */

  const saveBtn =
    document.getElementById("saveBtn");

  saveBtn.disabled = true;

  saveBtn.textContent =
    "⏳ กำลังบันทึก...";


  showMessage(
    "saveMessage",
    "⏳ กำลังบันทึกข้อมูลลง Google Sheets...",
    "info"
  );


  try {

    const payload = {

      employee: employee,

      barcode: barcode,

      skus: skuList

    };


    /*
     * ใช้ fetch POST
     */

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(payload)
        }
      );


    const data =
      await response.json();


    if (!data.success) {

      if (data.duplicate === true) {

        showMessage(
          "saveMessage",
          "⚠️ Barcode ซ้ำ! ไม่สามารถบันทึกได้",
          "warning"
        );

      } else {

        showMessage(
          "saveMessage",
          "❌ บันทึกไม่สำเร็จ: " +
          (data.message || ""),
          "error"
        );

      }

      return;
    }


    showMessage(
      "saveMessage",
      "✅ บันทึกข้อมูลเรียบร้อยแล้ว",
      "success"
    );


    /*
     * โหลดประวัติใหม่
     */

    loadHistory();


  } catch (error) {

    showMessage(
      "saveMessage",
      "❌ เกิดข้อผิดพลาด: " +
      error.message,
      "error"
    );

  } finally {

    saveBtn.disabled = false;

    saveBtn.textContent =
      "💾 บันทึกข้อมูลลง Google Sheets";

  }

}


/* =====================================================
   CLEAR FORM
   ===================================================== */

async function clearForm() {

  await stopBarcodeScanner();

  await stopSkuScanner();


  document
    .getElementById("employee")
    .value = "";


  document
    .getElementById("barcodeInput")
    .value = "";


  document
    .getElementById("skuInput")
    .value = "";


  barcodeValue = "";

  barcodeLocked = false;

  skuLocked = false;

  skuList = [];


  hideMessage("barcodeMessage");
  hideMessage("skuMessage");
  hideMessage("saveMessage");


  renderSkuTable();

}


/* =====================================================
   LOAD HISTORY
   ===================================================== */

async function loadHistory() {

  const loading =
    document.getElementById(
      "historyLoading"
    );

  loading.classList.remove("hidden");


  try {

    const url =
      API_URL +
      "?action=history";


    const response =
      await fetch(url);


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        "โหลดประวัติไม่สำเร็จ"
      );

    }


    renderHistory(
      data.history || []
    );


  } catch (error) {

    document.getElementById(
      "historyBody"
    ).innerHTML = `

      <tr>
        <td colspan="4"
            class="empty">

          ❌ โหลดประวัติไม่สำเร็จ

        </td>
      </tr>

    `;

  } finally {

    loading.classList.add("hidden");

  }

}


/* =====================================================
   RENDER HISTORY
   ===================================================== */

function renderHistory(history) {

  const body =
    document.getElementById(
      "historyBody"
    );


  body.innerHTML = "";


  if (!history ||
      history.length === 0) {

    body.innerHTML = `

      <tr>
        <td colspan="4"
            class="empty">

          ยังไม่มีประวัติ

        </td>
      </tr>

    `;

    return;
  }


  history.forEach(function(item) {

    const tr =
      document.createElement("tr");


    /*
     * เวลา:
     * ถ้า Google Sheets ส่งมาทั้งวันและเวลา
     * ให้แสดงตามนั้น
     */

    let time =
      item.time || "-";


    /*
     * พนักงาน
     */

    let employee =
      item.employee || "-";


    /*
     * Barcode
     */

    let barcode =
      item.barcode || "-";


    /*
     * SKU
     */

    let sku =
      item.sku || "-";


    tr.innerHTML = `

      <td>
        ${escapeHtml(time)}
      </td>

      <td>
        ${escapeHtml(employee)}
      </td>

      <td>
        ${escapeHtml(barcode)}
      </td>

      <td>
        ${escapeHtml(sku)}
      </td>

    `;


    body.appendChild(tr);

  });

}


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   INIT
   ===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadEmployees();

    loadHistory();

  }
);

   ENTER KEY
   ===================================================== */

document
  .getElementById("barcodeInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        checkBarcode();

      }

    }
  );


document
  .getElementById("skuInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        addSku();

      }

    }
  );


</script>
