/* =====================================================
   BARCODE SCANNER
===================================================== */

async function startBarcodeScanner(){

  if(barcodeScanning){

    return;

  }

  barcodeProcessing =
    false;


  document
    .getElementById(
      "barcode-camera-area"
    )
    .classList
    .remove("hidden");


  document
    .getElementById(
      "openBarcodeBtn"
    )
    .classList
    .add("hidden");


  try{

    barcodeScanner =
      new Html5Qrcode(
        "barcode-reader"
      );


    barcodeScanning =
      true;


    await barcodeScanner.start(

      {
        facingMode:
          "environment"
      },

      {

        fps:15,

        qrbox:function(
          width,
          height
        ){

          return{

            width:
              Math.floor(
                width * .9
              ),

            height:
              Math.floor(
                Math.min(
                  height * .5,
                  300
                )
              )

          };

        },

        formatsToSupport:
          SKU_FORMATS

      },

      function(decodedText){

        handleBarcodeScan(
          decodedText
        );

      },

      function(errorMessage){

      }

    );

  }catch(error){

    barcodeScanning =
      false;

    barcodeProcessing =
      false;

    if(barcodeScanner){

      try{

        await barcodeScanner.clear();

      }catch(e){}

      barcodeScanner =
        null;

    }


    document
      .getElementById(
        "barcode-camera-area"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "openBarcodeBtn"
      )
      .classList
      .remove("hidden");


    showMessage(

      "barcode-message",

      "error",

      "❌ " +
      escapeHtml(
        error.message ||
        error
      )

    );

  }

}


/* =====================================================
   HANDLE BARCODE
===================================================== */

async function handleBarcodeScan(
  decodedText
){

  if(!barcodeScanning){

    return;

  }

  if(barcodeProcessing){

    return;

  }

  barcodeProcessing =
    true;


  const barcode =
    String(
      decodedText || ""
    ).trim();


  if(!barcode){

    barcodeProcessing =
      false;

    return;

  }


  await stopBarcodeScanner();


  document
    .getElementById(
      "barcode"
    )
    .value =
      barcode;


  await checkBarcode(
    barcode
  );

}


/* =====================================================
   STOP BARCODE
===================================================== */

async function stopBarcodeScanner(){

  barcodeScanning =
    false;


  if(barcodeScanner){

    try{

      await barcodeScanner.stop();

    }catch(e){}


    try{

      await barcodeScanner.clear();

    }catch(e){}


    barcodeScanner =
      null;

  }


  document
    .getElementById(
      "barcode-reader"
    )
    .innerHTML = "";


  document
    .getElementById(
      "barcode-camera-area"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "openBarcodeBtn"
    )
    .classList
    .remove("hidden");

}

           */

          return{

            width:
              Math.floor(
                width * .9
              ),

            height:
              Math.floor(
                Math.min(
                  height * .5,
                  300
                )
              )

          };

        },

        formatsToSupport:
          SKU_FORMATS

      },

      /*
       * ===============================
       * อ่าน SKU สำเร็จ
       * ===============================
       */

      function(decodedText){

        /*
         * ถ้ากล้องถูกปิดแล้ว
         * ไม่รับ callback
         */

        if(!skuScanning){

          return;

        }


        /*
         * ถ้ากำลังประมวลผล
         * ไม่รับซ้ำ
         */

        if(skuProcessing){

          return;

        }


        const sku =
          String(
            decodedText || ""
          ).trim();


        if(!sku){

          return;

        }


        /*
         * --------------------------------
         * จุดแก้ปัญหาหลัก
         * --------------------------------
         *
         * หลังเปิดกล้องใหม่
         * ถ้ายังอ่าน SKU ตัวเดิม
         * ให้ข้ามไปก่อน
         */

        if(

          waitForNewSku &&

          sku === lastScannedSku

        ){

          return;

        }


        /*
         * ถ้าเลยช่วงเริ่มต้นแล้ว
         * หรือเจอ SKU ตัวใหม่
         * ให้รับค่า
         */

        if(

          Date.now() -
          skuCameraOpenTime >=
          SKU_CAMERA_WARMUP

        ){

          waitForNewSku =
            false;

        }


        /*
         * ถ้าเป็น SKU ใหม่
         * รับทันที
         */

        if(
          sku !== lastScannedSku
        ){

          waitForNewSku =
            false;

        }


        /*
         * ล็อกก่อนหยุดกล้อง
         */

        skuProcessing =
          true;

        skuScanning =
          false;


        /*
         * จำ SKU ที่สแกน
         */

        lastScannedSku =
          sku;


        /*
         * หยุดกล้อง
         */

        stopSkuScanner()
          .then(
            function(){

              /*
               * ใส่ค่า SKU
               */

              document
                .getElementById(
                  "skuInput"
                )
                .value =
                  sku;


              /*
               * เพิ่ม SKU
               */

              addSku(
                sku
              );

            }
          );

      },

      function(errorMessage){

        /*
         * ไม่ต้องแสดง error
         */

      }

    );

  }catch(error){

    console.error(
      "SKU camera error:",
      error
    );


    skuScanning =
      false;

    skuProcessing =
      false;


    if(skuScanner){

      try{

        await skuScanner.stop();

      }catch(e){}


      try{

        await skuScanner.clear();

      }catch(e){}


      skuScanner =
        null;

    }


    document
      .getElementById(
        "sku-reader"
      )
      .innerHTML = "";


    document
      .getElementById(
        "sku-camera-area"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "openSkuBtn"
      )
      .classList
      .remove("hidden");


    showMessage(

      "sku-message",

      "error",

      "❌ " +
      escapeHtml(
        error.message ||
        error
      )

    );

  }

}


/* =====================================================
   STOP SKU SCANNER
===================================================== */

async function stopSkuScanner(){

  skuScanning =
    false;


  if(skuScanner){

    try{

      await skuScanner.stop();

    }catch(e){

      console.log(
        "SKU stop:",
        e
      );

    }


    try{

      await skuScanner.clear();

    }catch(e){

      console.log(
        "SKU clear:",
        e
      );

    }


    skuScanner =
      null;

  }


  document
    .getElementById(
      "sku-reader"
    )
    .innerHTML = "";


  document
    .getElementById(
      "sku-camera-area"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "openSkuBtn"
    )
    .classList
    .remove("hidden");

}


/* =====================================================
   MANUAL SKU
===================================================== */

function addSkuManual(){

  const sku =
    document
      .getElementById(
        "skuInput"
      )
      .value
      .trim();


  if(!sku){

    showMessage(

      "sku-message",

      "error",

      t("skuInput")

    );

    return;

  }


  addSku(
    sku
  );

}


/* =====================================================
   ADD SKU
===================================================== */

function addSku(sku){

  sku =
    String(
      sku || ""
    ).trim();


  if(!sku){

    skuProcessing =
      false;

    return;

  }


  /*
   * ไม่ตรวจ SKU ซ้ำ
   *
   * SKU เดิมสามารถเพิ่มได้
   * ถ้าผู้ใช้ตั้งใจสแกนซ้ำ
   */

  skus.push(
    sku
  );


  document
    .getElementById(
      "skuInput"
    )
    .value = "";


  renderSkuList();


  showMessage(

    "sku-message",

    "success",

    t("skuAdded")

  );


  skuProcessing =
    false;

}


/* =====================================================
   RENDER SKU
===================================================== */

function renderSkuList(){

  const box =
    document
      .getElementById(
        "skuList"
      );


  if(
    skus.length === 0
  ){

    box.innerHTML = `

      <div style="
        text-align:center;
        padding:15px;
        color:#777;
      ">

        ${escapeHtml(
          t("noSku")
        )}

      </div>

    `;

    return;

  }


  let html = "";


  skus.forEach(
    function(
      sku,
      index
    ){

      html += `

        <div class="sku-item">

          <input
            value="${escapeHtml(
              sku
            )}"
            readonly
          >

          <button
            class="delete-sku"
            onclick="removeSku(${index})"
          >

            🗑️

          </button>

        </div>

      `;

    }
  );


  box.innerHTML =
    html;

}


/* =====================================================
   REMOVE SKU
===================================================== */

function removeSku(index){

  if(
    index < 0 ||
    index >= skus.length
  ){

    return;

  }


  skus.splice(
    index,
    1
  );


  renderSkuList();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
