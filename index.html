<html lang="th">

<head>

    body {

    .container {
      max-width: 700px;

      border-radius: 18px;

    }

    .latest-title {
      background: #eaf8ec;

      font-weight: bold;

    }

    .latest-content {
      padding: 15px;

    }

    .latest-type {
      font-size: 15px;

    }

    .latest-value {

    .latest-time {

    .sku-section {

    .sku-input-row {

    .sku-input {

    .sku-button {
      width: 125px;

      background: #dff5df;
      color: #198c36;
      font-size: 16px;
      font-weight: bold;
    }

    .sku-list {
      margin-top: 12px;
    }

    .sku-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #eee;
      font-size: 16px;
    }

    .remove-sku {
      color: red;

      font-size: 20px;
      cursor: pointer;
    }

    .history {

      border-top: 1px solid #ddd;

    }

    .history-header {
      display: flex;
      justify-content: space-between;

      font-size: 18px;

    .refresh {

      background: none;
      font-size: 16px;
      cursor: pointer;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;

    }

    th {
      background: #e8f2ff;
      padding: 10px;
      white-space: nowrap;
    }

    td {
      padding: 9px;
      border-bottom: 1px solid #ddd;
      text-align: center;
      white-space: nowrap;
    }

    .badge-barcode {
      background: #e4efff;
      color: #1266d1;
      padding: 5px 9px;
      border-radius: 6px;
      font-weight: bold;
    }

    .badge-sku {
      background: #ddf5df;
      color: #168b32;
      padding: 5px 9px;
      border-radius: 6px;
      font-weight: bold;
    }

    .save-button {
      width: 100%;
      height: 58px;
      margin-top: 18px;
      border: none;
      border-radius: 10px;
      background: #20a947;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-button:disabled {
      background: #999;
    }

    .message {
      text-align: center;
      margin-top: 10px;
      min-height: 25px;
      font-weight: bold;
    }

    .tip {
      margin-top: 15px;
      padding: 12px;
      background: #fff8dc;
      border-radius: 8px;
      text-align: center;
      color: #174f9c;
    }

  </style>

</head>

<script>


// ==================================================
// ตัวแปรระบบ
// ==================================================

let scanner = null;

let cameraRunning = false;

let currentBarcode = "";

let pendingData = [];

let skuList = [];

let lastScan = "";

let lastScanTime = 0;


// ==================================================
// ชื่อเล่น
// ==================================================

const nicknames = {

  "นาย สหภาพ ทรัพย์บำเรอ": "เจ๋ง",
  "นาย รวีวัฒธ์ สีเสน": "โฟกัส",
  "นาย บัญชา ศุภศร": "ออย",
  "นาย ธีรพัฒน์ ขวานทอง": "ตี๋",
  "นาย ธวัชชัย นุกิจ": "อาร์ม",
  "นาง มัลลิกา เทียงดาห์": "พี่เปิ้น",
  "น.ส.ประกายดาว ประทังเจริญ": "เนส",
  "น.ส.กัลยา มูลพุ่มสาย": "พี่พลอย",
  "ZinMin htet": "ซินนิแถะ",
  "WIN THU RAIN": "พี่วิน",
  "WAI PHYO": "แวะพิว",
  "THIHA MIN WAI": "ตีห้า",
  "THANT ZIN OO": "ต้าซินอู้",
  "THANT ZIN AUNG": "ต้าซิงออง",
  "SI POE": "เซโป",
  "SAW WAH DO MOO": "ซอวัดตูมโม",
  "SAW SI BLU HSEL": "ซอ",
  "SAW SAY": "ซอเซ",
  "Saw Poe Chit": "ชิ",
  "SAW PATHI HTOO": "โพดา",
  "SAW JOE": "ซูจู",
  "SAW GAY DO HTOO": "ซอเค",
  "SAW ER KEN LAH": "ซอเอ",
  "SAN LIN": "ซาเลน",
  "PYAE PHYO HAN": "บี้พิวหา",
  "Pyae Phyo": "ปิพิว",
  "PAING PAING SOE": "ไปไปซู",
  "NJAING MTO KO": "ใน",
  "Myint Myat oo": "เมี๊ยะ",
  "MYAT MIN KO": "เมี๊ยะเมียกุ",
  "MOE KYAW KYAW": "โกโม",
  "MOE HTET KYAW": "โมทาจอง",
  "MG AYE LIN": "เอเลน",
  "KYAW TUN LIN": "จอ",
  "KYAW NAING TUN": "จอไนทู",
  "HTOO HTOO": "ทูทู",
  "EH SOE": "เอปโซ่",
  "EH POE": "เอปโพ่",
  "CHO CHO LWIN": "พี่เอ",
  "AUNG PAING SOE": "อองปัยซุ่",
  "หม่อโอมิ": "หม่อ"

};


// ==================================================
// เลือกพนักงาน
// ==================================================

document
  .getElementById("picker")
  .addEventListener("change", function() {

    document
      .getElementById("nickname")
      .innerText =
      nicknames[this.value] || "-";

  });


// ==================================================
// เปิดกล้อง
// ==================================================

function startCamera() {

  const picker =
    document.getElementById("picker");


  if (!picker.value) {

    showMessage(
      "⚠️ กรุณาเลือกชื่อพนักงานก่อน",
      "red"
    );

    return;

  }


  if (cameraRunning) {
    return;
  }


  document
    .getElementById("reader")
    .style.display = "block";


  document
    .getElementById("cameraButton")
    .disabled = true;


  scanner =
    new Html5Qrcode("reader");


  scanner
    .start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 150
        },

        aspectRatio: 1.777
      },

      onScanSuccess,

      function(error) {}

    )

    .then(function() {

      cameraRunning = true;

      showMessage(
        "📷 พร้อมสแกน",
        "blue"
      );

    })

    .catch(function(error) {

      console.log(error);

      document
        .getElementById("reader")
        .style.display = "none";


      document
        .getElementById("cameraButton")
        .disabled = false;


      showMessage(
        "❌ เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง",
        "red"
      );

    });

}


// ==================================================
// เมื่อสแกนสำเร็จ
// ==================================================

function onScanSuccess(decodedText) {

  const value =
    String(decodedText || "").trim();


  if (!value) {
    return;
  }


  const now = Date.now();


  // ป้องกันกล้องอ่านค่าเดิมซ้ำรัว ๆ
  // แต่สามารถอ่าน SKU เดิมได้หลังจากเวลาผ่านไป

  if (
    value === lastScan &&
    now - lastScanTime < 1200
  ) {

    return;

  }


  lastScan = value;

  lastScanTime = now;


  // ==================================================
  // ยังไม่มี Barcode
  // ค่าที่สแกน = Barcode
  // ==================================================

  if (!currentBarcode) {

    setBarcode(value);

    return;

  }


  // ==================================================
  // มี Barcode แล้ว
  // ค่าที่สแกนต่อไป = SKU
  //
  // SKU ซ้ำได้
  // ==================================================

  addSKUFromScan(value);

}


// ==================================================
// ตั้ง Barcode
// ==================================================

function setBarcode(barcode) {

  currentBarcode = barcode;

  skuList = [];


  document
    .getElementById("currentBarcode")
    .innerText = barcode;


  document
    .getElementById("latestType")
    .innerHTML =
    '<span class="badge-barcode">Barcode</span>';


  document
    .getElementById("latestValue")
    .innerText = barcode;


  document
    .getElementById("latestTime")
    .innerText =
    new Date().toLocaleString();


  renderSKUList();


  showMessage(
    "✅ Barcode สำเร็จ → สแกน SKU ต่อได้เลย",
    "green"
  );

}


// ==================================================
// เพิ่ม SKU จากกล้อง
//
// สำคัญ:
// SKU ซ้ำได้
// ไม่มี includes()
// ไม่มีการบล็อก SKU ซ้ำ
// ==================================================

function addSKUFromScan(sku) {

  sku =
    String(sku || "").trim();


  if (!currentBarcode) {

    showMessage(
      "⚠️ ต้องสแกน Barcode ก่อน",
      "red"
    );

    return;

  }


  if (!sku) {
    return;
  }


  // ==================================================
  // SKU ซ้ำได้
  // ==================================================

  skuList.push(sku);


  pendingData.push({

    time:
      new Date().toISOString(),

    name:
      document.getElementById("picker").value,

    barcode:
      currentBarcode,

    sku:
      sku

  });


  document
    .getElementById("latestType")
    .innerHTML =
    '<span class="badge-sku">SKU</span>';


  document
    .getElementById("latestValue")
    .innerText = sku;


  document
    .getElementById("latestTime")
    .innerText =
    new Date().toLocaleString();


  renderSKUList();


  showMessage(
    "✅ เพิ่ม SKU แล้ว",
    "green"
  );

}


// ==================================================
// เพิ่ม SKU จากช่องกรอก
// ==================================================

function addSKU() {

  const input =
    document.getElementById("skuInput");


  const sku =
    input.value.trim();


  if (!sku) {
    return;
  }


  addSKUFromScan(sku);


  input.value = "";

}


// ==================================================
// แสดงรายการ SKU
// ==================================================

function renderSKUList() {

  const container =
    document.getElementById("skuList");


  container.innerHTML = "";


  skuList.forEach(function(sku, index) {

    const div =
      document.createElement("div");


    div.className =
      "sku-item";


    div.innerHTML = `

      <span>
        ${index + 1}. ${escapeHtml(sku)}
      </span>

      <button
        class="remove-sku"
        onclick="removeSKU(${index})"
      >
        ×
      </button>

    `;


    container.appendChild(div);

  });

}


// ==================================================
// ลบ SKU
// ==================================================

function removeSKU(index) {

  const sku =
    skuList[index];


  skuList.splice(index, 1);


  // ลบเฉพาะข้อมูลรายการล่าสุดที่ตรงกัน
  // เพื่อให้ SKU ซ้ำสามารถมีหลายรายการได้

  let removed = false;

  pendingData =
    pendingData.filter(function(item) {

      if (
        !removed &&
        item.barcode === currentBarcode &&
        item.sku === sku
      ) {

        removed = true;

        return false;

      }

      return true;

    });


  renderSKUList();

}


// ==================================================
// บันทึกทั้งหมด
// ==================================================

function saveAll() {

  if (pendingData.length === 0) {

    showMessage(
      "⚠️ ยังไม่มีข้อมูลใหม่",
      "red"
    );

    return;

  }


  const button =
    document.getElementById("saveButton");


  button.disabled = true;

  button.innerText =
    "⏳ กำลังบันทึก...";


  google.script.run

    .withSuccessHandler(function(response) {

      if (response.success) {

        showMessage(
          "✅ บันทึก " +
          response.count +
          " รายการเรียบร้อยแล้ว",
          "green"
        );


        pendingData = [];

        loadHistory();


        button.innerText =
          "💾 บันทึกทั้งหมดลง Google Sheet";


        button.disabled = false;

      }

    })

    .withFailureHandler(function(error) {

      showMessage(
        "❌ บันทึกไม่สำเร็จ: " +
        error.message,
        "red"
      );


      button.innerText =
        "💾 บันทึกทั้งหมดลง Google Sheet";


      button.disabled = false;

    })

    .saveScans(pendingData);

}


// ==================================================
// โหลดประวัติ
// ==================================================

function loadHistory() {

  google.script.run

    .withSuccessHandler(function(data) {

      renderHistory(data);

    })

    .withFailureHandler(function(error) {

      console.log(error);

    })

    .getHistory();

}


// ==================================================
// แสดงประวัติ
// ==================================================

function renderHistory(data) {

  const body =
    document.getElementById("historyBody");


  body.innerHTML = "";


  if (!data || data.length === 0) {

    body.innerHTML = `

      <tr>

        <td colspan="5">
          ยังไม่มีข้อมูล
        </td>

      </tr>

    `;

    return;

  }


  data.forEach(function(item, index) {

    const isBarcode =
      item.barcode &&
      !item.sku;


    const type =
      isBarcode
        ? "Barcode"
        : "SKU";


    const value =
      isBarcode
        ? item.barcode
        : item.sku;


    const badge =
      isBarcode
        ? "badge-barcode"
        : "badge-sku";


    body.innerHTML += `

      <tr>

        <td>
          ${index + 1}
        </td>

        <td>
          ${escapeHtml(item.time || "")}
        </td>

        <td>
          ${escapeHtml(item.name || "")}
        </td>

        <td>

          <span class="${badge}">
            ${type}
          </span>

        </td>

        <td>
          ${escapeHtml(value || "")}
        </td>

      </tr>

    `;

  });

}


// ==================================================
// แสดงข้อความ
// ==================================================

function showMessage(text, color) {

  const message =
    document.getElementById("message");


  message.innerText = text;


  if (color === "red") {

    message.style.color = "red";

  }

  else if (color === "green") {

    message.style.color = "green";

  }

  else {

    message.style.color = "#1769d1";

  }

}


// ==================================================
// ป้องกัน HTML แปลก ๆ
// ==================================================

function escapeHtml(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


// ==================================================
// โหลดประวัติทันที
// ==================================================

window.onload = function() {

  loadHistory();

};


</script>
