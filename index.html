<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ระบบสแกน Barcode / SKU</title>

  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Thai", "Noto Sans Myanmar", sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 15px;
    }

    header {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #666;
      font-size: 18px;
    }

    section {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .section-title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #2196f3;
      box-shadow: 0 0 0 3px rgba(33,150,243,.15);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 19px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .btn-green {
      background: #16a34a;
      color: white;
    }

    .btn-blue {
      background: #2563eb;
      color: white;
    }

    .btn-gray {
      background: #6b7280;
      color: white;
    }

    .btn-red {
      background: #dc2626;
      color: white;
    }

    .camera-box {
      width: 100%;
      height: 300px;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
    }

    #barcodeVideo,
    #skuVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-message {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      text-align: center;
      font-size: 20px;
      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }

    .status {
      padding: 14px;
      border-radius: 10px;
      margin-top: 10px;
      font-size: 17px;
    }

    .status-success {
      background: #dcfce7;
      color: #166534;
    }

    .status-error {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-warning {
      background: #fef3c7;
      color: #92400e;
    }

    .status-info {
      background: #dbeafe;
      color: #1e40af;
    }

    .barcode-display {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 19px;
      background: #fafafa;
      min-height: 52px;
      word-break: break-all;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
      font-size: 17px;
    }

    th {
      background: #eef2f7;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 15px;
      margin: 0;
      width: auto;
      font-size: 16px;
    }

    .empty {
      padding: 20px;
      text-align: center;
      color: #777;
      font-size: 18px;
    }

    .save-area {
      position: sticky;
      bottom: 0;
      background: #f4f6f8;
      padding: 5px 0;
    }

    .loading {
      text-align: center;
      padding: 10px;
      color: #555;
    }

    @media (max-width: 600px) {

      .container {
        padding: 10px;
      }

      section {
        padding: 15px;
      }

      header h1 {
        font-size: 24px;
      }

      .section-title {
        font-size: 22px;
      }

      .camera-box {
        height: 260px;
      }

      th,
      td {
        font-size: 15px;
        padding: 8px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- ========================= -->
  <!-- HEADER -->
  <!-- ========================= -->

  <header>
    <h1>📦 ระบบสแกน Barcode / SKU</h1>
    <p>ระบบบันทึก Barcode และ SKU ลง Google Sheets</p>
  </header>


  <!-- ========================= -->
  <!-- พนักงาน -->
  <!-- ========================= -->

  <section>

    <div class="section-title">
      👤 ข้อมูลผู้สแกน
    </div>

    <label for="employee">
      ชื่อคนสแกน
    </label>

    <select id="employee">
      <option value="">-- เลือกชื่อพนักงาน --</option>
      <option value="SAN LIN">SAN LIN</option>
      <option value="朱美燕">朱美燕</option>
      <option value="高雲宏">高雲宏</option>
      <option value="其他">其他</option>
    </select>

    <div id="employeeStatus"></div>

  </section>


  <!-- ========================= -->
  <!-- BARCODE -->
  <!-- ========================= -->

  <section>

    <div class="section-title">
      📦 Barcode
    </div>

    <div class="camera-box">
      <video id="barcodeVideo" autoplay muted playsinline></video>

      <div id="barcodeMessage" class="camera-message">
        กดเปิดกล้องเพื่อสแกน Barcode
      </div>
    </div>

    <button
      id="barcodeCameraButton"
      class="btn-green"
      onclick="startBarcodeScanner()">
      📷 เปิดกล้องสแกน Barcode
    </button>

    <button
      id="barcodeStopButton"
      class="btn-gray hidden"
      onclick="stopBarcodeScanner()">
      ◼️ ปิดกล้อง
    </button>

    <label style="margin-top:15px;">
      Barcode ที่สแกนได้
    </label>

    <div id="barcodeDisplay" class="barcode-display">
      ยังไม่ได้สแกน
    </div>

    <div id="barcodeStatus"></div>

  </section>


  <!-- ========================= -->
  <!-- SKU -->
  <!-- ========================= -->

  <section>

    <div class="section-title">
      🏷️ SKU
    </div>

    <div class="camera-box">
      <video id="skuVideo" autoplay muted playsinline></video>

      <div id="skuMessage" class="camera-message">
        กดเปิดกล้องเพื่อสแกน SKU
      </div>
    </div>

    <button
      id="skuCameraButton"
      class="btn-green"
      onclick="startSkuScanner()">
      📷 เปิดกล้องสแกน SKU
    </button>

    <button
      id="skuStopButton"
      class="btn-gray hidden"
      onclick="stopSkuScanner()">
      ◼️ ปิดกล้อง
    </button>

    <label style="margin-top:15px;">
      SKU
    </label>

    <input
      id="skuInput"
      type="text"
      placeholder="สแกนหรือพิมพ์ SKU"
      autocomplete="off">

    <button
      class="btn-blue"
      onclick="addSku()">
      ➕ เพิ่ม SKU
    </button>

    <div id="skuStatus"></div>

  </section>


  <!-- ========================= -->
  <!-- รายการ SKU -->
  <!-- ========================= -->

  <section>

    <div class="section-title">
      📋 รายการ SKU
    </div>

    <div>
      จำนวน SKU:
      <strong id="skuCount">0</strong>
    </div>

    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>SKU</th>
          <th>ลบ</th>
        </tr>
      </thead>

      <tbody id="skuTableBody">
      </tbody>

    </table>

    <div
      id="emptySku"
      class="empty">
      ยังไม่มีรายการ
    </div>

  </section>


  <!-- ========================= -->
  <!-- SAVE -->
  <!-- ========================= -->

  <section class="save-area">

    <button
      id="saveButton"
      class="btn-green"
      onclick="saveData()">
      💾 บันทึกข้อมูลลง Google Sheets
    </button>

    <button
      class="btn-gray"
      onclick="clearAll()">
      🗑️ ล้างข้อมูล
    </button>

    <div id="saveStatus"></div>

  </section>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzVWMQQveZ5L1MWqVQXFE2PSDUvF7SemPP-pYBejcTE0s875mCgi-DU9OuyvexkYVoCUw/exec";


/* =========================================================
   GLOBAL
========================================================= */

let barcodeReader = null;
let skuReader = null;

let barcodeScanning = false;
let skuScanning = false;

let currentBarcode = "";

let skuList = [];


/* =========================================================
   ELEMENTS
========================================================= */

const employeeEl =
  document.getElementById("employee");

const barcodeVideo =
  document.getElementById("barcodeVideo");

const skuVideo =
  document.getElementById("skuVideo");

const barcodeDisplay =
  document.getElementById("barcodeDisplay");

const skuInput =
  document.getElementById("skuInput");

const skuTableBody =
  document.getElementById("skuTableBody");

const skuCount =
  document.getElementById("skuCount");

const emptySku =
  document.getElementById("emptySku");

const saveButton =
  document.getElementById("saveButton");


/* =========================================================
   STATUS
========================================================= */

function showStatus(elementId, message, type) {

  const el = document.getElementById(elementId);

  if (!message) {
    el.innerHTML = "";
    return;
  }

  el.innerHTML =
    `<div class="status status-${type}">
      ${message}
    </div>`;
}


/* =========================================================
   EMPLOYEE
========================================================= */

employeeEl.addEventListener("change", function() {

  if (this.value) {

    showStatus(
      "employeeStatus",
      "✅ เลือกผู้สแกน: " + this.value,
      "success"
    );

  } else {

    showStatus(
      "employeeStatus",
      "",
      ""
    );

  }

});


/* =========================================================
   BARCODE CAMERA
========================================================= */

async function startBarcodeScanner() {

  try {

    stopBarcodeScanner();

    barcodeReader =
      new ZXing.BrowserMultiFormatReader();

    barcodeScanning = true;

    document
      .getElementById("barcodeCameraButton")
      .classList.add("hidden");

    document
      .getElementById("barcodeStopButton")
      .classList.remove("hidden");

    document
      .getElementById("barcodeMessage")
      .innerText =
      "กำลังสแกน Barcode...";

    await barcodeReader.decodeFromVideoDevice(
      null,
      barcodeVideo,
      async function(result, error) {

        if (!barcodeScanning) {
          return;
        }

        if (result) {

          const code =
            result.getText().trim();

          if (code) {

            await handleBarcodeScan(code);

          }

        }

      }
    );

  } catch (error) {

    console.error(error);

    showStatus(
      "barcodeStatus",
      "❌ เปิดกล้องไม่ได้: " + error.message,
      "error"
    );

    stopBarcodeScanner();

  }

}


/* =========================================================
   STOP BARCODE
========================================================= */

function stopBarcodeScanner() {

  barcodeScanning = false;

  try {

    if (barcodeReader) {
      barcodeReader.reset();
      barcodeReader = null;
    }

  } catch (e) {
    console.log(e);
  }

  try {

    const stream =
      barcodeVideo.srcObject;

    if (stream) {

      stream
        .getTracks()
        .forEach(track => track.stop());

      barcodeVideo.srcObject = null;

    }

  } catch (e) {
    console.log(e);
  }

  document
    .getElementById("barcodeCameraButton")
    .classList.remove("hidden");

  document
    .getElementById("barcodeStopButton")
    .classList.add("hidden");

  document
    .getElementById("barcodeMessage")
    .innerText =
    "กดเปิดกล้องเพื่อสแกน Barcode";
}


/* =========================================================
   BARCODE SCAN
========================================================= */

async function handleBarcodeScan(code) {

  /* ป้องกันการสแกนซ้ำติดกันหลายครั้ง */
  if (!barcodeScanning) {
    return;
  }

  barcodeScanning = false;

  barcodeDisplay.innerText = code;

  stopBarcodeScanner();

  showStatus(
    "barcodeStatus",
    "🔍 กำลังตรวจสอบ Barcode...",
    "info"
  );

  try {

    const result =
      await checkBarcodeDuplicate(code);

    if (result.duplicate) {

      currentBarcode = "";

      barcodeDisplay.innerText =
        "ยังไม่ได้สแกน";

      showStatus(
        "barcodeStatus",
        "⚠️ Barcode ซ้ำ!<br><br>" +
        code +
        "<br><br>Barcode นี้ถูกบันทึกไว้แล้ว",
        "error"
      );

      /*
       * แจ้งเตือนทันที
       */
      alert(
        "⚠️ Barcode ซ้ำ!\n\n" +
        code +
        "\n\nBarcode นี้ถูกสแกนไปแล้ว"
      );

      return;
    }


    /* Barcode ใหม่ */

    currentBarcode = code;

    showStatus(
      "barcodeStatus",
      "✅ Barcode ใหม่ สามารถเพิ่ม SKU ได้",
      "success"
    );

    /*
     * เปิดช่อง SKU ให้ทันที
     */
    skuInput.focus();

  } catch (error) {

    currentBarcode = "";

    showStatus(
      "barcodeStatus",
      "❌ ตรวจสอบ Barcode ไม่สำเร็จ: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   CHECK BARCODE DUPLICATE
========================================================= */

async function checkBarcodeDuplicate(barcode) {

  const url =
    API_URL +
    "?action=checkBarcode&barcode=" +
    encodeURIComponent(barcode);

  const response =
    await fetch(url, {
      method: "GET",
      cache: "no-store"
    });

  if (!response.ok) {

    throw new Error(
      "HTTP " + response.status
    );

  }

  const text =
    await response.text();

  let data;

  try {

    data =
      JSON.parse(text);

  } catch (error) {

    /*
     * ถ้า Code.gs เวอร์ชันเก่า
     * ไม่รองรับ checkBarcode
     * ให้หยุดและแจ้งเตือน
     */
    throw new Error(
      "ระบบตรวจสอบ Barcode ไม่ตอบกลับเป็น JSON"
    );

  }

  return data;

}


/* =========================================================
   SKU CAMERA
========================================================= */

async function startSkuScanner() {

  if (!currentBarcode) {

    alert(
      "⚠️ กรุณาสแกน Barcode ก่อน"
    );

    return;
  }

  try {

    stopSkuScanner();

    skuReader =
      new ZXing.BrowserMultiFormatReader();

    skuScanning = true;

    document
      .getElementById("skuCameraButton")
      .classList.add("hidden");

    document
      .getElementById("skuStopButton")
      .classList.remove("hidden");

    document
      .getElementById("skuMessage")
      .innerText =
      "กำลังสแกน SKU...";

    await skuReader.decodeFromVideoDevice(
      null,
      skuVideo,
      function(result, error) {

        if (!skuScanning) {
          return;
        }

        if (result) {

          const code =
            result.getText().trim();

          if (code) {

            skuInput.value = code;

            addSku();

            stopSkuScanner();

          }

        }

      }
    );

  } catch (error) {

    console.error(error);

    showStatus(
      "skuStatus",
      "❌ เปิดกล้องไม่ได้: " +
      error.message,
      "error"
    );

    stopSkuScanner();

  }

}


/* =========================================================
   STOP SKU CAMERA
========================================================= */

function stopSkuScanner() {

  skuScanning = false;

  try {

    if (skuReader) {

      skuReader.reset();

      skuReader = null;

    }

  } catch (e) {
    console.log(e);
  }

  try {

    const stream =
      skuVideo.srcObject;

    if (stream) {

      stream
        .getTracks()
        .forEach(track => track.stop());

      skuVideo.srcObject = null;

    }

  } catch (e) {
    console.log(e);
  }

  document
    .getElementById("skuCameraButton")
    .classList.remove("hidden");

  document
    .getElementById("skuStopButton")
    .classList.add("hidden");

  document
    .getElementById("skuMessage")
    .innerText =
    "กดเปิดกล้องเพื่อสแกน SKU";
}


/* =========================================================
   ADD SKU
========================================================= */

function addSku() {

  const sku =
    skuInput.value.trim();

  if (!currentBarcode) {

    showStatus(
      "skuStatus",
      "⚠️ กรุณาสแกน Barcode ก่อน",
      "warning"
    );

    return;
  }

  if (!sku) {

    showStatus(
      "skuStatus",
      "⚠️ กรุณาสแกนหรือกรอก SKU",
      "warning"
    );

    skuInput.focus();

    return;
  }


  /*
   * สำคัญ:
   * SKU ซ้ำได้
   *
   * ดังนั้นไม่มีการเช็กว่า SKU ซ้ำหรือไม่
   */

  skuList.push(sku);

  skuInput.value = "";

  renderSkuTable();

  showStatus(
    "skuStatus",
    "✅ เพิ่ม SKU สำเร็จ",
    "success"
  );

  skuInput.focus();

}


/* =========================================================
   RENDER SKU
========================================================= */

function renderSkuTable() {

  skuCount.innerText =
    skuList.length;

  skuTableBody.innerHTML = "";

  if (skuList.length === 0) {

    emptySku.classList.remove("hidden");

    return;

  }

  emptySku.classList.add("hidden");


  skuList.forEach(function(sku, index) {

    const tr =
      document.createElement("tr");

    tr.innerHTML = `

      <td>
        ${index + 1}
      </td>

      <td>
        ${escapeHtml(sku)}
      </td>

      <td>

        <button
          class="delete-btn"
          onclick="deleteSku(${index})">

          ลบ

        </button>

      </td>

    `;

    skuTableBody.appendChild(tr);

  });

}


/* =========================================================
   DELETE SKU
========================================================= */

function deleteSku(index) {

  skuList.splice(index, 1);

  renderSkuTable();

  showStatus(
    "skuStatus",
    "🗑️ ลบ SKU แล้ว",
    "info"
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* =========================================================
   SAVE DATA
========================================================= */

async function saveData() {

  const employee =
    employeeEl.value.trim();

  const barcode =
    currentBarcode.trim();


  /* ตรวจพนักงาน */

  if (!employee) {

    alert(
      "⚠️ กรุณาเลือกชื่อพนักงาน"
    );

    employeeEl.focus();

    return;

  }


  /* ตรวจ Barcode */

  if (!barcode) {

    alert(
      "⚠️ กรุณาสแกน Barcode ก่อน"
    );

    return;

  }


  /* ตรวจ SKU */

  if (skuList.length === 0) {

    alert(
      "⚠️ กรุณาเพิ่ม SKU อย่างน้อย 1 รายการ"
    );

    skuInput.focus();

    return;

  }


  saveButton.disabled = true;

  saveButton.innerText =
    "⏳ กำลังบันทึก...";

  showStatus(
    "saveStatus",
    "⏳ กำลังบันทึกข้อมูล...",
    "info"
  );


  try {

    const payload = {

      employee: employee,

      barcode: barcode,

      skus: skuList

    };


    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify(payload)

      });


    const text =
      await response.text();

    console.log(
      "Server response:",
      text
    );


    let result;

    try {

      result =
        JSON.parse(text);

    } catch (error) {

      throw new Error(
        "เซิร์ฟเวอร์ตอบกลับไม่ใช่ JSON"
      );

    }


    /* ==========================
       BARCODE ซ้ำ
    ========================== */

    if (
      result.duplicate === true
    ) {

      alert(
        "⚠️ Barcode ซ้ำ!\n\n" +
        barcode
      );

      showStatus(
        "saveStatus",
        "⚠️ Barcode นี้ถูกสแกนไปแล้ว",
        "error"
      );

      return;

    }


    /* ==========================
       ERROR
    ========================== */

    if (
      result.success !== true
    ) {

      throw new Error(
        result.message ||
        "บันทึกไม่สำเร็จ"
      );

    }


    /* ==========================
       SUCCESS
    ========================== */

    showStatus(
      "saveStatus",
      "✅ บันทึกข้อมูลสำเร็จแล้ว",
      "success"
    );

    alert(
      "✅ บันทึกข้อมูลเรียบร้อยแล้ว"
    );


    /*
     * ล้างข้อมูลหลังบันทึกสำเร็จ
     */
    resetForm();


  } catch (error) {

    console.error(error);

    showStatus(
      "saveStatus",
      "❌ บันทึกไม่สำเร็จ: " +
      error.message,
      "error"
    );

  } finally {

    saveButton.disabled = false;

    saveButton.innerText =
      "💾 บันทึกข้อมูลลง Google Sheets";

  }

}


/* =========================================================
   RESET FORM
========================================================= */

function resetForm() {

  stopBarcodeScanner();

  stopSkuScanner();

  currentBarcode = "";

  skuList = [];

  barcodeDisplay.innerText =
    "ยังไม่ได้สแกน";

  skuInput.value = "";

  renderSkuTable();

  showStatus(
    "barcodeStatus",
    "",
    ""
  );

  showStatus(
    "skuStatus",
    "",
    ""
  );

  employeeEl.value = "";

}


/* =========================================================
   CLEAR ALL
========================================================= */

function clearAll() {

  if (
    !confirm(
      "ต้องการล้างข้อมูลทั้งหมดหรือไม่?"
    )
  ) {

    return;

  }

  currentBarcode = "";

  skuList = [];

  barcodeDisplay.innerText =
    "ยังไม่ได้สแกน";

  skuInput.value = "";

  renderSkuTable();

  showStatus(
    "barcodeStatus",
    "",
    ""
  );

  showStatus(
    "skuStatus",
    "🗑️ ล้างข้อมูลแล้ว",
    "info"
  );

}


/* =========================================================
   ENTER KEY = ADD SKU
========================================================= */

skuInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      addSku();

    }

  }
);


/* =========================================================
   INIT
========================================================= */

renderSkuTable();

console.log(
  "Barcode Scanner loaded"
);

console.log(
  "API:",
  API_URL
);

</script>
